until hot for about 2 minutes, and add in the gelatin powder.", "Quickly stir until gelatin is dissolved, about 5 minutes.", "Pour the gelatin mixture over the cream cheese and whisk again until smooth.", "Pour the cheesecake mixture over the baked banana bread and cool for 3 hours or overnight."]}], "slug": "banana-bread-bottom-cheesecake", "cat": "Cakes and Cheesecakes"}, "banana-cake-with-banana-pastry-cream-cream-cheese-frosting-and-caramel": {"title": "Banana Cake with Banana Pastry Cream, Cream Cheese Frosting and Caramel", "meta": "Time: Bake 35-40 min at 350F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Banana Cake"}, {"type": "ul", "items": ["3 ripe bananas, mashed", "1/4 cup unsalted butter", "1/4 cup neutral oil", "1/2 cup brown sugar", "1/4 cup granulated sugar", "2 large eggs, room temperature", "1/2 cup plain yogurt or sour cream, room temperature", "1/2 cup milk, room temperature", "1 tsp vanilla extract", "2 cups all-purpose flour", "1 1/2 tsp baking powder", "1/2 tsp baking soda", "1/4 tsp salt", "1 tsp ground cinnamon"]}, {"type": "sub", "text": "For Topping"}, {"type": "ul", "items": ["2 bananas, sliced", "Caramel sauce, for drizzling"]}, {"type": "sub", "text": "Banana Pastry Cream"}, {"type": "ul", "items": ["1 can evaporated milk", "1 banana", "1/2 cup granulated sugar", "2 egg yolks (room temperature)", "2 tbsp cornstarch", "1 tsp banana extract", "1 tsp vanilla extract"]}, {"type": "sub", "text": "Cream Cheese Frosting"}, {"type": "ul", "items": ["8 oz cream cheese, softened", "3-4 tbsp powdered sugar", "2 tbsp heavy cream", "1 tsp vanilla extract"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Banana Pastry Cream: Blend 1 banana + evaporated milk. Whisk with sugar, egg yolks & cornstarch in a saucepan. Cook over medium-low heat, whisking constantly, until thickened. Remove from heat and add banana & vanilla extracts. Cover and cool completely.", "Brown Butter: Melt butter until golden brown and nutty. Let cool.", "Banana Cake: Preheat oven to 350F. Mix brown butter, sugars & oil. Add eggs, yogurt/sour cream, milk, vanilla, and mashed bananas. In a separate bowl, combine flour, baking powder, baking soda, salt & cinnamon. Gradually add dry ingredients and mix until just combined.", "Pour into a prepared pan and bake 35-40 minutes. Cool completely.", "Cream Cheese Frosting: Beat cream cheese until smooth. Add powdered sugar, heavy cream & vanilla. Beat until fluffy.", "Assemble: Poke holes into the cake and pour banana pastry cream over the top. Add sliced bananas, then spread with cream cheese frosting. Drizzle with..."]}, {"type": "p", "text": "Note: Directions cut off mid-way through the Assemble step (presumably caramel drizzle). Instructions came from the creator's comment; creator handle not visible."}], "slug": "banana-cake-with-banana-pastry-cream-cream-cheese-frosting-and-caramel", "cat": "Cakes and Cheesecakes"}, "blueberry-skillet-cake": {"title": "Blueberry Skillet Cake", "meta": "Time: Not listed  |  Source: Manuela (cookwithmanuela) (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["4 oz (115g) cream cheese", "1 tablespoon powdered sugar, plus more for dusting", "Zest of 1 lemon", "3/4 cup (190ml) milk", "1 large egg", "1 teaspoon vanilla extract", "1/2 cup (100g) granulated sugar", "1 cup (120g) all-purpose flour", "1/2 tablespoon baking powder", "1/2 tsp salt", "2 cups (300g) fresh blueberries", "2 oz (55g) unsalted butter", "Ice cream, for serving"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Directions are on the creator's site; search \"Manuela blueberry skillet cake\". Saved from Instagram: https://www.instagram.com/p/C5d1mU_RI4L/"}], "slug": "blueberry-skillet-cake", "cat": "Cakes and Cheesecakes"}, "cannoli-poke-cake": {"title": "Cannoli Poke Cake", "meta": "Time: Bake 25 min at 350F, chill a couple of hours  |  Source: aldentediva.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cake"}, {"type": "ul", "items": ["1 box French Vanilla Cake Mix", "1 stick Butter, melted", "1 cup Milk", "3 Eggs", "1 teaspoon Cinnamon", "14 oz can Sweet Condensed Milk", "1 teaspoon Cocoa Powder", "1 cup Mini Chocolate Chips (divided)", "2 Waffle Cones, crushed"]}, {"type": "sub", "text": "Whipped Frosting"}, {"type": "ul", "items": ["1 stick Butter, softened", "8 oz Mascarpone Cheese", "½ cup Ricotta Cheese", "1 teaspoon Vanilla", "½ cup Heavy Cream", "1 cup Powdered Sugar"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350°.", "In a large bowl, mix together the cake mix, melted butter, milk, cinnamon and eggs using a hand mixer and place the batter into a 9 x 13\" greased baking dish.", "Smooth the batter out so that it's flat and even then place it in the oven for 25 minutes.", "Once the cake is done, using the back of a wooden spoon, poke holes in the cake about a half an inch apart.", "In a small bowl, whisk together the sweet condensed milk and cocoa powder and pour the mixture evenly over the cake and into the holes.", "Sprinkle the top with half of the mini chocolate chips and place it into the refrigerator to set and cool for a couple of hours.", "To prepare the frosting, beat together the softened butter, mascarpone, ricotta and vanilla then mix in the heavy cream.", "Slowly add in the powdered sugar while mixing everything together.", "Add the whipped frosting to the top of the cake and smooth it out so that it's flat and even.", "Finally, add the rest of the mini chocolate chips and the crushed waffle cones to the top. Serve and enjoy!"]}], "slug": "cannoli-poke-cake", "cat": "Cakes and Cheesecakes"}, "carrot-cake-with-cream-cheese-frosting": {"title": "Carrot Cake with Cream Cheese Frosting", "meta": "Time: Not listed  |  Source: Ambitious Kitchen", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1/3 cup (80g) almond or coconut milk", "1/3 cup (37g) chopped pecans or walnuts, plus 2 tablespoons (14g) for topping"]}, {"type": "sub", "text": "Optional add-ins"}, {"type": "ul", "items": ["1/2 cup (80g) raisins", "1/2 cup (42g) unsweetened shredded coconut"]}, {"type": "sub", "text": "For the frosting"}, {"type": "ul", "items": ["4 oz (112g) cream cheese, softened (reduced fat if you'd like)", "1/3 cup (38g) powdered sugar", "1/4 teaspoon cinnamon", "1/2 teaspoon vanilla extract"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Only the end of the ingredient list is visible; earlier cake ingredients and all steps not shown in screenshot."}], "slug": "carrot-cake-with-cream-cheese-frosting", "cat": "Cakes and Cheesecakes"}, "cherry-almond-ricotta-cake": {"title": "Cherry Almond Ricotta Cake", "meta": "Time: Total 55 min; bake 35-40 min at 350F  |  Servings: 8  |  Source: gemmir.com (Maggie Hart)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 1/2 cups ricotta cheese", "3/4 cup sugar", "1/2 cup unsalted butter, softened", "3 large eggs", "1 teaspoon vanilla extract", "1 teaspoon almond extract", "1 1/2 cups all-purpose flour", "1 teaspoon baking powder", "1/4 teaspoon salt", "1 cup pitted cherries, halved", "1/4 cup sliced almonds"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350°F (175°C).", "Grease and flour a 9-inch round cake pan.", "In a large bowl, beat the ricotta cheese, sugar, and butter until smooth.", "Add eggs, vanilla extract, and almond extract; mix until combined.", "In another bowl, whisk together flour, baking powder, and salt.", "Gradually add dry ingredients to the wet ingredients, mixing until just combined.", "Fold in the cherries and sliced almonds.", "Pour the batter into the prepared cake pan and smooth the top.", "Bake for 35-40 minutes until a toothpick inserted into the center comes out clean.", "Allow to cool in the pan for 10 minutes, then transfer to a wire rack to cool completely.", "Serve as is or dust with powdered sugar."]}, {"type": "p", "text": "Note: Recipe notes section hidden behind an ad."}], "slug": "cherry-almond-ricotta-cake", "cat": "Cakes and Cheesecakes"}, "chocolate-eclair-cake": {"title": "Chocolate Eclair Cake", "meta": "Time: Chill overnight  |  Source: macy.blackwell (recipe from kristindyal) (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Pudding layer"}, {"type": "ul", "items": ["2 packages instant vanilla pudding", "5 cups milk", "Jumbo tub of Cool Whip"]}, {"type": "sub", "text": "Chocolate topping"}, {"type": "ul", "items": ["1 cup sugar", "1/2 cup milk", "2/3 cup cocoa powder", "1 1/2 sticks of butter", "1/3 cup chocolate chips", "Splash of vanilla"]}, {"type": "sub", "text": "Layers"}, {"type": "ul", "items": ["Graham crackers"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mix together the pudding mix and milk until the pudding has set up. Fold in the Cool Whip. Set aside.", "Add the sugar, cocoa powder, and milk to a saucepan. Whisk and heat until bubbling (a couple minutes).", "On low heat, add the butter and chocolate chips.", "Remove from heat and add the vanilla. Stir to combine.", "In a 9 x 13 dish, layer graham crackers on the bottom. It doesn't have to look pretty.", "Add the pudding layer.", "Add another layer of graham crackers.", "Pour over the chocolate and spread to completely cover the graham cracker layer.", "Cover and chill overnight."]}, {"type": "p", "text": "Note: No-bake. Section headings added for clarity; the caption lists the ingredients as one list. Saved from Instagram: https://www.instagram.com/p/C48MGwtuD_u/"}], "slug": "chocolate-eclair-cake", "cat": "Cakes and Cheesecakes"}, "churro-cheesecake": {"title": "Churro Cheesecake", "meta": "Time: Bake 40-45 min at 350F; chill at least 3-4 hours  |  Source: Britney (Facebook)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Filling"}, {"type": "ul", "items": ["3 blocks (8 oz each) cream cheese, softened", "½ cup sour cream", "3 eggs", "½ tbsp vanilla extract", "1 can sweetened condensed milk", "⅓ cup sugar", "Pinch of cinnamon"]}, {"type": "sub", "text": "Cinnamon Sugar Mix"}, {"type": "ul", "items": ["½ cup sugar", "½ tbsp cinnamon"]}, {"type": "sub", "text": "Other"}, {"type": "ul", "items": ["2 crescent roll dough sheets", "Fresh strawberries (optional)", "Extra condensed milk for topping (optional)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a bowl, mix together cream cheese, sour cream, eggs, vanilla, sweetened condensed milk, ⅓ cup sugar, and a pinch of cinnamon until smooth. Set aside.", "In a separate bowl, mix ½ cup sugar with ½ tbsp cinnamon.", "Grease a 13x9 baking dish and sprinkle half of the cinnamon sugar on the bottom.", "Lay one crescent roll sheet over the sugar.", "Pour in the cheesecake filling and spread evenly.", "Place the second crescent dough sheet on top, then sprinkle with the remaining cinnamon sugar.", "Bake at 350°F for 40-45 minutes.", "Let cool in the fridge for at least 3-4 hours before slicing.", "Top with fresh strawberries and a drizzle of condensed milk (optional but so good)."]}], "slug": "churro-cheesecake", "cat": "Cakes and Cheesecakes"}, "doctored-boxed-cake-mix": {"title": "Doctored Boxed Cake Mix", "meta": "Time: Bake according to package directions  |  Source: r/coolguides", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 box cake mix, plus what the box calls for", "1 extra egg (or 2 for an even richer cake)", "Melted butter, double the amount of oil called for", "Milk, in place of the water (equal amount)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Read the directions on the cake mix.", "Add 1 more egg (or 2 for an even richer cake).", "Replace the oil with melted butter and double the amount.", "Replace the water with an equal amount of milk.", "Mix and bake according to package directions."]}, {"type": "p", "text": "Note: Tip for making a boxed cake taste like it came from a bakery."}], "slug": "doctored-boxed-cake-mix", "cat": "Cakes and Cheesecakes"}, "healthy-banana-carrot-cake": {"title": "Healthy Banana Carrot Cake", "meta": "Time: Bake 45 min at 350F  |  Source: James Bok", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Bananas (2 mashed)", "Eggs (2)", "Greek yogurt (1/2 cup)", "Maple syrup (3 tbsp)", "Oat flour (2 cups)", "Baking powder (2 tsp)", "Carrots (1 cup shredded)", "Optional ingredients: dates (6 pitted), nuts (3/4 cup), cinnamon (1 tsp), salt (dash)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Bake at 350F for 45 minutes."]}, {"type": "p", "text": "Note: No refined sugars, no oils, gluten-free. Mixing steps not shown in screenshot."}], "slug": "healthy-banana-carrot-cake", "cat": "Cakes and Cheesecakes"}, "lemon-blueberry-cream-cheese-coffee-cake": {"title": "Lemon Blueberry Cream Cheese Coffee Cake", "meta": "Time: Prep 30 min, Cook 1 hr 5 min, Total 1 hr 35 min  |  Servings: 12  |  Source: The Recipe Rebel (Ashley Fehr)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Crumb Topping"}, {"type": "ul", "items": ["1/2 cup butter, melted", "1 1/2 cups all-purpose flour", "3/4 cup packed brown sugar", "1 teaspoon vanilla"]}, {"type": "sub", "text": "Cake"}, {"type": "ul", "items": ["1/4 cup melted butter", "1/4 cup canola oil", "1 cup granulated sugar", "2 large eggs", "1 teaspoon vanilla", "1 cup plain yogurt or sour cream", "1/4 cup lemon juice (about one lemon)", "2 tablespoons lemon zest (from 2 lemons)", "2 cups all-purpose flour (260 grams)", "1 teaspoon baking powder", "1/2 teaspoon baking soda", "1/2 teaspoon salt", "2 cups fresh or frozen blueberries*"]}, {"type": "sub", "text": "Cream Cheese Filling"}, {"type": "ul", "items": ["250 grams cream cheese (8 oz, 1 package)", "1/4 cup granulated sugar", "1 large egg", "zest from one lemon"]}, {"type": "sub", "text": "Lemon Glaze"}, {"type": "ul", "items": ["3/4 cup powdered icing sugar", "1 tablespoon lemon juice"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 350 degrees F. Line a 9-10\" springform pan (mine is 9.5\") with parchment paper (you can do this by laying it on the base and closing the sides around it with the paper sticking out the bottom), and spray with non-stick spray.", "Make the crumble: In a medium bowl, combine melted butter, flour, sugar and vanilla until crumbly. Set aside.", "Make the cake: In a large bowl, whisk together butter, oil and sugar for 2-3 minutes.", "Add the eggs, vanilla, yogurt, lemon juice and zest and whisk until combined.", "Add flour, baking powder, baking soda and salt and stir just until combined. Stir in blueberries and set aside.", "Cream cheese filling: With an electric mixer, beat cream cheese, sugar, egg and lemon zest until smooth.", "Assemble: Spread 1/2 of the cake batter into the bottom of the prepared pan.", "Spread cream cheese filling in the center, try to stay away from the edge of the pan if possible.", "Top with remaining cake batter and spread to cover as much of the cream cheese as possible.", "Sprinkle the crumb topping over top.", "Bake at 350 degrees F for 60-70 minutes, or until center is set and does not jiggle when moved. It's a very moist cake, so don't worry about baking so long, you don't want an unbaked center! It could take up to 80 minutes.", "Glaze: Whisk together powdered sugar and lemon juice.", "Let cake cool to room temperature (not a must but it will be easier to slice!) and drizzle the glaze over top. Serve."]}, {"type": "p", "text": "Note: *Frozen blueberries will release more moisture as they bake, so you may want to reduce the oil to 2 tablespoons if using frozen berries. https://www.thereciperebel.com/lemon-blueberry-cream-cheese-coffee-cake/"}], "slug": "lemon-blueberry-cream-cheese-coffee-cake", "cat": "Cakes and Cheesecakes"}, "lime-cake-with-icing": {"title": "Lime Cake with Icing", "meta": "Time: 325F for 45-55 (units not stated)  |  Source: Jose el Cook", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cake"}, {"type": "ul", "items": ["2 limes", "3 eggs", "175g sugar", "50g whole milk", "65g neutral oil", "1 Tbsp vanilla bean paste", "1/4 tsp salt", "250g AP flour", "2 1/2 tsp baking powder"]}, {"type": "sub", "text": "Icing"}, {"type": "ul", "items": ["1 cup powdered sugar", "1 tsp lime juice", "2 Tbsp water"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["325F for 45-55."]}, {"type": "p", "text": "Note: Steps not shown in screenshot; only the bake temperature and time are given."}], "slug": "lime-cake-with-icing", "cat": "Cakes and Cheesecakes"}, "maple-glazed-apple-fritter-cake": {"title": "Maple Glazed Apple Fritter Cake", "meta": "Time: Bake 35-45 min at 350F  |  Servings: One 8x8 pan  |  Source: audreybakes", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cake"}, {"type": "ul", "items": ["1/2 cup (113g) unsalted butter, softened", "1/2 cup (100g) granulated sugar", "1/4 cup (50g) brown sugar", "2 eggs, room temp", "2 tsp vanilla extract/paste", "1/2 cup (120g) sour cream, room temp", "2 tbsp (30g) whole milk, room temp", "1 2/3 cups (200g) all-purpose flour, spooned & leveled or weighed (don't pack it in)", "2 tsp baking powder", "1/2 tsp salt", "1/2 tsp cinnamon", "1/8 tsp nutmeg"]}, {"type": "sub", "text": "Apples"}, {"type": "ul", "items": ["2 cups diced apples (~2 medium apples, peeled, cored, and diced small)", "2 tbsp (25g) granulated sugar", "1 tsp cinnamon"]}, {"type": "sub", "text": "Cinnamon Sugar Layer"}, {"type": "ul", "items": ["1/3 cup (67g) packed brown sugar", "2 tsp cinnamon"]}, {"type": "sub", "text": "Maple Glaze"}, {"type": "ul", "items": ["1 cup (120g) powdered sugar", "2 tbsp milk (adjust for desired consistency)", "1 tbsp maple syrup (you can adjust to taste)", "1/2 tsp vanilla extract/paste", "Pinch salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a bowl, combine the ingredients for the cinnamon apples. In a separate bowl, make the cinnamon sugar. Set them both aside.", "Preheat oven to 350F and line/grease a 8x8 pan.", "Cream the softened butter and both sugars until light and fluffy, about 2-3 minutes.", "Beat in the eggs and vanilla.", "In a separate bowl, whisk together the flour, baking powder, and salt.", "Alternate adding the flour mixture and the milk/sour cream, starting & ending with the flour. Gently mix between each addition.", "Don't over mix, stop as soon as everything is incorporated.", "Add half the batter to the prepared pan, smoothing it out.", "Add a layer of half the cinnamon apples and sprinkle half of the cinnamon sugar on top.", "Add the rest of the batter, followed by the rest of the apples, then the rest of the cinnamon sugar.", "Bake for 35-45 minutes or until a toothpick comes out clean/with just a few moist crumbs.", "Let it cool.", "Drizzle the glaze over the completely cooled cake. Enjoy!"]}, {"type": "p", "text": "Note: Instructions do not mention when to add the cinnamon and nutmeg or how to mix the glaze."}], "slug": "maple-glazed-apple-fritter-cake", "cat": "Cakes and Cheesecakes"}, "microwave-sponge-mug-cake-with-jam-or-golden-syrup": {"title": "Microwave Sponge Mug Cake with Jam or Golden Syrup", "meta": "Time: Microwave 2.5 min plus 30 sec bursts, stand 5 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Equal weight of each:", "eggs (weigh these first in the shell)", "flour (self raising OR plain with 5g baking powder per 100g)", "sugar", "butter", "1tsp vanilla extract", "A couple tablespoons of jam or golden syrup, for topping"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Combine all ingredients in a bowl until smooth.", "Top with a couple tablespoons of jam or golden syrup.", "Microwave until the batter stops growing and is just slightly shiny on top. Start with 2.5 minutes and burst for 30 seconds at a time until cooked. Keep an eye on it while cooking.", "Leave to stand for 5 minutes while you whip up some Bird's instant custard for the most authentic experience."]}, {"type": "p", "text": "Note: Creator handle not visible in screenshot."}], "slug": "microwave-sponge-mug-cake-with-jam-or-golden-syrup", "cat": "Cakes and Cheesecakes"}, "mini-chocolate-chip-cookie-cheesecakes": {"title": "Mini Chocolate Chip Cookie Cheesecakes", "meta": "Time: Not listed  |  Servings: 9 cheesecakes  |  Source: Fitwaffle (via dessertworlddd) (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Base"}, {"type": "ul", "items": ["150g crunchy cookies", "60g unsalted butter, melted"]}, {"type": "sub", "text": "Cheesecake"}, {"type": "ul", "items": ["450ml double cream, cold", "350g cream cheese, room temp", "120g icing sugar", "70g chocolate chips (any)"]}, {"type": "sub", "text": "Optional topping"}, {"type": "ul", "items": ["Whipped cream", "Chocolate chips", "1/2 crunchy cookie for each"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps are in the video (\"sound on for full instructions\"). Saved from Instagram: https://www.instagram.com/p/CdnkzTUokzm/"}], "slug": "mini-chocolate-chip-cookie-cheesecakes", "cat": "Cakes and Cheesecakes"}, "protein-cinnamon-roll-cheesecake": {"title": "Protein Cinnamon Roll Cheesecake", "meta": "Time: Bake 45-50 min at 180C (356F), chill 1-2 hours  |  Source: Food Journalista", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cheesecake"}, {"type": "ul", "items": ["500g low-fat fresh cheese (or substitute with 1 cup cottage cheese + 1 cup Greek yogurt)", "2 eggs", "1/4 cup maple syrup", "1/4 cup cornstarch", "1 tsp cinnamon"]}, {"type": "sub", "text": "Topping"}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Blend all the ingredients together until smooth. Pour half of the mixture into a lined baking dish (15 x 20 cm). Swirl in some of the cinnamon-sugar mixture. Add the remaining cheesecake mixture on top and add more cinnamon-sugar mixture. Create swirls using a spoon.", "Bake at 180°C (356°F) for 45-50 minutes. Let it cool completely, then transfer to the fridge for 1-2 hours.", "Slice and enjoy!"]}, {"type": "p", "text": "Note: Topping (cinnamon-sugar mixture) ingredients cut off in screenshot."}], "slug": "protein-cinnamon-roll-cheesecake", "cat": "Cakes and Cheesecakes"}, "pumpkin-flan-cake": {"title": "Pumpkin Flan Cake", "meta": "Time: Not listed  |  Source: daisyannalycampuzano (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Pumpkin flan"}, {"type": "ul", "items": ["5 eggs", "1 can evaporated milk", "1 can sweetened condensed milk", "1 tbsp vanilla extract", "1/2 cup pumpkin puree", "1 1/2 tsp pumpkin spice", "1/8 tsp salt"]}, {"type": "sub", "text": "Caramel sauce"}, {"type": "ul", "items": ["1 cup sugar"]}, {"type": "sub", "text": "Pumpkin cake"}, {"type": "ul", "items": ["2 cups all-purpose flour", "1 cup sugar", "1/2 cup brown sugar", "2 tsp pumpkin spice", "1/8 tsp salt", "1 tsp baking soda", "2 tsp baking powder", "1 tbsp vanilla extract", "4 eggs", "1 cup olive oil", "15 oz pumpkin puree (or the leftovers from the can used for the flan)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Saved from Instagram: https://www.instagram.com/p/CzT_EOepsWR/"}], "slug": "pumpkin-flan-cake", "cat": "Cakes and Cheesecakes"}, "ricotta-cheesecake-with-orange": {"title": "Ricotta Cheesecake with Orange", "meta": "Time: Bake 50-60 min at 350F; cool 1 hr in oven; chill at least 4 hr  |  Source: Recipes Vibes (Facebook)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Crust"}, {"type": "ul", "items": ["1 1/2 cups almond flour", "1/2 cup granulated sugar", "1/4 cup unsalted butter, melted", "1/4 teaspoon salt"]}, {"type": "sub", "text": "Filling"}, {"type": "ul", "items": ["2 cups ricotta cheese", "1 cup cream cheese, softened", "3/4 cup granulated sugar", "3 large eggs", "Zest of 1 orange", "1 teaspoon vanilla extract", "1 tablespoon all-purpose flour"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat your oven to 350F (175C). Grease a 9-inch springform pan.", "In a bowl, mix the almond flour, 1/2 cup sugar, melted butter, and salt until combined. Press this mixture into the bottom of the prepared pan to form the crust.", "In a large mixing bowl, combine the ricotta cheese and cream cheese. Beat until smooth and creamy.", "Add 3/4 cup sugar, eggs, orange zest, vanilla extract, and flour to the cheese mixture. Mix until everything is well incorporated.", "Pour the cheesecake filling over the crust in the springform pan.", "Bake for 50-60 minutes, or until the center is set and the edges are lightly golden.", "Turn off the oven and let the cheesecake cool inside for about an hour.", "Once cooled, refrigerate for at least 4 hours or overnight for best results.", "Serve chilled."]}, {"type": "p", "text": "Note: Section headings added for clarity; the post lists ingredients as one list."}], "slug": "ricotta-cheesecake-with-orange", "cat": "Cakes and Cheesecakes"}, "almond-croissant-cookie-bars": {"title": "Almond Croissant Cookie Bars", "meta": "Time: Bake 40-50 min at 350F  |  Source: thefestakitchen (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cookie Base"}, {"type": "ul", "items": ["1 cup unsalted butter, softened", "3/4 cup granulated sugar", "1/2 cup brown sugar", "1 egg", "1 tsp vanilla", "1 tsp almond extract", "2 cups all-purpose flour", "1/2 tsp baking powder", "1/2 tsp salt"]}, {"type": "sub", "text": "Almond Filling"}, {"type": "ul", "items": ["8 oz almond paste", "4 tbsp unsalted butter, softened", "1/4 cup granulated sugar", "1 egg", "1 tsp almond extract", "1 tsp vanilla", "2 tbsp all-purpose flour", "1/4 tsp salt"]}, {"type": "sub", "text": "Topping"}, {"type": "ul", "items": ["1/2 cup sliced almonds", "2 tbsp granulated sugar", "Powdered sugar, for dusting"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 350F. Line an 8x8-inch pan with parchment.", "Beat butter, granulated sugar, and brown sugar until light and fluffy. Add egg, vanilla, and almond extract.", "Mix in flour, baking powder, and salt until a soft dough forms.", "Press 2/3 of the dough into the pan.", "Beat almond paste, butter, and sugar until smooth. Add egg, extracts, flour, and salt; mix until creamy.", "Spread almond filling over the cookie layer.", "Flatten the remaining cookie dough into pieces and gently place over the filling.", "Sprinkle with sliced almonds and 2 tbsp sugar.", "Bake 40-50 minutes, until the edges are golden and the center is set with only a slight wobble.", "Cool completely before slicing. Dust generously with powdered sugar."]}, {"type": "p", "text": "Note: Saved from TikTok: https://www.tiktok.com/@thefestakitchen/video/7693537655052668190"}], "slug": "almond-croissant-cookie-bars", "cat": "Cookies and Bars"}, "almond-croissant-cookies": {"title": "Almond Croissant Cookies", "meta": "Time: Chill 1 hr, bake 12-14 min at 350F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cookie dough"}, {"type": "ul", "items": ["1 cup (226g) unsalted butter, soft", "3/4 cup (150g) light brown sugar", "1/4 cup (50g) white sugar", "1 egg + 1 yolk", "2 tsp (8g) vanilla", "1 tsp (5g) almond extract", "2 1/4 cups (290g) all-purpose flour", "1/2 tsp (3g) salt", "1 tsp (6g) baking soda", "Sliced almonds, for rolling"]}, {"type": "sub", "text": "Frangipane filling"}, {"type": "ul", "items": ["1/4 cup (30g) powdered sugar", "1/4 cup (75g) almond paste (or 1 tbsp melted coconut oil plus 1 tsp almond extract)", "Pinch of salt", "1-2 tsp water if needed"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cream the butter and sugars until smooth, then mix in the eggs, vanilla, and almond extract.", "In another bowl, whisk the flour, salt, and baking soda. Add to the wet ingredients and fold gently. Don't overmix.", "Scoop the dough and chill at least 1 hour.", "Meanwhile, mix the filling ingredients, form into little balls, and chill to firm up.", "Wrap each dough ball around a filling ball, then roll in sliced almonds.", "Bake at 350F for 12-14 minutes, until the edges are golden.", "Cool completely, then dust with powdered sugar."]}, {"type": "p", "text": "Note: The cookie version that sits alongside Almond Croissant Cookie Bars in the original Doc. From Google Drive: Almond Croissant Recipes"}], "slug": "almond-croissant-cookies", "cat": "Cookies and Bars"}, "apple-pie-protein-cookies": {"title": "Apple Pie Protein Cookies", "meta": "Time: Bake 12 min at 350F  |  Servings: 10 cookies  |  Source: kickassk8 (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 large apples, diced small (creator likes Honeycrisp)", "3 scoops (1 cup) vanilla protein powder", "1 cup old-fashioned oats", "1 cup oat flour", "1/2 cup Greek yogurt", "2 tbsp honey", "3 tbsp maple syrup", "1 tsp cinnamon (be generous)", "Juice of 1/2 lemon (and zest)", "Pinch of salt", "Optional: 1/4 cup milk (any kind, only if dough feels dry)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 350F and line a baking sheet with parchment paper.", "Cook apples: Heat diced apples with maple syrup, cinnamon, lemon juice (and zest), and a pinch of salt in a pan for 6-8 minutes until soft. Cool in the freezer.", "Make dough: Mix protein powder, oat flour, oats, Greek yogurt, and honey in a bowl. If the dough feels too dry, add the optional milk.", "Combine: Fold in the cooled apples. Roll into 10 balls and place on the baking sheet.", "Bake for 12 minutes."]}, {"type": "p", "text": "Note: Per cookie: 196 calories, 11g protein, 2g fat, 29g carbs. If the cookies turn out dry, add a little milk to the dough. Store in a container on the counter or in the fridge (they get moist if left too long); the creator keeps them in the freezer and microwaves them 10-15 seconds. Saved from TikTok: https://www.tiktok.com/@kickassk8/video/7526631226732530957"}], "slug": "apple-pie-protein-cookies", "cat": "Cookies and Bars"}, "banana-pudding-cheesecake-bars": {"title": "Banana Pudding Cheesecake Bars", "meta": "Time: Crust 6-8 min and bake 30-40 min at 325F, cool 30 min, chill at least 3 hours", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Crust"}, {"type": "ul", "items": ["2 cups nilla wafer crumbs", "2 tbsp (25g) granulated sugar", "1/2 cup (113g) unsalted butter, melted"]}, {"type": "sub", "text": "Cheesecake"}, {"type": "ul", "items": ["16 oz (454g) cream cheese, softened", "1/2 cup (100g) granulated sugar", "1 ripe banana, mashed (~100g)", "1/4 cup (60g) sour cream, room temp", "1 tsp vanilla extract", "1/2 tbsp cornstarch", "2 eggs, room temp"]}, {"type": "sub", "text": "Whipped Cream"}, {"type": "ul", "items": ["1 cup (240g) cold heavy whipping cream", "2 tbsp powdered sugar", "1 tbsp (12g) dry banana pudding mix (from a 3.4 oz box)", "1/2 tsp vanilla extract"]}, {"type": "sub", "text": "Banana Pudding"}, {"type": "ul", "items": ["Remaining pudding mix (~84g)", "1 2/3 cups cold milk", "Lots of banana slices and crushed nilla wafers"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 325F and line an 8x8 pan with parchment paper.", "Mix the nilla wafer crumbs, sugar, and butter together well. Press into the prepared pan and bake 6-8 minutes. Let it cool.", "Beat cream cheese and sugar until smooth. Add sour cream, mashed banana, and vanilla, mixing until combined.", "Add the eggs and mix on low speed or by hand until just combined. Spread this filling over the cooled crust.", "Bake for 30-40 min, until edges are set and the center still has a little jiggle. Cool for at least 30 minutes at room temp, then chill for at least 3 hours.", "Prepare the pudding. Reserve 1 tbsp of the pudding mix for the whipped cream. Whisk the rest of the pudding mix with cold milk for 2 minutes or until thickened. Cover & chill until ready to use.", "To make the whipped cream, whip heavy cream, powdered sugar, 1 tbsp pudding mix, and vanilla to medium peaks. Don't over whip.", "Arrange a layer of sliced bananas over the chilled cheesecake. Spread a layer of banana pudding over it (I didn't use it all, had a little leftover).", "Spread the whipped cream on top. Top with nilla wafer crumbs.", "Chill again briefly so that the top can firm up a bit. Enjoy!"]}, {"type": "p", "text": "Note: Cornstarch is listed but not mentioned in the steps."}], "slug": "banana-pudding-cheesecake-bars", "cat": "Cookies and Bars"}, "caramel-cornflake-crunch-brownies": {"title": "Caramel Cornflake Crunch Brownies", "meta": "Time: Bake 30 min at 350F, cool about 1 hour  |  Source: food room (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the brownie"}, {"type": "ul", "items": ["250g butter", "200g dark chocolate, roughly chopped", "280g sugar", "200g all-purpose flour", "2 tablespoons cocoa powder", "4 eggs"]}, {"type": "sub", "text": "For the caramel cornflake layer"}, {"type": "ul", "items": ["480g granulated sugar", "150g unsalted butter", "300ml heavy cream", "1 tsp salt", "1 tsp vanilla", "220g cornflakes"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a bowl over hot water, melt the butter and chocolate together until smooth.", "In another bowl, combine the flour, sugar, and cocoa powder. Add the melted chocolate and mix until well combined. Mix in the eggs one at a time.", "Transfer the brownie batter into a baking tray lined with parchment paper, then bake at 350F for 30 minutes.", "For the caramel, add the sugar to a large pan over medium heat and let it melt. Once it starts to melt, use a wooden spoon to bring in the edges and slowly start to mix.", "Once it's completely melted, take it off the heat and add the cream a tiny amount at a time, mixing in between pours. Then add the butter and mix until melted.", "Put it back on the heat and, using a thermometer, let the caramel heat up to 110-115C.", "Stir in the vanilla and salt, then remove from the heat.", "Pour in the cornflakes and mix until they are all well coated.", "Add the cornflake layer on top of the brownies and flatten it out. Let cool for about an hour or longer."]}, {"type": "p", "text": "Note: Pan size not given. Saved from TikTok: https://www.tiktok.com/@food___room/video/7269056961772047621"}], "slug": "caramel-cornflake-crunch-brownies", "cat": "Cookies and Bars"}, "chocolate-chip-cookie-dough-bars": {"title": "Chocolate Chip Cookie Dough Bars", "meta": "Time: Not listed  |  Source: Fitwaffle (via dessertworlddd) (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["225g unsalted butter, softened", "150g light brown sugar", "75g granulated sugar", "2 large eggs", "2 tsp vanilla extract", "270g plain flour", "1 tsp bicarbonate of soda", "1 tsp salt", "350g semi-sweet chocolate chips, plus 50g for the top", "Sea salt (optional, to sprinkle on top)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps are in the video (\"sound on for full instructions\"). Tin size 8 x 10 inches. Let them cool fully in the tin before removing and slicing into squares. Saved from Instagram: https://www.instagram.com/p/CdVdL3TDwRK/"}], "slug": "chocolate-chip-cookie-dough-bars", "cat": "Cookies and Bars"}, "chocolate-chip-cookies": {"title": "Chocolate Chip Cookies", "meta": "Time: Bake 8-10 min at 375F  |  Source: joyfoodsunshine.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 cup salted butter, softened", "1 cup granulated sugar", "1 cup light brown sugar, packed", "2 teaspoons pure vanilla extract", "2 large eggs", "3 cups all-purpose flour", "1 teaspoon baking soda", "½ teaspoon baking powder", "1 teaspoon sea salt", "2 cups chocolate chips (12 oz)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 375 degrees Fahrenheit (190 degrees Celsius). Line three baking sheets with parchment paper and set aside.", "In a medium bowl mix flour, baking soda, baking powder and salt. Set aside.", "Cream together butter and sugars until combined.", "Beat in eggs and vanilla until light (about 1 minute).", "Mix in the dry ingredients until combined.", "Add chocolate chips and mix well.", "Roll 2-3 tablespoons (depending on how large you like your cookies) of dough at a time into balls and place them evenly spaced on your prepared cookie sheets.", "Bake in preheated oven for approximately 8-10 minutes. Take them out when they are just barely starting to turn brown."]}, {"type": "p", "text": "Note: Directions cut off after step 8 (step 9 hidden behind an ad)."}], "slug": "chocolate-chip-cookies", "cat": "Cookies and Bars"}, "chocolate-peanut-butter-no-bake-cookies": {"title": "Chocolate Peanut Butter No-Bake Cookies", "meta": "Time: Not listed  |  Source: Maalak Ikhiwach (Facebook), image by Layers of Calm", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 stick butter", "1¼ cups sugar", "¼ cup milk", "¼ cup cocoa", "1 cup peanut butter", "2 tsp vanilla", "3 cups quick cook oats", "¼ tsp salt"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (post text truncated at 'See more')."}], "slug": "chocolate-peanut-butter-no-bake-cookies", "cat": "Cookies and Bars"}, "cornflake-brownies": {"title": "Cornflake Brownies", "meta": "Time: Bake 30-35 min, chill 1 hour, cool 3-4 hours or overnight  |  Source: Chloe | Biteofthebakes", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Brownie"}, {"type": "ul", "items": ["1 tsp vanilla", "30g golden syrup", "1/2 tsp salt"]}, {"type": "sub", "text": "Cornflake Topping"}, {"type": "ul", "items": ["90g unsalted butter", "180g golden syrup", "200g cornflakes"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Pre-heat your oven (Gas mark 4/180C/160C Fan) and line a 9 inch baking tin with baking paper/parchment paper.", "Melt the butter and dark chocolate together in the microwave in short bursts. Stir until smooth, then let cool slightly. (This may take 2-3 minutes).", "In a separate bowl (I recommend using a stand mixer but an electric hand whisk will work too), add in your sugar and eggs and whisk on high for 10 minutes until the mixture is light and fluffy.", "Pour your melted chocolate/butter mixture into the egg mixture. (If using a stand mixer, change to a paddle attachment. If using an electric hand whisk, change to a spatula and fold the melted mixture in). Mix the chocolate mixture with the egg mixture on a low speed until incorporated.", "Add in your vanilla, golden syrup and sift in the flour, cocoa powder, and salt. Gently fold until just combined. Don't over-mix!", "Pour into a lined 9 inch square tin and smooth the top. Bake for 30-35 minutes, or until the edges are set but the centre is still soft. Don't over-bake, your brownies will have a slight wobble in the middle.", "Let your brownies chill in the fridge for 1 hour.", "In a pan, melt butter and golden syrup together. Stir in the cornflakes until evenly coated.", "Spoon the cornflake topping over the brownie and press down gently so it sticks but stays crunchy.", "Let the bake cool completely (3-4 hours or overnight) before cutting into squares or bars."]}, {"type": "p", "text": "Note: Ingredient list cut off at top: brownie amounts for butter, dark chocolate, sugar, eggs, flour and cocoa powder are not shown."}], "slug": "cornflake-brownies", "cat": "Cookies and Bars"}, "doubletree-signature-cookie": {"title": "DoubleTree Signature Cookie", "meta": "Time: Bake 20-23 min at 300F, cool about 1 hour  |  Servings: Makes 26 cookies  |  Source: ourcommunitynow.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1/2 pound butter, softened (2 sticks)", "3/4 cup + 1 tablespoon granulated sugar", "3/4 cup packed light brown sugar", "2 large eggs", "1 1/4 teaspoons vanilla extract", "1/4 teaspoon freshly squeezed lemon juice", "2 1/4 cups flour", "1/2 cup rolled oats", "1 teaspoon baking soda", "1 teaspoon salt", "Pinch cinnamon", "2 2/3 cups Nestle Tollhouse semi-sweet chocolate chips", "1 3/4 cups chopped walnuts"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cream butter, sugar, and brown sugar in the bowl of a stand mixer on medium speed for about 2 minutes.", "Add eggs, vanilla, and lemon juice, blending with mixer on low speed for 30 seconds, then medium speed for about 2 minutes, or until light and fluffy, scraping down bowl.", "With mixer on low speed, add flour, oats, baking soda, salt, and cinnamon, blending for about 45 seconds. Don't overmix.", "Remove bowl from mixer and stir in chocolate chips and walnuts.", "Portion dough with a scoop (about 3 tablespoons) onto a baking sheet lined with parchment paper about 2 inches apart.", "Preheat oven to 300F. Bake for 20 to 23 minutes, or until edges are golden brown and center is still soft.", "Remove from oven and cool on baking sheet for about 1 hour."]}, {"type": "p", "text": "Note: Cook's note: You can freeze the unbaked cookies, and there's no need to thaw. Preheat oven to 300F and place frozen cookies on parchment paper-lined baking sheet about 2 inches apart. Bake until edges are golden brown and center is still soft."}], "slug": "doubletree-signature-cookie", "cat": "Cookies and Bars"}, "jack-jack-s-num-num-cookies": {"title": "Jack-Jack's Num Num Cookies", "meta": "Time: Chill at least 1 hour (preferably overnight), bake 7-10 min at 350F  |  Source: Pixar (recipe by Marylou Jaso, Pixar Pastry Chef)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 cup butter (2 sticks)", "1 1/4 cup brown sugar", "1/4 cup sugar", "1 egg", "1 yolk", "1 tsp sea salt", "1 tsp vanilla extract", "1 tsp baking soda", "2 1/4 cups flour", "1 cup chocolate chip"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Brown butter and let it cool until it begins to solidify.", "Cream butter, sugars and salt in a mixing bowl until light and fluffy.", "Mix in whole egg, egg yolk, and vanilla.", "Combine dry ingredients and mix to the batter.", "Add chocolate chips.", "Scoop into balls and chill thoroughly, at least an hour, preferably overnight.", "Bake at 350F for 7-10 minutes until golden brown on edges but still soft in the center."]}], "slug": "jack-jack-s-num-num-cookies", "cat": "Cookies and Bars"}, "jacques-torres-chocolate-chip-cookies": {"title": "Jacques Torres Chocolate Chip Cookies", "meta": "Time: Not listed  |  Source: _beesbaking (Instagram), from NYT Cooking", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cups minus 2 tablespoons cake flour (8 1/2 ounces)", "1 2/3 cups bread flour (8 1/2 ounces)", "1 1/4 teaspoons baking soda", "1 1/2 teaspoons baking powder", "1 1/2 teaspoons coarse salt", "1 1/4 cups unsalted butter (2 1/2 sticks), room temperature", "1 1/4 cups light brown sugar (10 ounces)", "1 cup plus 2 tablespoons granulated sugar (8 ounces)", "2 large eggs, room temperature", "2 teaspoons vanilla extract", "1 1/4 pounds bittersweet chocolate", "Sea salt"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot."}], "slug": "jacques-torres-chocolate-chip-cookies", "cat": "Cookies and Bars"}, "upside-down-peanut-butter-banana-bread-bars": {"title": "Upside Down Peanut Butter Banana Bread Bars", "meta": "Time: Bake about 30 min at 375F, cool 15 min  |  Source: Jake Cohen (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Topping"}, {"type": "ul", "items": ["Nonstick cooking spray, for greasing", "4 just-ripe, firm bananas, sliced lengthwise", "1 cup granulated sugar", "3 tablespoons water"]}, {"type": "sub", "text": "Batter"}, {"type": "ul", "items": ["1 cup light brown sugar", "4 very-ripe bananas, mashed", "3/4 cup extra-virgin olive oil", "1/2 cup peanut butter", "2 teaspoons vanilla extract", "2 large eggs, at room temperature", "2 cups all-purpose flour", "1 teaspoon kosher salt", "1/2 teaspoon baking soda", "1/2 teaspoon baking powder", "1 teaspoon ground cinnamon", "1 teaspoon ground nutmeg", "1 cup dark chocolate chips or chopped dark chocolate"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Prepare the topping: Preheat the oven to 375F. Grease a 9 by 13-inch pan with nonstick spray and line with parchment. Place the bananas cut side down on the parchment, arranging or trimming to fit. In a medium saucepan, combine the sugar and water over medium-high heat. Cook, shaking the pan if needed, until an amber caramel forms, 6 to 8 minutes. Immediately pour over the bananas in an even layer.", "Prepare the batter: In a large bowl, whisk the brown sugar and mashed bananas until a relatively smooth paste forms. Whisk in the olive oil, peanut butter, vanilla, and eggs until well incorporated.", "Add the flour, salt, baking soda, baking powder, cinnamon, and nutmeg. Stir until just incorporated and there are no pockets of flour, then fold in the dark chocolate.", "Pour the batter over the caramel-coated bananas and smooth with a rubber spatula. Bake for about 30 minutes, until golden and cracked with an internal temp of 190F.", "Let cool 15 minutes, then run a paring knife along the edges. Place a platter or large cutting board over the pan and invert, discarding the parchment. Let cool slightly, then slice and serve warm."]}, {"type": "p", "text": "Note: Dairy free. Don't stir the caramel, only shake the pan. Saved from Instagram: https://www.instagram.com/p/Cpf8x62AakU/"}], "slug": "upside-down-peanut-butter-banana-bread-bars", "cat": "Cookies and Bars"}, "apple-crisp-with-maple-pecan-crisp-topping": {"title": "Apple Crisp with Maple Pecan Crisp Topping", "meta": "Time: Bake ~50 min at 350F  |  Source: themindfulmeringue.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Maple Pecan Crisp Topping"}, {"type": "ul", "items": ["3/4 cup (90g) all-purpose flour, or 1:1 gluten-free flour mix", "3/4 cup (75g) rolled oats", "1/2 cup (75g) maple sugar", "3/4 cup (170g) unsalted butter, cold, cubed", "1 tsp salt", "3/4 cup (75g) pecans, roughly chopped"]}, {"type": "sub", "text": "Apple Mixture"}, {"type": "ul", "items": ["6 firm & tart apples, sliced", "1/2 lemon, cut in half, squeezed", "1/3 cup (80ml) maple syrup", "1/4 cup (50g) light brown sugar, or maple sugar", "1 tsp cinnamon", "1 tbsp all-purpose flour"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 350F. Butter an 8\"x8\" baking pan or similar sized casserole dish. Set aside.", "Peel, core, and slice 6 washed apples. (Peeling your apples is optional depending on your texture preference.)", "In a large mixing bowl, combine your apples, sugars (maple syrup and brown sugar), lemon juice, flour, and cinnamon. Stir to incorporate.", "Transfer chopped fruit mixture to the prepared baking pan. Set aside.", "In a separate medium sized mixing bowl, combine flour, oats, maple sugar, and salt.", "Add cubed butter and combine with the mixture using either a pastry cutter or your hands.", "Once a mixture that resembles clay clumps, add roughly chopped pecans and mix together one final time. Evenly distribute crumble over the fruits.", "Bake at 350F for ~50 minutes or until fruit is bubbling and the crumble is golden brown. Let cool for 5 min, serve and enjoy!"]}, {"type": "p", "text": "Optional: Finish with a scoop of ice cream and a drizzle of maple syrup!"}, {"type": "p", "text": "Note: Tips: gluten free, sub 1:1 gluten-free flour mix or almond flour. Vegan, replace butter 1:1 with coconut oil. More maple, sub brown sugar with more maple sugar or add 1 tsp maple extract to the crumble. Topping browning quickly, cover with foil for the last 15 minutes. Last tip cut off in screenshot."}], "slug": "apple-crisp-with-maple-pecan-crisp-topping", "cat": "Other Desserts"}, "bananas-foster": {"title": "Bananas Foster", "meta": "Time: Not listed  |  Source: Bob Morano", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1/4 cup butter", "2/3 cup brown sugar", "1/4 cup rum or other booze", "3 bananas", "Couple dashes cinnamon", "Plenty of vanilla ice cream"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only)."}], "slug": "bananas-foster", "cat": "Other Desserts"}, "berry-danish-pastry-cups": {"title": "Berry Danish Pastry Cups", "meta": "Time: Bake 15-20 min at 400F  |  Servings: 6  |  Source: Vessy's Gourmet Kitchen (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["14 oz puff pastry dough (creator used Dufour)", "1.5 cups fresh berries of choice", "2 tbsp sugar", "1 tsp cornstarch", "1 tbsp flour, for dusting", "1 tbsp coarse sugar, for sprinkling on the edges", "Powdered sugar", "Mint leaves"]}, {"type": "sub", "text": "Cream cheese filling"}, {"type": "ul", "items": ["6 oz cream cheese, at room temperature", "2 tbsp sugar", "1 tsp vanilla bean paste or extract", "1 tbsp lemon juice", "Zest of 1/2 lemon"]}, {"type": "sub", "text": "Egg wash"}, {"type": "ul", "items": ["1 egg + 1 tsp water"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 400F.", "Wash, pat dry and macerate the berries with the sugar and cornstarch, and set them aside.", "Mix the cream cheese with the sugar, lemon juice and zest, and vanilla bean paste.", "Roll the puff pastry on a floured surface and cut into 6 squares. Add them to a muffin tin, pressing the bottoms down. Add a spoonful of the cream cheese filling and berries, brush with egg wash, and sprinkle with coarse sugar.", "Bake for about 15-20 minutes.", "Finish with powdered sugar and mint leaves."]}, {"type": "p", "text": "Note: Saved from Instagram: https://www.instagram.com/p/C6cmnh8rbDz/"}], "slug": "berry-danish-pastry-cups", "cat": "Other Desserts"}, "cannoli-pie": {"title": "Cannoli Pie", "meta": "Time: Refrigerate overnight  |  Source: Daniela's Dish", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Crust"}, {"type": "ul", "items": ["50 nilla wafers", "2 tablespoons brown sugar", "1/2 c pistachios", "6 tablespoons melted butter"]}, {"type": "sub", "text": "Filling"}, {"type": "ul", "items": ["1 c heavy cream", "1 c mascarpone", "3/4 c powdered sugar", "1 teaspoon orange zest", "Pinch kosher salt", "1 c ricotta", "Mini chocolate chips for topping"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Add the nilla wafers, brown sugar, and pistachios to a food processor and pulse until combined. With machine running on low pour in the butter until well combined.", "Press into a prepared pie plate spreading out evenly. Press down and up the sides with a spatula. Place in freezer while preparing the filling.", "In a large bowl beat the heavy cream with a mixer until peaks form. Set aside.", "In another bowl beat the mascarpone, powdered sugar, zest and salt. When combined beat in the ricotta on a low speed.", "Fold in the whipped heavy cream and pour into the chilled crust. Spread out evenly.", "Refrigerate overnight and sprinkle with chocolate chips and dust with powdered sugar before serving."]}], "slug": "cannoli-pie", "cat": "Other Desserts"}, "flan-creme-caramel": {"title": "Flan (Creme Caramel)", "meta": "Time: Bake 1 hour at 350F, then chill  |  Servings: 12 (8 oz mason jars)  |  Source: dvdnguyen (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Caramel"}, {"type": "ul", "items": ["1 1/3 cup sugar", "100ml water"]}, {"type": "sub", "text": "Custard"}, {"type": "ul", "items": ["750ml whole milk", "500ml heavy cream", "1 vanilla bean", "5 whole large eggs", "8 egg yolks", "1 cup sugar", "1 teaspoon kosher salt", "Boiling water as needed"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350F.", "Make the caramel: add the sugar and water to a nonstick pan and bring to a rolling boil. Once it starts to color, lower the heat and cook until it turns a deep amber. Transfer the caramel to a Pyrex cup and pour into the mason jars.", "Combine the milk, heavy cream, and vanilla bean (with its seeds) in a pot and bring to a gentle simmer. Be careful not to boil it.", "Mix together the eggs, sugar, and salt. Whisk together, then ladle in the warm milk mixture.", "Strain the mixture through a fine mesh strainer, then pour into the mason jars.", "Transfer the jars to a tray and add boiling water. Cover with aluminum foil and bake at 350F for 1 hour, or until the custard is set.", "Remove and chill. Best served chilled. It keeps in the fridge, but will lose some of its texture."]}, {"type": "p", "text": "Note: Section headings added for clarity. Saved from Instagram: https://www.instagram.com/p/CZCzHY_KpRL/"}], "slug": "flan-creme-caramel", "cat": "Other Desserts"}, "frozen-custard-with-sticky-peaches": {"title": "Frozen Custard with Sticky Peaches", "meta": "Time: Not listed", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Custard Ice Cream"}, {"type": "ul", "items": ["6 egg yolks", "1 1/2 cups whole milk", "1 1/2 cups heavy cream", "3/4 c granulated sugar", "1 tbsp + 1 tsp skim milk powder", "2 tbsp vanilla bean paste (Nielsen-Massey)", "1 tsp kosher salt"]}, {"type": "sub", "text": "Sticky Peaches"}, {"type": "ul", "items": ["2 peaches", "4 tbsp butter", "1/4 cup honey", "1 tbsp lemon juice", "Pinch salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Crack your eggs and separate your yolks and place them into a heat safe bowl. Combine your milk, cream, sugar, milk powder, and salt in a pot. Bring to 160F and slowly stream into your bowl of egg yolks. Finish with the vanilla and cool completely. Spin using your ice cream machine's instructions.", "Remove the pits from your peaches. Preheat a pan over medium low heat and add the butter. Once it foams add the peaches. After about 5-6 minutes give them a flip. After another 2-3 minutes add the honey and lemon juice. Baste the peaches with the hot honey until they're tender enough to pierce clean with a fork. Add a pinch of cinnamon and salt then swirl the pan for about a minute. Remove", "For the honey pan sauce you can whisk in a little bit more..."]}, {"type": "p", "text": "Note: Directions cut off during the honey pan sauce step. Cinnamon appears in the steps but not the ingredient list."}], "slug": "frozen-custard-with-sticky-peaches", "cat": "Other Desserts"}, "ice-cream-bread-pudding": {"title": "Ice Cream Bread Pudding", "meta": "Time: Melt overnight, sit 20 min, bake about 45 min at 350F  |  Source: Josh Elkin", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1.5 qt vanilla bean ice cream", "2 whole eggs, 1 egg yolk", "2 tbsp cinnamon", "12 mini day old butter croissants (or 6 large ones)", "Powdered sugar and berries for serving"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Let the ice cream melt in the fridge over night. The ice cream will look frozen but if you mix it it will become more like cream.", "Add the eggs and cinnamon and whisk until smooth.", "Rip apart the croissants and place them in a large casserole tray.", "Pour the ice cream mixture over the croissants and press them down, making sure they are fully submerged.", "Let it sit for about 20 minutes.", "Bake at 350 degrees F for about 45 minutes.", "Let it cool completely and serve with powdered sugar and berries."]}, {"type": "p", "text": "Note: Caption says \"12 minute day old butter croissants\", read as \"mini\"."}], "slug": "ice-cream-bread-pudding", "cat": "Other Desserts"}, "lemon-blueberry-croissant-bread-pudding-with-creme-anglaise": {"title": "Lemon Blueberry Croissant Bread Pudding with Creme Anglaise", "meta": "Time: Bake 30 min + 50 min at 350F  |  Source: Vessy's Gourmet Kitchen (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["4 croissants", "1 cup heavy whipping cream", "1 cup milk", "1/2 cup sugar", "2 eggs", "2 egg yolks", "1 tsp vanilla bean paste or extract", "1/4 tsp salt", "Zest of 1 lemon", "1 cup fresh blueberries", "Powdered sugar", "Mint leaves"]}, {"type": "sub", "text": "Creme Anglaise"}, {"type": "ul", "items": ["1/2 cup milk", "1/2 cup heavy whipping cream", "3 egg yolks", "3 tbsp sugar", "1/2 tsp vanilla bean paste or extract"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350F.", "Slice the croissants and place them in a lined loaf pan.", "In a blender, add the heavy whipping cream, milk, eggs, egg yolks, sugar, salt, vanilla and lemon zest and give it a blitz. Pour over the croissants and add 1/2 cup blueberries between the slices.", "Place a larger baking dish underneath and fill it 2/3 with hot water. Bake for 30 minutes, gently pressing the croissants to soak them into the egg mixture. Top with the rest of the blueberries and bake for another 50 minutes until golden and set.", "To make the creme anglaise, warm the milk, cream and vanilla to a gentle simmer. Whisk the egg yolks with the sugar and slowly pour in the warm milk mixture while whisking. Return to the saucepan and simmer over low heat until it thickens, about 5 minutes.", "Sprinkle with powdered sugar, mint and lemon zest, and pour the creme anglaise generously over the top."]}, {"type": "p", "text": "Note: Saved from Instagram: https://www.instagram.com/p/C4HSZvSLmmr/"}], "slug": "lemon-blueberry-croissant-bread-pudding-with-creme-anglaise", "cat": "Other Desserts"}, "magnolia-bakery-s-banana-pudding": {"title": "Magnolia Bakery's Banana Pudding", "meta": "Time: 30 min, plus at least 5 hours chilling  |  Servings: 12 to 16  |  Source: Priya Krishna", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["14-ounce can sweetened condensed milk", "1 1/2 cups ice-cold water", "3.4-ounce package instant vanilla pudding mix", "3 cups cold heavy cream", "11-ounce box Nilla wafers", "4 to 5 ripe bananas, sliced"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a stand mixer with the whisk, beat the condensed milk and water on low until blended, then on medium about 1 minute. Add the pudding mix and beat until smooth with no lumps, about 2 minutes. Transfer to a bowl, cover, and refrigerate until firm, at least 1 hour or overnight.", "Whip the heavy cream on medium about 1 minute until it starts to thicken, then on medium-high to stiff peaks. Don't overwhip.", "With the mixer on low, add the pudding mixture a spoonful at a time until fully blended with no streaks.", "Set aside 4 to 5 cookies for garnish. In a 4- to 5-quart trifle or wide glass bowl (or 12 8-ounce ramekins), spread a quarter of the pudding over the bottom and layer with a third of the cookies and a third of the bananas. Repeat twice more and finish with a final layer of pudding.", "Cover tightly and refrigerate 4 to 6 hours, until the cookies are tender when poked with a knife. Best served within 12 hours. Garnish with the reserved cookies or crumbs."]}, {"type": "p", "text": "Note: For 12 individual servings you'll have enough cookies for two per layer. For more coverage, make two layers with three cookies each. From Google Drive: Magnolia Bakery's Banana Pudding"}], "slug": "magnolia-bakery-s-banana-pudding", "cat": "Other Desserts"}, "mango-sticky-rice": {"title": "Mango Sticky Rice", "meta": "Time: Not listed  |  Source: johnandchelseahome", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Mango", "1 1/2 cups sticky rice", "2 cups water", "Sesame seeds"]}, {"type": "sub", "text": "Sauce"}, {"type": "ul", "items": ["1 can coconut milk", "1/2 cup sugar", "1 tbsp cornstarch", "2 tbsp water"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only)."}], "slug": "mango-sticky-rice", "cat": "Other Desserts"}, "mango-sticky-rice-innovasian": {"title": "Mango Sticky Rice (InnovAsian)", "meta": "Time: Rest 15-20 min  |  Source: eatinnovasian (InnovAsian)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 boxes InnovAsian Sticky White Rice", "4-5 large ripe Ataulfo mangoes, peeled and cut into generous cubes", "1 1/2 cans (about 20 oz) full-fat coconut milk", "1/2 cup sugar", "1/2 tsp kosher salt", "1 1/2 tsp cornstarch mixed with 1 1/2 tbsp cold water", "1 tsp toasted sesame seeds for garnish"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Prepare both boxes of InnovAsian Sticky White Rice according to package directions. Transfer the warm rice to a large bowl.", "In a small saucepan over medium-low heat, warm the coconut milk, sugar and salt together, stirring without letting it boil until the sugar dissolves completely.", "Pour about two-thirds of the warm coconut sauce over the warm rice and fold gently until rice is well coated. Let it rest for 15-20 minutes so the rice fully absorbs the coconut mixture and the flavors meld together.", "While the rice rests, bring the remaining coconut sauce back to a gentle simmer over low heat. Stir in the cornstarch/water slurry and cook, stirring constantly for 1-2 minutes until the sauce thickens slightly. Remove from heat and set aside.", "To assemble, spread the coconut-soaked sticky rice in a shallow serving dish. Pile the mango cubes in the center of the dish.", "Pour the thickened coconut sauce generously over the mango, letting it pool and spread naturally. Sprinkle with toasted sesame seeds and serve immediately at room temperature or slightly warm."]}], "slug": "mango-sticky-rice-innovasian", "cat": "Other Desserts"}, "mini-mascarpone-almond-tarts": {"title": "Mini Mascarpone Almond Tarts", "meta": "Time: Bake shells 12-15 min at 350F; chill at least 30 min  |  Source: Recipes Vibes (Facebook)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 cup almond flour", "1/2 cup all-purpose flour", "1/4 cup powdered sugar", "1/2 cup unsalted butter, softened", "1 large egg", "1 teaspoon vanilla extract", "1 cup mascarpone cheese", "1/4 cup granulated sugar", "1/2 teaspoon almond extract", "Sliced almonds for topping"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat your oven to 350F (175C).", "In a mixing bowl, combine almond flour, all-purpose flour, and powdered sugar.", "Add the softened butter and mix until crumbly.", "Beat in the egg and vanilla extract until the dough comes together.", "Press the dough into mini tart pans, making sure to cover the bottom and sides evenly.", "Bake the tart shells for about 12-15 minutes or until lightly golden. Let them cool.", "In another bowl, mix mascarpone cheese, granulated sugar, and almond extract until smooth.", "Spoon the mascarpone mixture into the cooled tart shells.", "Top with sliced almonds for a lovely crunch.", "Chill in the fridge for at least 30 minutes before serving."]}], "slug": "mini-mascarpone-almond-tarts", "cat": "Other Desserts"}, "protein-cloud": {"title": "Protein Cloud", "meta": "Time: Not listed  |  Servings: 8 slices  |  Source: Stefan Bodegrajac", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["410g natural light Greek yoghurt", "5 whole eggs", "30g cornflour", "30g sugar free caramel topping"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot. Macros, whole recipe: 661 cals, 66g P, 23g F, 46g C. Per-serve macros cut off."}], "slug": "protein-cloud", "cat": "Other Desserts"}, "strawberry-cheesecake-danish": {"title": "Strawberry Cheesecake Danish", "meta": "Time: Bake 10-12 min at 200C (180C fan)  |  Servings: 8  |  Source: Fitwaffle Kitchen (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["120g cream cheese, room temp", "30g icing sugar", "1 tsp vanilla extract", "4 large strawberries (approx)", "1 sheet ready roll puff pastry", "Egg wash (1 small egg + 1 tsp water)", "Granulated sugar for sprinkling"]}, {"type": "sub", "text": "Glaze"}, {"type": "ul", "items": ["40g icing sugar", "1 tbsp milk"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Bake at 200C (180C fan) for 10-12 minutes.", "Serve warm or cold. The creator let them cool before drizzling on the glaze."]}, {"type": "p", "text": "Note: Assembly steps are in the video (\"sound on for full instructions\"). Best served fresh. Cut the pastry in half and halve the ingredients to make 4. Saved from Instagram: https://www.instagram.com/p/C5OXLwwoRJ6/"}], "slug": "strawberry-cheesecake-danish", "cat": "Other Desserts"}, "benihana-ginger-dressing": {"title": "Benihana Ginger Dressing", "meta": "Time: Not listed  |  Source: Ian Fujimoto", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Sweet onion (1)", "Ginger (2 in knob, peeled)", "Lemon zest (1 lemon)", "Lemon juice (1 lemon)", "Soy sauce (1/4 cup)", "Rice vinegar"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Ingredient list cut off after rice vinegar (no amount shown). Steps not shown i  [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["4 cups whole milk", "1 cup heavy cream (for a richer restaurant texture)", "1 tsp kosher salt", "3 tbsp fresh lemon juice or white wine vinegar"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Heat the dairy: Pour the whole milk, heavy cream, and salt into a large heavy-bottomed pot. Heat over medium heat until it reaches 190°F (or just before a rolling boil). Stir occasionally to prevent scorching.", "Curdle: Turn off the heat entirely. Slowly stir in the lemon juice or vinegar. You will see curds begin to form immediately.", "Rest: Cover and let the mixture sit undisturbed for 10 minutes.", "Drain: Line a fine-mesh sieve or colander with several layers of cheesecloth and place it over a large bowl. Pour the curds into the cheesecloth. Drain for 10 to 15 minutes, depending on your preferred thickness.", "Whip: Once drained, transfer the ricotta to a food..."]}, {"type": "p", "text": "Note: Directions cut off after step 4"}], "slug": "homemade-ricotta", "cat": "Sauces, Seasonings and Basics"}, "lazy-dog-nacho-cheese-sauce": {"title": "Lazy Dog Nacho Cheese Sauce", "meta": "Time: Prep 10 min, cook 15 min  |  Servings: 4-6  |  Source: Lazy Dog copycat", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 tbsp unsalted butter", "1 tsp garlic, finely chopped", "2 tbsp all-purpose flour", "1/4 tsp salt", "1/8 tsp white pepper", "1/8 tsp nutmeg", "1/2 cup Mexican-style lager (Whoa, Nellie or any light beer)", "1 cup water", "1 cup half and half", "1 lb American cheese, cut into 1-inch chunks (deli-sliced is best)", "4 oz cream cheese, cut into 1-inch chunks"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Melt the butter in a saucepan over low heat. Add the garlic and saute 2 to 3 minutes until soft and fragrant.", "Whisk in the flour, salt, white pepper, and nutmeg to make a smooth paste. Cook on low 2 to 3 minutes without browning.", "Pour in the lager while stirring hard to prevent lumps. Simmer 3 to 5 minutes to cook off the alcohol.", "Add the water and half and half. Stir continuously over low-medium heat until slightly thickened, 3 to 5 minutes.", "Take the pan off the heat. Gradually add the American cheese and cream cheese, stirring gently until melted and smooth."]}, {"type": "p", "text": "Note: Serve warm over chips with pickled jalapenos, tomatoes, and cilantro, or hold in a double boiler. Reheat gently on low. Pairs with Smoky Chipotle Chicken Tinga for Pie Tin Nachos. From Google Drive: Lazy dog restaurant cheese sauce recipe"}], "slug": "lazy-dog-nacho-cheese-sauce", "cat": "Sauces, Seasonings and Basics"}, "marinara-sauce": {"title": "Marinara Sauce", "meta": "Time: Not listed  |  Source: Jose el Cook (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cans of pure Italian tomatoes (each can is 28oz)", "olive oil to saute", "1 Sweet onion diced fine", "4 garlic cloves minced fine", "4oz white wine", "1/4 teaspoon cracked black pepper", "1 teaspoon oregano", "1/2 teaspoon chili flake", "1tsp OCEAN (salt, adjust salt levels when sauce is finished too)", "1 small bunch basil leaf", "2oz olive oil to finish"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot."}], "slug": "marinara-sauce", "cat": "Sauces, Seasonings and Basics"}, "meat-marinades": {"title": "Meat Marinades", "meta": "Time: Not listed  |  Source: Lori's Recipe Journal", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Carne Asada"}, {"type": "ul", "items": ["2 lbs skirt steak", "¼ cup lime juice (fresh)", "¼ cup orange juice", "2 tbsp olive oil", "3 cloves garlic, minced", "2 tsp chili powder", "1½ tsp ground cumin", "1 tsp paprika", "½ tsp oregano", "½ tsp black pepper", "¾ tsp salt"]}, {"type": "sub", "text": "Korean Bulgogi"}, {"type": "ul", "items": ["1½ lb sirloin or fl ted  |  Source: Every Day is Feast Day (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1/2 onion, small dice or minced", "6-8 garlic cloves, thin sliced", "3-4 tbsp olive oil", "1 pinch salt", "1 pinch red pepper flake", "2 cups red wine", "2 large cans (28 oz each) peeled whole tomatoes", "1 bunch basil, leaves removed", "Parmesan cheese rind (optional)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the TikTok caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Saved from TikTok: https://www.tiktok.com/@everydayisfeastday/video/7697415477907279117"}], "slug": "quick-and-easy-marinara", "cat": "Sauces, Seasonings and Basics"}, "spicy-pomodoro": {"title": "Spicy Pomodoro", "meta": "Time: Simmer 1 hr (30 min, then 30 more after adding basil), plus about 3-4 min saute and 8 min for cherry tomatoes  |  Source: Sad_papi", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cups cherry tomatoes", "28oz can San Marzano tomatoes", "1 yellow onion", "5 cloves garlic", "2 tbsp Calabrian chili in oil", "20 leaves fresh basil", "Olive oil", "Salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Begin by mincing your onion, grating your garlic, and cutting your cherry tomatoes in half. Chop up your Calabrian chili if it wasn't already. Hand crush your canned tomatoes.", "Preheat a pot over medium low heat and add a few tbsp of olive oil. Once it shimmers, add the onion and garlic. Saute for 3-4 minutes then add the Calabrian chilis. Mix mix mix and add the cherry tomatoes. Add a small pinch of salt and cook these down until they're starting to soften up, around 8 minutes. Add the crushed tomatoes from earlier and bring to a simmer.", "Simmer for 30 minutes, coming by to stir especially around the bottom every now and then.", "Tear in 10 of your basil leaves and simmer an additional 30 minutes. You want the sauce to thicken up and no longer taste watery at all.", "Pass through a food mill now if you so desire. Season to taste with salt and reserve for all your tasty dishes.", "For the pasta, saute some more cherry tomatoes and toss together with the sauce and pasta."]}, {"type": "p", "text": "Note: Directions completed from the TikTok caption. Caption says \"5 gloves garlic\", read as cloves."}], "slug": "spicy-pomodoro", "cat": "Sauces, Seasonings and Basics"}, "brown-sugar-cookie-butter-latte": {"title": "Brown Sugar Cookie Butter Latte", "meta": "Time: Not listed  |  Source: gobbleacoffee", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 tsp cookie butter", "1 tbsp brown sugar", "A drizzle of honey", "A dash of cinnamon", "2 shots of espresso", "Ice", "Oat milk"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Add the cookie butter, brown sugar, honey, cinnamon and espresso.", "Shake until light and foamy.", "Ice.", "Oat milk.", "Top with your foamy espresso."]}, {"type": "p", "text": "Note: Caption gives ingredients and steps as one bulleted list; vessel and amounts of ice and oat milk not stated."}], "slug": "brown-sugar-cookie-butter-latte", "cat": "Drinks"}, "caipirinha": {"title": "Caipirinha", "meta": "Time: Not listed  |  Source: Joshua (driftersjoint) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Cachaca", "Fresh lime wedges", "Granulated sugar"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Muddle the lime wedges with the sugar.", "Add the cachaca, give it a quick shake in a shaker, and dump everything straight into the glass. No garnish."]}, {"type": "p", "text": "Note: Amounts not given in the caption. Brazil's national cocktail, one of Anthony Bourdain's favorites. Saved from TikTok: https://www.tiktok.com/@driftersjoint/video/7507410412158143775"}], "slug": "caipirinha", "cat": "Drinks"}, "creamy-cherry-limeade": {"title": "Creamy Cherry Limeade", "meta": "Time: Not listed  |  Source: nikki const $ = s => document.querySelector(s);
const main = $('#main'), crumb = $('#crumb'), search = $('#search');
const R = DATA.recipes;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = s => esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const label = s => { const m = s.match(/^([A-Z][A-Za-z ]{1,20}):(.*)$/); return m ? '<strong>'+esc(m[1])+':</strong>'+link(m[2]) : link(s); };

let wake = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null}); }
    if(!on && wake){ await wake.release(); wake = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && location.hash.startsWith('#/r/')) keepAwake(true); });

function header(title, depth){
  crumb.textContent = title;
  $('#back').hidden = depth === 0;
  $('#home').hidden = depth < 2;
  document.title = title === 'Recipes' ? 'Recipes' : title + ' | Recipes';
}

function itemHTML(s, showCat){
  const r = R[s];
  return '<button class="item" data-r="'+s+'">'+esc(r.title)+(showCat?'<small>'+esc(r.cat)+'</small>':'')+'</button>';
}

function viewHome(){
  header('Recipes', 0); keepAwake(false);
  const total = Object.keys(R).length;
  main.innerHTML = '<div class="grid">' + DATA.cats.map(c =>
    '<button class="tile" data-c="'+c.slug+'"><span class="name">'+esc(c.name)+'</span><span class="count">'+c.recipes.length+' recipes</span></button>'
  ).join('') + '</div><p class="hint" style="margin-top:1em">'+total+' recipes. Tap a category, or search by name or ingredient.</p>';
}

function viewCat(slug){
  const c = DATA.cats.find(x => x.slug === slug); if(!c) return viewHome();
  header(c.name, 1); keepAwake(false);
  main.innerHTML = '<div class="list">' + c.recipes.map(s => itemHTML(s, false)).join('') + '</div>';
}

function viewSearch(q){
  header('Search', 1); keepAwake(false);
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay = r => (r.title+' '+r.blocks.map(b => b.items ? b.items.join(' ') : b.text).join(' ')).toLowerCase();
  const inTitle = [], inBody = [];
  Object.values(R).forEach(r => {
    const t = r.title.toLowerCase();
    if(words.every(w => t.includes(w))) inTitle.push(r.slug);
    else if(words.every(w => hay(r).includes(w))) inBody.push(r.slug);
  });
  const all = inTitle.concat(inBody);
  main.innerHTML = all.length ? '<div class="list">'+all.map(s => itemHTML(s, true)).join('')+'</div>'
    : '<p class="empty">No recipes match "'+esc(q)+'".</p>';
}

function viewRecipe(slug){
  const r = R[slug]; if(!r) return viewHome();
  header(r.cat, 2); keepAwake(true);
  // split blocks: Ingredients section, Directions section, then notes
  let sec = null; const ing = [], dir = [], notes = [];
  r.blocks.forEach(b => {
    if(b.type === 'h'){ sec = /ingredient/i.test(b.text) ? 'ing' : /direction|instruction|method|step/i.test(b.text) ? 'dir' : 'other'; if(sec==='other') dir.push(b); return; }
    if(b.type === 'p' && /^(Note|Notes|Tip|Tips|Optional):/.test(b.text)){ notes.push(b); return; }
    (sec === 'ing' ? ing : dir).push(b);
  });
  const render = (arr, kind) => arr.map(b => {
    if(b.type === 'h') return '<h2>'+esc(b.text)+'</h2>';
    if(b.type === 'sub') return '<h3>'+esc(b.text)+'</h3>';
    if(b.type === 'ul') return '<ul class="ing">'+b.items.map(i => '<li>'+link(i)+'</li>').join('')+'</ul>';
    if(b.type === 'ol') return '<ol class="steps">'+b.items.map(i => '<li>'+label(i)+'</li>').join('')+'</ol>';
    return '<p>'+label(b.text)+'</p>';
  }).join('');
  main.innerHTML =
    '<h1 class="title">'+esc(r.title)+'</h1>' +
    (r.meta ? '<div class="meta">'+r.meta.split(/\s+\|\s+/).map(label).join(' &nbsp;&middot;&nbsp; ')+'</div>' : '') +
    '<div class="cols">' +
      '<section class="panel"><h2>Ingredients</h2><p class="hint">Tap to check off</p>'+render(ing)+'</section>' +
      '<section class="panel"><h2>Directions</h2>'+(dir.some(b=>b.type==='ol')?'<p class="hint">Tap a step to mark your place</p>':'')+render(dir)+'</section>' +
    '</div>' +
    notes.map(n => '<p class="note">'+label(n.text)+'</p>').join('');
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash;
  if(h.startsWith('#/r/')) return viewRecipe(h.slice(4));
  if(h.startsWith('#/c/')) return viewCat(h.slice(4));
  if(h.startsWith('#/s/')) return viewSearch(decodeURIComponent(h.slice(4)));
  search.value = '';
  viewHome();
}

main.addEventListener('click', e => {
  const c = e.target.closest('[data-c]'); if(c){ location.hash = '#/c/'+c.dataset.c; return; }
  const r = e.target.closest('[data-r]'); if(r){ location.hash = '#/r/'+r.dataset.r; return; }
  if(e.target.closest('a')) return;
  const li = e.target.closest('ul.ing li'); if(li){ li.classList.toggle('done'); return; }
  const st = e.target.closest('ol.steps li');
  if(st){
    const all = [...document.querySelectorAll('ol.steps li')], i = all.indexOf(st);
    const wasCurrent = st.classList.contains('current');
    all.forEach((x,j) => { x.classList.toggle('done', !wasCurrent && j < i); x.classList.toggle('current', !wasCurrent && j === i); });
  }
});
$('#back').onclick = () => { if(history.length > 1) history.back(); else location.hash = ''; };
$('#home').onclick = () => { location.hash = ''; };
let t;
search.addEventListener('input', () => {
  clearTimeout(t);
  t = setTimeout(() => { const q = search.value.trim(); location.hash = q ? '#/s/'+encodeURIComponent(q) : ''; }, 250);
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
