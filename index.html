ghtly thickened.", "Combine: Add chicken, pasta, and parmesan. Toss, adding pasta water as needed."]}, {"type": "p", "text": "Note: To rehydrate leftover sauce, add a splash of milk or water when reheating."}], "slug": "cowboy-butter-chicken", "cat": "Main Dishes"}, "cowboy-butter-chicken-linguine": {"title": "Cowboy Butter Chicken Linguine", "meta": "Time: Not listed  |  Source: ceesfood", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the Cowboy Butter Sauce"}, {"type": "ul", "items": ["1/2 cup unsalted butter (1 stick)", "3 cloves garlic, minced", "Juice and zest of 1 lemon", "1 tsp Dijon mustard", "1 tsp paprika", "1/2 tsp cayenne pepper (optional, for heat)", "1/2 tsp crushed red pepper flakes", "1 tsp Italian seasoning (or dried parsley + thyme)", "2 tbsp fresh parsley, chopped", "Salt & black pepper to taste"]}, {"type": "sub", "text": "For the Chicken & Pasta"}, {"type": "ul", "items": ["2 large chicken breasts (sliced thin or into strips)", "2 tbsp olive oil", "12 oz linguine pasta", "1/2 cup grated Parmesan cheese", "Extra fresh parsley & lemon wedges for garnish"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cook the pasta: Boil linguine in salted water until al dente. Reserve 1 cup pasta water, then drain.", "Cook the chicken: Season chicken with salt, pepper, and paprika. Heat olive oil in a skillet over medium-high. Cook chicken strips 4-5 minutes per side until golden and cooked through. Remove and set aside.", "Make the cowboy butter: In the same skillet, melt the butter. Add garlic and saute 1 minute. Stir in lemon juice/zest, mustard, paprika, cayenne, red pepper, Italian seasoning, parsley, salt, and pepper. Let simmer for 2 minutes until fragrant.", "Combine pasta & chicken: Add cooked linguine to the skillet, tossing in the cowboy butter sauce. Add Parmesan and a splash of reserved pasta water if needed for creaminess. Return chicken to the skillet and toss everything together.", "Serve: Garnish with extra parsley, lemon wedges, and more Parmesan if desired. Serve hot with garlic bread on the side."]}, {"type": "p", "text": "Note: Variations: more cayenne or hot sauce for spice; heavy cream to thicken; swap linguine for fettuccine or spaghetti; add spinach or roasted cherry tomatoes."}], "slug": "cowboy-butter-chicken-linguine", "cat": "Main Dishes"}, "creamy-chicken-gnocchi": {"title": "Creamy Chicken Gnocchi", "meta": "Time: Cook 60 min  |  Servings: 4-6  |  Source: not a chef (ianfujimoto.substack.com)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Chicken chest (2)", "Preferred seasoning blend (to taste)", "Salt (to taste)", "Black pepper (to taste)", "Shallot (2)", "Garlic (5 cloves)", "Sun dried tomato (¼ cup)", "Tomato paste (1 ½ tbsp)", "Preferred seasoning blend (2 tbsp)", "Chicken stock (6 cups)", "Heavy cream (2 cups)", "Parmigiano Reggiano (2 cups grated)", "Unsalted butter (3 tbsp)", "Spinach (1 hand full)", "Gnocchi (1 pound)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown; preparation is behind a paid-subscriber paywall."}], "slug": "creamy-chicken-gnocchi", "cat": "Main Dishes"}, "crock-pot-chicken-pot-pie": {"title": "Crock Pot Chicken Pot Pie", "meta": "Time: Low 6-7 hrs or high 3-4 hrs  |  Source: Recipes With Scotty (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 lbs boneless, skinless chicken breasts or thighs", "3 cups frozen mixed vegetables (peas, carrots, corn, green beans)", "2 cans (10.5 oz each) cream of chicken soup", "1 cup low-sodium chicken broth", "1 tsp salt", "1 tsp black pepper", "1 tsp garlic powder", "1 tsp onion powder", "1 tbsp Kinder's Buttery Garlic seasoning", "1/4 cup heavy cream or half-and-half", "1/2 cup sour cream or Greek yogurt (optional)", "1 can Great Value flaky biscuits (baked separately)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Add chicken, frozen vegetables, cream of chicken soup, broth, and seasonings to the crockpot. Stir to combine.", "Cook on low for 6-7 hours or high for 3-4 hours, until chicken is fully cooked.", "Shred the chicken and return it to the crockpot.", "Stir in heavy cream and sour cream (if using). Cook another 10-15 minutes on high.", "Bake biscuits according to package instructions.", "Serve chicken mixture over hot biscuits."]}, {"type": "p", "text": "Note: Saved from TikTok: https://www.tiktok.com/@recipeswithscotty/video/7534551957445430559"}], "slug": "crock-pot-chicken-pot-pie", "cat": "Main Dishes"}, "crockpot-beef-and-ramen": {"title": "Crockpot Beef and Ramen", "meta": "Time: LOW 6-8 hours or HIGH 3-4 hours, plus 20-30 min on HIGH  |  Source: coolkitchenbro", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 lbs chuck roast, cut into 1 1/2-2-inch chunks", "1 tbsp avocado or vegetable oil", "1/2 tsp black pepper", "1/4 tsp salt", "1/2 cup low-sodium soy sauce", "1/2 cup beef broth", "1/3 cup packed brown sugar", "1/4 cup hoisin sauce", "1 tbsp minced garlic", "1 tsp ground ginger", "1 tbsp sesame oil", "1 tbsp sriracha (optional)", "2 cups shredded carrots", "2 tbsp cornstarch", "2 tbsp cold water", "2-3 packages ramen noodles, seasoning packets discarded", "3-4 green onions, sliced", "1 tbsp sesame seeds", "Chili crisp or chili oil for serving"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cut 2 lbs chuck roast into chunks and season with 1/2 tsp black pepper and 1/4 tsp salt. Heat 1 tbsp oil in a skillet and sear the beef for 1-2 minutes per side. You can skip the sear if you're short on time, but that extra flavor is worth it!", "Add the beef to your Crockpot along with 1/2 cup soy sauce, 1/2 cup beef broth, 1/3 cup brown sugar, 1/4 cup hoisin sauce, 1 tbsp minced garlic, 1 tsp ground ginger, 1 tbsp sesame oil, 1 tbsp sriracha, and 2 cups shredded carrots.", "Cover and cook on LOW for 6-8 hours or HIGH for 3-4 hours, until the beef is fall-apart tender.", "Break the beef into bite-size pieces with two forks.", "Mix 2 tbsp cornstarch with 2 tbsp cold water and stir it into the Crockpot. Cover and cook on HIGH for another 10-15 minutes to thicken the sauce.", "Add 2-3 packages of ramen. Push the noodles into the sauce, cover, and cook another 10-15 minutes, stirring halfway through. Add an extra 1/4-1/2 cup beef broth if needed."]}, {"type": "p", "text": "Note: Directions may continue past the last visible step (garnish with green onions, sesame seeds and chili crisp not shown)."}], "slug": "crockpot-beef-and-ramen", "cat": "Main Dishes"}, "cuban-sandwich-with-mojo-pork": {"title": "Cuban Sandwich with Mojo Pork", "meta": "Time: Marinate 30 min  |  Source: Food & Wine (foodandwine.com)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Make the mojo and marinate the pork: Combine orange juice, lime juice, olive oil, garlic, oregano, cumin, cilantro, and onion in a large bowl and stir to combine. Season mojo with salt and pepper and stir in shredded pork. and let stand for 30 minutes.", "Using a slotted spoon, spoon pork onto bottom half of each roll. Spoon a little mojo over [obscured] with ham, salami, Swiss cheese and dill pickles. Spread mustard and hot sauce on top half of each roll and press sandwiches closed. Brush rolls on..."]}, {"type": "p", "text": "Note: Ingredients not shown in screenshot (no quantities). Directions cut off partway through step 2, and part of step 2 is hidden behind an on-page button."}], "slug": "cuban-sandwich-with-mojo-pork", "cat": "Main Dishes"}, "cucumber-salad-flatbread-with-crispy-harissa-chickpeas": {"title": "Cucumber Salad Flatbread with Crispy Harissa Chickpeas", "meta": "Time: Chickpeas 10 min in the oven  |  Source: Sam Jones (nomeatdisco) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the salad"}, {"type": "ul", "items": ["Half a cucumber", "1 cup plum tomatoes", "2 spring onions", "1 ripe avocado", "Half a can of chickpeas", "Juice of half a lemon", "3 tbsp Greek style yoghurt", "3 tbsp tahini", "3 tbsp garlic mayo", "1 tbsp sumac", "Fresh dill and mint", "Salt and pepper"]}, {"type": "sub", "text": "For the chickpeas"}, {"type": "ul", "items": ["Half a can chickpeas", "1 tbsp smoky harissa paste", "Drizzle of oil", "Salt and pepper"]}, {"type": "sub", "text": "To serve"}, {"type": "ul", "items": ["Hot honey", "2 flatbreads"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Add the chopped cucumber and tomatoes to a bowl with salt and pepper to release their juices.", "Combine all the other salad ingredients into the same bowl and mix until combined.", "Add the chickpeas to a skillet with the harissa paste and oil and char in the oven for 10 minutes until crispy.", "Heat up your flatbread, top with the cucumber salad and then the chickpeas, and fold it up."]}, {"type": "p", "text": "Note: Vegan per the creator's tags (check the mayo and yoghurt you use). Saved from TikTok: https://www.tiktok.com/@nomeatdisco/video/7503186021111188758"}], "slug": "cucumber-salad-flatbread-with-crispy-harissa-chickpeas", "cat": "Main Dishes"}, "daniel-s-lasagna": {"title": "Daniel's Lasagna", "meta": "Time: Bake 50 min at 375F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Sauce"}, {"type": "ul", "items": ["1 pound sweet Italian sausage", "3/4 pound ground beef", "1 cup chopped onion", "4 cloves fresh garlic, minced", "28 oz can crushed tomatoes", "12 oz can tomato paste", "13 oz can tomato sauce", "1/2 cup water", "2 packets Splenda", "1/4 cup chopped fresh basil", "1 teaspoon Italian seasoning", "1 1/2 teaspoons salt", "1/2 teaspoon ground pepper", "1/2 cup chopped parsley"]}, {"type": "sub", "text": "Layers"}, {"type": "ul", "items": ["Lasagna noodles", "20 oz ricotta cheese", "1 egg", "16 oz frozen spinach", "1 pound mozzarella cheese, sliced", "3/4 cup grated Parmesan cheese"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a large heavy-bottom pot, brown the ground beef and sausage with 1/2 cup of the onion and 2 of the minced garlic cloves. Remove the meat and leave the liquid.", "Add the remaining onion and garlic. Saute until translucent.", "Add the crushed tomatoes, tomato paste, tomato sauce and water.", "Add the Splenda, basil, Italian seasoning, salt, pepper and parsley. Simmer for 20-30 minutes.", "Bring a separate pot of water to a boil and cook the lasagna noodles. Rinse with cold water.", "In a mixing bowl, mix the ricotta, egg, chopped parsley, spinach and salt.", "Preheat the oven to 375F.", "Assemble the layers: sauce, noodles, ricotta mixture, sliced mozzarella, sauce, Parmesan. Repeat with noodles, ricotta mixture, sliced mozzarella, and Parmesan.", "Cover with foil. Bake 25 minutes, then remove the foil and bake another 25 minutes."]}, {"type": "p", "text": "Note: The original doesn't say when the browned meat goes back into the sauce. From Google Drive: Lasagna.docx"}], "slug": "daniel-s-lasagna", "cat": "Main Dishes"}, "garlic-butter-chicken": {"title": "Garlic Butter Chicken", "meta": "Time: Not listed  |  Source: Ian Fujimoto (iankyo) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Chicken thigh (2)", "Soy sauce (3 tbsp)", "Garlic powder (2 tbsp)", "Salt (to taste)", "White pepper (to taste)", "Soy sauce (2 tbsp)", "Mirin (2 tbsp)", "Garlic (6 cloves)", "Unsalted butter (4 tbsp)", "Green onions (3 stalks)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the TikTok caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. The caption lists soy sauce twice (3 tbsp, then 2 tbsp), likely once for the chicken and once for the sauce. Saved from TikTok: https://www.tiktok.com/@iankyo/video/7423422052775824670"}], "slug": "garlic-butter-chicken", "cat": "Main Dishes"}, "garlic-butter-chicken-home-version": {"title": "Garlic Butter Chicken (Home Version)", "meta": "Time: Marinate overnight, cook about 20 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Marinade"}, {"type": "ul", "items": ["4 chicken thighs", "6 tablespoons soy sauce", "4 tablespoons garlic powder", "White pepper", "Salt and pepper"]}, {"type": "sub", "text": "Sauce"}, {"type": "ul", "items": ["Green onions", "4 tbsp soy sauce", "4 tbsp mirin", "8 cloves garlic, minced", "8 tbsp butter", "Honey"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cut the chicken into bite-size pieces.", "Combine the marinade ingredients and marinate overnight.", "Chop the green onions and garlic.", "Cook the marinated chicken in a scorching hot pan until cooked through.", "Remove the chicken, turn down the heat, and add the garlic and onions. Cook a minute or two.", "Add the soy sauce, mirin, butter and honey. Cook until thickened.", "Add the chicken back and cook until coated."]}, {"type": "p", "text": "Note: A doubled version of the Garlic Butter Chicken from TikTok, with honey added and full steps. From Google Drive: Garlic Butter Chicken"}], "slug": "garlic-butter-chicken-home-version", "cat": "Main Dishes"}, "harissa-chicken-thighs": {"title": "Harissa Chicken Thighs", "meta": "Time: Not listed  |  Source: Mishka Makes Food", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 lbs chicken thighs", "1 small yellow onion, quartered", "2 small tomatoes, quartered", "1 bunch parsley, torn in half", "6 cloves garlic", "1 cup 0% fat greek yogurt (240ml)", "2 tbsp olive oil (30ml)", "1/2 cup harissa paste* (120ml)", "Juice from 1/2 lemon", "1.5 tbsp tumeric powder (2 large pinches)", "1 tbsp smoked paprika (1 large pinch)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Ingredients cut off after smoked paprika; steps not shown in screenshot."}], "slug": "harissa-chicken-thighs", "cat": "Main Dishes"}, "honey-lime-chicken-and-avocado-rice-stack": {"title": "Honey Lime Chicken and Avocado Rice Stack", "meta": "Time: Marinate at least 30 min; cook chicken 6-7 min per side  |  Source: LydiaKitchen", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 boneless, skinless chicken breasts", "3 tablespoons honey", "2 tablespoons fresh lime juice", "1 tablespoon soy sauce", "2 cloves garlic, minced", "1 tablespoon olive oil", "Salt and pepper to taste", "2 cups cooked jasmine rice", "2 ripe avocados, mashed", "1 tablespoon lime juice", "2 tablespoons fresh cilantro, chopped", "Salt and pepper to taste"]}, {"type": "sub", "text": "Optional garnish"}, {"type": "ul", "items": ["Lime wedges", "Extra cilantro", "Drizzle of honey"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a bowl, whisk together honey, lime juice, soy sauce, garlic, olive oil, salt, and pepper. Add chicken and marinate for at least 30 minutes.", "Heat a skillet or grill pan over medium heat. Cook chicken for 6-7 minutes per side, or until fully cooked and golden. Remove and let rest before slicing.", "In a large bowl, mix cooked jasmine rice with mashed avocado, lime juice, cilantro, salt, and pepper until creamy and well combined.", "Using a food ring mold (or small bowl), layer avocado rice at the bottom and press gently. Top with sliced honey lime chicken."]}, {"type": "p", "text": "Note: Directions may continue past the screenshot (cut off after step 4)."}], "slug": "honey-lime-chicken-and-avocado-rice-stack", "cat": "Main Dishes"}, "juicy-turkey-without-brining": {"title": "Juicy Turkey Without Brining", "meta": "Time: 3-4 hours at 325F, rest 10-15 min  |  Source: JortsKitchen (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 turkey", "1 shallot, chopped", "1/2 cup red wine", "1 stick butter", "1 tbsp parsley", "Salt and pepper", "Poultry seasoning (creator likes one with paprika for color)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Remove the spine of the turkey with kitchen shears or a knife. Flip the bird over and apply pressure on the breast side to flatten it out. You'll hear a crack.", "Make the compound butter: add the chopped shallot to a pan with 1/2 cup red wine and cook on medium heat until the wine is almost gone. Let it cool, then mix with 1 stick of butter, 1 tbsp parsley, salt and pepper.", "Rub the compound butter underneath the skin of the turkey.", "Season the turkey with poultry seasoning.", "Set your smoker or oven to 325F. Place the turkey breast side up and cook for 3-4 hours, or until the internal temperature reaches 165F in the breast and 175F in the thighs.", "Let it rest for 10-15 minutes before serving."]}, {"type": "p", "text": "Note: Turkey size not given. Any compound butter flavor works; this is the creator's version. Saved from TikTok: https://www.tiktok.com/@jortskitchen/video/7441307680335088951"}], "slug": "juicy-turkey-without-brining", "cat": "Main Dishes"}, "korean-bbq-marinated-chicken": {"title": "Korean BBQ Marinated Chicken", "meta": "Time: Not listed  |  Source: Mishka Makes Food", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 lbs chicken thighs (900g)", "6 garlic cloves, minced", "1 inch piece ginger, grated", "1/4 cup gochujang (60g)", "1/4 cup light soy sauce/GF Tamari (60g)", "1 tsp honey (7g)", "1 tbsp water, plus additional as needed to thin (15g + additional)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot. Caption notes the marinade works on tofu and other meats too."}], "slug": "korean-bbq-marinated-chicken", "cat": "Main Dishes"}, "lemon-butter-parmesan-chicken": {"title": "Lemon Butter Parmesan Chicken", "meta": "Time: Prep 25 min, Cook 10 min, Total 35 min (plus at least 1 hour marinating)  |  Servings: 8-10  |  Source: Amelia is NOT a Chef", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Chicken & Marinade"}, {"type": "ul", "items": ["3-4 lbs boneless chicken thighs, cut into 1 inch cubes (you can sub chicken breast)", "1/2 cup olive oil", "1/2 cup white wine", "1 teaspoon chicken bouillon - use \"Better Than Bouillon\" Chicken Bouillon, it's a paste consistency. If you don't have that brand, then you can omit from recipe or you can mix the bouillon that you do have with 1/4 cup warm water and cool to room temp and add to marinade", "2 tablespoons fresh lemon juice", "1/2 teaspoon black pepper", "1 teaspoon kosher salt"]}, {"type": "sub", "text": "Panko Breading"}, {"type": "ul", "items": ["1 cup grated parmesan cheese", "1 cup panko crumbs", "1/2 cup breadcrumbs, plain or seasoned", "2 teaspoons red pepper flakes - you can adjust based on preference", "1 tablespoon oregano", "1 1/2 tablespoons garlic powder", "1 teaspoon black pepper", "1 teaspoon kosher salt"]}, {"type": "sub", "text": "Lemon Butter Sauce"}, {"type": "ul", "items": ["1 stick salted butter (8 tablespoons), sliced", "3 tablespoons fresh lemon juice"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Marinade: in a large bowl, mix chicken, olive oil, lemon juice, white wine, chicken bouillon, 1/2 teaspoon black pepper, 1 teaspoon salt. Refrigerate for at least 1 hour.", "In another bowl mix panko crumbs, bread crumbs, parmesan, garlic powder, oregano, red pepper flakes, salt & pepper.", "Preheat grill to medium high.", "NOTE: make sure you really clean your grill and then oil your grill so that the chicken does not stick.", "Once chicken has marinaded, remove the chicken from marinade with tongs and add to the breadcrumb mixture and toss with hands until chicken is evenly coated. Add chicken to skewers.", "Once grill is hot, add chicken skewers to grill and cook for about 5 minutes, then flip and cook for another 4 minutes or until internal temperature reaches 165F.", "While chicken is cooking, make lemon butter sauce by placing butter in a bowl and microwaving for 45 seconds until melted. Add in lemon juice and stir. Set aside.", "Remove skewers from grill and brush with lemon butter sauce."]}, {"type": "sub", "text": "Oven Instructions"}, {"type": "ol", "items": ["Preheat oven to 400F.", "Place chicken on lined sheet.", "Cook for 10-15 minutes or until internal temperature is 165F.", "Turn oven to broil and broil each side for about 3-4 minutes. Keep your eye on the skewers while doing this, they can burn quickly!"]}, {"type": "p", "text": "Note: Nutrition per serving: 792 calories, 62g fat, 20g sat fat, 16g carbs, 1g fiber, 2g sugar, 39g protein, 1161mg sodium, 236mg cholesterol."}], "slug": "lemon-butter-parmesan-chicken", "cat": "Main Dishes"}, "one-pan-coconut-dumplings": {"title": "One Pan Coconut Dumplings", "meta": "Time: Not listed  |  Source: Mizzery Bell", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 can coconut milk", "2 1/2 tbsp red curry paste", "3 tsp soy sauce", "1 1/2 tbsp rice wine vinegar", "1 tbsp sesame oil", "Splash of fish sauce (optional)", "1 tbsp minced ginger", "1 tbsp minced garlic", "Bok choy or frozen spinach", "Frozen dumplings"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only)."}], "slug": "one-pan-coconut-dumplings", "cat": "Main Dishes"}, "one-pan-red-curry-dumplings": {"title": "One Pan Red Curry Dumplings", "meta": "Time: Bake 15 min at 200C (20 min total per caption)  |  Source: coconutandbliss (TikTok), inspired by healthygirlkitchen", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Red Curry"}, {"type": "ul", "items": ["2 1/2 tbsp red curry paste", "1 tsp minced ginger", "1 tsp minced garlic", "3 tbsp soy sauce", "1 1/2 tbsp rice wine vinegar", "1 tbsp sesame oil", "400mL coconut milk"]}, {"type": "sub", "text": "Other"}, {"type": "ul", "items": ["2 bunches bok choy, chopped", "~15 frozen dumplings", "2 tbsp coriander, finely chopped", "1 tbsp chilli oil", "1 tbsp sesame seeds"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 200C.", "In a large baking dish, place all red curry ingredients. Whisk until combined.", "Add bok choy in an even layer and then top with the dumplings.", "Bake for 15 mins or until cooked.", "Top with coriander, chilli oil and sesame seeds."]}], "slug": "one-pan-red-curry-dumplings", "cat": "Main Dishes"}, "one-pot-high-protein-chicken-biryani": {"title": "One-Pot High-Protein Chicken Biryani", "meta": "Time: Cook 60 min at 180C  |  Servings: Approx. 4  |  Source: gymtrav", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Chicken breast, diced - 600g (approx. 21.2 oz / 1.3 lbs)", "Basmati rice (uncooked) - 200g (approx. 7 oz / 1 cup)", "Onion, thinly sliced - 1 onion (approx. 150g / 5.3 oz)", "Red pepper, diced - 1 pepper (approx. 100g / 3.5 oz / 3/4 cup)", "0% fat Greek yoghurt - 150g (approx. 5.3 oz / 2/3 cup)", "Peas (frozen is fine) - 100g (approx. 3.5 oz / 2/3 cup)", "Light coconut milk - 100ml (approx. 3.4 fl oz / 2/5 cup)", "Boiling water or chicken stock - 300ml (approx. 10.1 fl oz / 1.25 cups)", "Olive oil (or spray) - 1 tbsp (approx. 15ml)", "Garam masala - 1 tsp", "Ground cumin - 1 tsp", "Paprika - 1 tsp", "Turmeric - 1/2 tsp", "Chilli powder (optional) - 1/2 tsp", "Salt & pepper - to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Combine ingredients into an oven-safe dish or pot.", "Cook for 60 minutes at 180C.", "Once done, fluff the rice with a fork and taste for seasoning.", "Add chopped coriander or a squeeze of lemon to finish."]}, {"type": "p", "text": "Note: Macros per serving: 540 cal, 48g protein, 45g carbs, 15g fat, 5g fibre. Source taken from the @GYMTRAV video watermark; the two screenshots show different people in the video."}], "slug": "one-pot-high-protein-chicken-biryani", "cat": "Main Dishes"}, "path-of-least-resistance-chicken-pot-pie": {"title": "Path of Least Resistance Chicken Pot Pie", "meta": "Time: Not listed  |  Servings: One 12-inch skillet  |  Source: Josh Elkin (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cans chicken pot pie soup", "2 cups rotisserie chicken", "1 cup cooked bacon", "2 cans refrigerated biscuit dough", "1 egg", "1 tbsp water", "1/4 cup chopped parsley"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Saved from Instagram: https://www.instagram.com/p/Cylh7UoJ3dH/"}], "slug": "path-of-least-resistance-chicken-pot-pie", "cat": "Main Dishes"}, "pesto-pasta-alla-vodka-with-italian-sausage": {"title": "Pesto Pasta Alla Vodka with Italian Sausage", "meta": "Time: Not listed  |  Source: 3PiecesofPecan (recipe by Half Baked Harvest) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 lb Italian sausage of choice", "Olive oil, a few tablespoons", "1 shallot, finely diced", "4 cloves garlic, minced", "1 tbsp fresh oregano or 1 tsp dry", "1 tsp crushed red pepper", "6 oz tomato paste", "4 oz vodka", "3/4 cup basil pesto", "Salt and pepper to taste", "1 cup heavy cream", "1 lb pasta of choice", "3 tbsp butter", "1/3 cup Parmesan cheese, plus extra for topping", "1/4 cup basil, roughly chopped", "Parsley for topping"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Brown the sausage, drain and set aside.", "In a large skillet or Dutch oven over medium low heat, add olive oil and heat for a few minutes.", "Add the shallot for 2-3 minutes.", "Add the garlic for 2-3 minutes.", "Reduce heat to low. Add the tomato paste and red pepper flakes and cook 4-5 minutes.", "Add the vodka and let it cook off for a couple minutes.", "Add the pesto, cream, and browned sausage; stir and let it come together for 10 minutes. Season with salt and pepper.", "Cook the pasta to al dente and add it to the sauce.", "Add pasta water, butter, Parmesan, and basil, and mix well.", "Thin the sauce with more pasta water if needed."]}, {"type": "p", "text": "Note: The creator added Italian sausage to the original Half Baked Harvest recipe. Oregano is listed but its step isn't given. Saved from TikTok: https://www.tiktok.com/@3piecesofpecan/video/7400189379647507743"}], "slug": "pesto-pasta-alla-vodka-with-italian-sausage", "cat": "Main Dishes"}, "roasted-veggie-chickpea-bowls-with-maple-dijon-tahini-dressing": {"title": "Roasted Veggie Chickpea Bowls with Maple Dijon Tahini Dressing", "meta": "Time: Roast 20-25 min at 400F  |  Servings: 4", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Veggies"}, {"type": "ul", "items": ["2 zucchini, sliced", "2 carrots, sliced", "2 broccoli crowns, cut into florets", "2 red onions, quartered", "2 cans chickpeas, drained and rinsed", "4 tablespoons olive oil", "2 teaspoons smoked paprika", "Salt and pepper, to taste"]}, {"type": "sub", "text": "Dressing"}, {"type": "ul", "items": ["1/2 cup tahini", "2 tablespoons Dijon mustard", "2 tablespoons maple syrup", "4 tablespoons lemon juice", "4 tablespoons water", "Salt and pepper, to taste"]}, {"type": "sub", "text": "To serve"}, {"type": "ul", "items": ["4 cups cooked quinoa or rice", "Fresh parsley or cilantro, chopped"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 400F (200C) and line a large baking sheet with parchment or grease it lightly.", "Toss the zucchini, carrot, broccoli, onion, and chickpeas with the olive oil, smoked paprika, salt, and pepper. Spread in a single layer.", "Roast 20-25 minutes, until the vegetables are tender and caramelized and the chickpeas are slightly crispy.", "Meanwhile, whisk the tahini, Dijon, maple syrup, lemon juice, and water until smooth. Thin with more water a teaspoon at a time until pourable but still thick. Season with salt and pepper.", "Divide the quinoa or rice among four bowls and top with the roasted vegetables and chickpeas.", "Drizzle generously with the dressing and garnish with parsley or cilantro."]}, {"type": "p", "text": "Note: For crispier chickpeas, pat them very dry before roasting and keep them in a single layer. Swap in whatever vegetables are in season. From Google Drive: Roasted Veggie Chickpea Bowls with Maple Dijon Tahini Dressing"}], "slug": "roasted-veggie-chickpea-bowls-with-maple-dijon-tahini-dressing", "cat": "Main Dishes"}, "salmon-sushi-bake": {"title": "Salmon Sushi Bake", "meta": "Time: Bake 10-15 min at 400F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Rice"}, {"type": "ul", "items": ["2 cups uncooked sushi rice", "2 tbsp rice vinegar", "1 tbsp white sugar", "1/2 tsp salt"]}, {"type": "sub", "text": "Seafood and cream mixture"}, {"type": "ul", "items": ["10 oz imitation crab", "8 oz salmon (about 2 cups shredded, cooked)", "4 oz cream cheese", "1/3 cup sriracha mayo (or 1/3 cup Kewpie mayo plus 2 tbsp sriracha)"]}, {"type": "sub", "text": "Toppings and serving"}, {"type": "ul", "items": ["Furikake", "Seaweed snacks", "Sesame seeds (optional)", "Green onion, chopped"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cook the sushi rice according to the package. Microwave the rice vinegar, sugar, and salt about 30 seconds until dissolved, then gently mix into the cooked rice.", "Season the salmon with salt and pepper. Air fry at 400F for 10-12 minutes, or bake at 375F for 15-17 minutes.", "In a large bowl, shred the imitation crab and cooked salmon. Add the cream cheese and sriracha mayo and mix until smooth.", "Preheat the oven to 400F. Press the rice into a 9x9 or 9x13-inch baking dish, sprinkle generously with furikake, then spread the salmon-crab mixture over the top.", "Bake at 400F for 10-15 minutes, until the top is slightly golden.", "Cool a few minutes, then top with more sriracha mayo, furikake, sesame seeds, and green onions. Scoop onto seaweed snacks to eat."]}, {"type": "p", "text": "Note: From Google Drive: Salmon Sushi Bake Recipe"}], "slug": "salmon-sushi-bake", "cat": "Main Dishes"}, "sheet-pan-baked-feta-with-broccolini-and-tomatoes": {"title": "Sheet-Pan Baked Feta with Broccolini and Tomatoes", "meta": "Time: Roast 15 to 20 min at 400F  |  Source: r/vegetarianrecipes", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 bunch broccolini, ends trimmed, thick stalks split lengthwise, or broccoli, stalks trimmed and cut into bite-size pieces", "1 pint grape tomatoes, halved (about 2 cups)", "1 small red onion, peeled, quartered and cut into 2-inch wedges", "1 lemon, 1/2 cut into thin rounds and the remaining 1/2 left intact, for serving", "3 tablespoons olive oil, plus more for serving", "1 teaspoon ground cumin", "1/2 teaspoon red-pepper flakes", "Kosher salt and black pepper", "2 (6- to 8-ounce) blocks feta, cut into 1-inch slices", "Cooked orzo or farro, for serving", "1/2 cup fresh basil or cilantro leaves and fine stems, roughly chopped (optional)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Heat the oven to 400 degrees with a rack set in the lower third. On a sheet pan, combine the broccolini, tomatoes, onion and lemon slices with the olive oil and toss.", "Add cumin and red-pepper flakes, season with salt and pepper, and toss again until evenly coated. Nestle the feta slices into the vegetables. (It's OK if they break apart a little.)", "Roast 15 to 20 minutes, stirring halfway through but leaving the feta in place, until the broccolini is charred at the tips, the stems are easily pierced with a fork and the tomato skins start to blister and break down.", "Serve over orzo or farro. Drizzle with olive oil and serve with the remaining lemon half for squeezing. Top with fresh herbs, if using."]}], "slug": "sheet-pan-baked-feta-with-broccolini-and-tomatoes", "cat": "Main Dishes"}, "smoking-notebook": {"title": "Smoking Notebook", "meta": "Time: Varies by cut (see below)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Rubs (ratio of salt : pepper : third spice)"}, {"type": "ul", "items": ["Pulled pork: 1 : 1 : 0.25 salt, pepper, paprika", "Ribs, brisket, whole chicken: 1 : 2 : 0.25 salt, pepper, paprika", "Tri-tip and potatoes: 1 : 1 : 1 salt, pepper, garlic"]}, {"type": "sub", "text": "Twice baked potatoes"}, {"type": "ul", "items": ["2 sticks butter, cubed", "8 slices cooked bacon, crumbled or finely chopped", "1 cup sour cream", "2 cups cheddar jack cheese, divided", "1 cup whole milk", "2 tsp seasoned salt", "1/2 tsp ground black pepper, plus more for serving", "4 green onions, thinly sliced"]}, {"type": "h", "text": "Directions"}, {"type": "sub", "text": "Pulled pork (bone-in pork butt)"}, {"type": "ol", "items": ["Smoke at 225F for about 12 hours: 10 hours unwrapped, then 2 hours wrapped tight in foil.", "Rest 1 hour."]}, {"type": "sub", "text": "Ribs"}, {"type": "ol", "items": ["Smoke at 225F for 5 hours: 3 hours unwrapped, then 2 hours wrapped tight in foil."]}, {"type": "sub", "text": "Brisket (about 12 hours)"}, {"type": "ol", "items": ["Unwrapped for 8 hours, starting at 255F, then 260-265F, then 280F.", "Wrapped in paper for 4 hours, starting at 280-295F."]}, {"type": "sub", "text": "Tri-tip"}, {"type": "ol", "items": ["Smoke at 225F for 1.5-2 hours, until 125F inside.", "Sear until 135F."]}, {"type": "sub", "text": "Potatoes"}, {"type": "ol", "items": ["Russets in foil with the 1:1:1 rub and 1 tablespoon butter, smoked at 225F."]}, {"type": "sub", "text": "Turkey (16 lb, spatchcocked)"}, {"type": "ol", "items": ["Brine 24 hours.", "Season with Santa Maria and garlic herb. Put tablespoon-size butter squares with seasoning under the skin of both thighs and the breast.", "Smoke at 275F for about 4-4.5 hours."]}, {"type": "sub", "text": "Whole chicken"}, {"type": "ol", "items": ["Smoke at 225F for 4-5 hours."]}, {"type": "sub", "text": "Corn on the cob (grill)"}, {"type": "ol", "items": ["Shuck the corn and rub each ear with butter or oil. Season with salt and pepper and wrap tightly in foil.", "Grill over medium-high heat (350-400F) for 15 to 20 minutes, turning occasionally."]}, {"type": "sub", "text": "Baked potatoes (grill)"}, {"type": "ol", "items": ["Scrub and pierce 4 russet potatoes with a fork, rub with olive oil and salt, and wrap tightly in foil.", "Grill over medium-high heat (350-400F) for 45 to 60 minutes, turning occasionally, until fork-tender or 205F inside."]}, {"type": "p", "text": "Note: Smoker log. The original brisket notes also list 3 hours at 260-265F and 7 hours at 280F, which don't fit inside the 8 unwrapped hours. Twice baked potatoes have ingredients only. From Google Drive: Smoking Notebook"}], "slug": "smoking-notebook", "cat": "Main Dishes"}, "smoky-chipotle-chicken-tinga": {"title": "Smoky Chipotle Chicken Tinga", "meta": "Time: Prep 15 min, cook 25 min  |  Servings: About 6  |  Source: Lazy Dog style", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 lbs boneless, skinless chicken breasts or thighs (thighs stay juicier)", "1 tbsp olive oil or neutral oil", "1 medium yellow or white onion, thinly sliced", "3 cloves garlic, minced", "1 can (14.5 oz) fire-roasted diced tomatoes, undrained", "2 to 3 chipotle peppers in adobo, plus 1 to 2 tbsp of the adobo sauce (to taste)", "1/2 cup low-sodium chicken broth", "1 tsp ground cumin", "1 tsp dried Mexican oregano", "1/2 tsp kosher salt, plus more to taste", "1/4 tsp black pepper"]}, {"type": "sub", "text": "Optional toppings"}, {"type": "ul", "items": ["Queso fresco or queso blanco", "Avocado or guacamole", "Pickled jalapenos", "Crema or sour cream", "Chopped cilantro", "Lime wedges"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Simmer the chicken in lightly salted water or broth for 12-15 minutes until cooked through (165F). Cool slightly and shred with two forks. (Or sear seasoned thighs in a skillet first, then shred.)", "Blend the tomatoes, chipotles, adobo sauce, broth, cumin, oregano, salt, and pepper until smooth.", "Heat the oil in a large skillet over medium heat. Cook the onion 5-7 minutes until soft and lightly golden. Add the garlic and cook 1 minute.", "Pour in the blended sauce and simmer gently 5-8 minutes until slightly reduced.", "Stir in the shredded chicken and simmer on low 5 minutes more until coated and hot. Adjust the salt or add more adobo to taste."]}, {"type": "p", "text": "Note: Lazy Dog serves chicken tinga as an add-on for its Pie Tin Nachos; this is a homemade version. Good on nachos, tostadas, or tacos. From Google Drive: Tinga tinga chicken lazy dog"}], "slug": "smoky-chipotle-chicken-tinga", "cat": "Main Dishes"}, "spaghetti-capuliato": {"title": "Spaghetti Capuliato", "meta": "Time: Spaghetti about 8 min  |  Source: GialloZafferano Loves Italy (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the pesto"}, {"type": "ul", "items": ["200 g dried tomatoes", "10 basil leaves", "1 garlic clove", "1 chili pepper (whole if you like it spicy)", "Oregano as needed", "30 ml olive oil"]}, {"type": "sub", "text": "For the spaghetti"}, {"type": "ul", "items": ["200 g spaghetti", "Salt for boiling water", "Breadcrumbs"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Finely chop the dried tomatoes, basil, garlic, and chili pepper.", "Mix in the olive oil and oregano to make a pesto.", "Cook the spaghetti in salted boiling water until al dente, about 8 minutes.", "In a pan, toast the breadcrumbs until brown and set aside.", "In another pan, heat two tablespoons of the pesto.", "Drain the spaghetti, saving some of the cooking water.", "Add the spaghetti to the pan with the pesto, adding some cooking water to mix well.", "Serve the spaghetti with the toasted breadcrumbs on top."]}, {"type": "p", "text": "Note: A traditional Sicilian dish. Saved from TikTok: https://www.tiktok.com/@giallolovesitaly/video/7325416716597595424"}], "slug": "spaghetti-capuliato", "cat": "Main Dishes"}, "sticky-soy-ginger-chicken": {"title": "Sticky Soy Ginger Chicken", "meta": "Time: Roast 25-30 min at 450F  |  Source: Every Day is Feast Day (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["4-6 garlic cloves", "1 tbsp fresh ginger or 1/2 tsp ground ginger", "1 apple or pear", "Black pepper", "1-2 tbsp hot sauce (optional)", "1/2 cup soy sauce", "1/2 tsp sesame oil", "1-2 tbsp balsamic vinegar", "2-3 tbsp honey", "4-6 chicken thighs (about 2-3 lbs)", "1-2 tbsp sesame seeds (optional)", "2 tbsp oil", "1 tsp corn starch"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Roast at 450F for about 25-30 minutes, or until fully cooked and caramelized with a little char.", "If needed, finish under a low broiler to add some char."]}, {"type": "p", "text": "Note: Caption gives the ingredients and the roasting step only; the prep steps are in the video. Saved from TikTok: https://www.tiktok.com/@everydayisfeastday/video/7700649885648850190"}], "slug": "sticky-soy-ginger-chicken", "cat": "Main Dishes"}, "tamales-de-chile-verde": {"title": "Tamales de Chile Verde", "meta": "Time: Not listed  |  Source: Claudia (cooking.con.claudia) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the meat"}, {"type": "ul", "items": ["7 lbs bone-in pork shoulder and ribs (or beef chuck)", "Salt to taste (creator used 4 tbsp)", "1 onion", "Garlic", "5 bay leaves", "1 tbsp peppercorns", "2 tsp coriander seeds"]}, {"type": "sub", "text": "For the chile verde"}, {"type": "ul", "items": ["10 tomatillos, roasted", "12 Hatch or Anaheim peppers, roasted and peeled", "3-5 jalapenos, roasted and peeled", "1/2 onion, roasted", "5 garlic cloves", "Handful of cilantro", "1/2 tsp cumin seeds", "1 tsp oregano"]}, {"type": "sub", "text": "For the masa"}, {"type": "ul", "items": ["12 oz lard", "5 tsp baking powder", "2 tsp salt", "6 cups Maseca for tamales", "7-8 cups broth"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the TikTok caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Important: if the masa does not float, add a little more broth, 1 tbsp at a time. Caption says \"1/2 tap cumin seeds\", read as tsp. Saved from TikTok: https://www.tiktok.com/@cooking.con.claudia/video/7436874174397762858"}], "slug": "tamales-de-chile-verde", "cat": "Main Dishes"}, "tomato-pasta-with-marinara-and-mozzarella": {"title": "Tomato Pasta with Marinara and Mozzarella", "meta": "Time: Not listed  |  Source: dadsfoodtoday", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["6 Roma tomatoes, cut in half", "1 onion, chopped", "3-4 garlic cloves, minced", "Olive oil", "1 cup marinara sauce (use your favorite)", "1 tbsp Italian seasoning", "1/2 tbsp salt", "Black pepper to taste", "Paprika to taste", "Smoked paprika to taste", "3/4 cup heavy cream", "1 cup mozzarella cheese, plus more for topping", "Grated Parmesan cheese (for garnish)", "Cooked pasta of choice", "Fresh parsley (optional)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Heat a good drizzle of olive oil in a skillet over medium heat.", "Add the halved Roma tomatoes, onion, garlic, and marinara sauce..."]}, {"type": "p", "text": "Note: Directions cut off after step 2"}], "slug": "tomato-pasta-with-marinara-and-mozzarella", "cat": "Main Dishes"}, "ultimate-meat-and-ricotta-lasagna": {"title": "Ultimate Meat and Ricotta Lasagna", "meta": "Time: Sauce 1 hr, bake 50-55 min at 375F, rest 20-30 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Meat sauce"}, {"type": "ul", "items": ["1 lb 85/15 ground beef chuck", "1 lb sweet Italian sausage, casings removed", "1 medium yellow onion, finely diced", "5 cloves garlic, minced", "2 tbsp tomato paste", "Two 28-oz cans whole peeled San Marzano tomatoes, crushed by hand or lightly blended", "One 15-oz can crushed tomatoes or tomato puree", "1/2 cup dry red wine (Chianti or Cabernet Sauvignon) or beef stock", "2 tbsp extra virgin olive oil", "1 tbsp dried oregano", "1 tbsp dried basil (or 1/4 cup fresh, chopped)", "1 tsp crushed red pepper flakes (optional)", "1 tsp granulated sugar", "1 1/2 tsp kosher salt, to taste", "1/2 tsp freshly cracked black pepper"]}, {"type": "sub", "text": "Ricotta filling"}, {"type": "ul", "items": ["32 oz whole-milk ricotta, drained in a fine-mesh sieve for 20-30 minutes", "1 large egg, lightly beaten", "1 cup freshly grated Parmigiano-Reggiano or Pecorino Romano", "1/3 cup fresh flat-leaf parsley, finely chopped", "1/4 tsp freshly grated nutmeg", "1/2 tsp kosher salt", "1/4 tsp freshly cracked black pepper"]}, {"type": "sub", "text": "Pasta and topping"}, {"type": "ul", "items": ["1 box (16 oz, about 15-18) lasagna noodles", "16 oz (about 4 cups) low-moisture whole-milk mozzarella, freshly shredded from a block", "1/2 cup grated Parmigiano-Reggiano (for the top)"]}, {"type": "h", "text": "Directions"}, {"type": "sub", "text": "Meat sauce"}, {"type": "ol", "items": ["In a large Dutch oven, heat the olive oil over medium heat. Add the beef and sausage, breaking it apart, and cook until browned, about 7-8 minutes. Drain off excess grease, leaving 1-2 tablespoons.", "Add the onion and cook until soft, 4-5 minutes. Stir in the garlic and cook 1 minute.", "Add the tomato paste and cook, stirring, 2 minutes until brick-red. Deglaze with the wine, scraping up the browned bits, and reduce by half, about 3 minutes.", "Add the tomatoes, tomato puree, oregano, basil, red pepper flakes, sugar, salt, and pepper. Bring to a gentle boil, then cover partially and simmer on low 45-60 minutes, stirring occasionally."]}, {"type": "sub", "text": "Filling and noodles"}, {"type": "ol", "items": ["Mix the drained ricotta, egg, 1 cup Parmesan, parsley, nutmeg, salt, and pepper until smooth. Refrigerate until assembly.", "Cook the noodles in salted boiling water until just al dente (1-2 minutes under the package time). Drain and lay flat on parchment or an oiled sheet tray."]}, {"type": "sub", "text": "Assemble and bake"}, {"type": "ol", "items": ["Preheat the oven to 375F (190C). Lightly grease a deep 9x13-inch dish.", "Base: spread 1 cup meat sauce over the bottom.", "Layers 1-3: 4-5 noodles, 1/3 of the ricotta mixture, 1 cup meat sauce, 3/4 cup mozzarella.", "Top: a final layer of noodles, the remaining meat sauce, the remaining mozzarella (1 1/4 cups), and 1/2 cup Parmesan.", "Cover tightly with foil sprayed with nonstick oil and bake 30 minutes.", "Uncover and bake 20-25 minutes more until bubbly and golden at the edges. Broil 2-3 minutes for extra browning if you like.", "Rest on a rack 20-30 minutes before slicing so the layers set."]}, {"type": "p", "text": "Note: Drain the ricotta so the bottom doesn't get watery, and shred mozzarella from a block for a better melt. Can be assembled and refrigerated up to 24 hours, or frozen up to 3 months (thaw overnight and add 10-15 minutes to the covered bake). From Google Drive: Ultimate Meat and Ricotta Lasagna Recipe"}], "slug": "ultimate-meat-and-ricotta-lasagna", "cat": "Main Dishes"}, "apple-butter-biscuit-pull-apart-bread": {"title": "Apple Butter Biscuit Pull-Apart Bread", "meta": "Time: Bake about 30 min at 350F, cool 5 min  |  Source: Allrecipes", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 (16.3 ounce) can buttermilk biscuits, such as Grands Biscuits", "2/3 cup white sugar", "1/3 cup brown sugar", "2 teaspoons ground cinnamon", "6 tablespoons butter, melted", "2/3 cup apple butter", "2 tablespoons salted caramel sauce or caramel sauce, or as needed for drizzling", "flaky sea salt, to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350 degrees F (175 degrees C). Lightly grease a loaf pan. Split uncooked biscuits in half to form 2 thinner biscuits.", "Stir white sugar, brown sugar, and cinnamon together in a shallow bowl. Place melted butter in another shallow bowl. Lightly coat each biscuit piece in butter, allowing excess to drip off, and then coat lightly with sugar mixture.", "Place one biscuit at the end of the prepared loaf pan. Spread about 2 teaspoons apple butter on another biscuit and press it lightly against the biscuit in the pan. Repeat with remaining apple butter and biscuits to fill the loaf pan. Apple butter should be sandwiched between each biscuit piece. Sprinkle any remaining cinnamon sugar over the loaf.", "Bake in the preheated oven until biscuits are golden brown, risen, and a toothpick inserted in the center comes out clean, about 30 minutes. Allow to cool in the pan for 5 minutes before inverting onto a serving platter.", "Drizzle with caramel sauce and sprinkle with salt if desired."]}], "slug": "apple-butter-biscuit-pull-apart-bread", "cat": "Breads and Muffins"}, "banana-bread-food-network": {"title": "Banana Bread (Food Network)", "meta": "Time: Active 30 min, total 1 hr 40 min; bake at 325F  |  Servings: 1 loaf  |  Source: Mary Sue Milliken and Susan Feniger (Food Network)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 cup granulated sugar", "8 tablespoons (1 stick) unsalted butter, room temperature", "2 large eggs", "3 ripe bananas", "1 tablespoon milk", "1 teaspoon ground cinnamon", "2 cups all-purpose flour", "1 teaspoon baking powder", "1 teaspoon baking soda", "1 teaspoon salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 325F. Butter a 9 x 5 x 3-inch loaf pan.", "Cream the sugar and butter in a large bowl until light and fluffy. Add the eggs one at a time, beating well after each.", "In a small bowl, mash the bananas with a fork and mix in the milk and cinnamon. In another bowl, mix the flour, baking powder, baking soda and salt.", "Add the banana mixture to the creamed mixture and stir to combine. Add the dry ingredients, mixing just until the flour disappears.", "Pour into the pan and bake 1 hour to 1 hour 10 minutes, until a toothpick in the center comes out clean. Cool on a rack 15 minutes, then turn out and cool completely before slicing.", "Spread slices with honey or serve with ice cream."]}, {"type": "p", "text": "Note: From Google Drive: Banana Bread Recipe | Food Network.pdf"}], "slug": "banana-bread-food-network", "cat": "Breads and Muffins"}, "browned-butter-pumpkin-bread-with-cream-cheese-filling": {"title": "Browned Butter Pumpkin Bread with Cream Cheese Filling", "meta": "Time: Bake 65-75 min at 350F  |  Source: Sarah Kraffty", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Wet"}, {"type": "ul", "items": ["1/2 cup (one stick) salted butter, browned", "2 tbsp butter (added to the browned butter)", "3/4 sugar", "1/2 cup brown sugar", "2 eggs", "1 tsp vanilla", "1 cup pumpkin puree"]}, {"type": "sub", "text": "Dry"}, {"type": "ul", "items": ["1 & 3/4 cup all purpose flour", "1 tsp baking soda", "1/2 tsp salt", "1 tsp cinnamon", "1/2 tsp nutmeg", "1/4 tsp cloves"]}, {"type": "sub", "text": "Cream Cheese Filling"}, {"type": "ul", "items": ["8 oz cream cheese", "1/4 cup sugar", "1 egg", "1 tsp vanilla"]}, {"type": "sub", "text": "Topping"}, {"type": "ul", "items": ["Sprinkle of cinnamon", "1/4 cup brown sugar"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a pan add 1/2 cup (one stick) salted butter. Brown it, leaving on high heat until it turns brown. Take it off the heat, add 2 tbsp butter to it and let it cool.", "In a mixing bowl add the cooled browned butter, 3/4 sugar, 1/2 cup brown sugar, 2 eggs and 1 tsp vanilla. Mix. Add 1 cup of pumpkin puree and mix.", "In a separate bowl add the flour, baking soda, salt, cinnamon, nutmeg and cloves. Whisk it all together.", "Fold the dry ingredients into the wet. Set aside.", "Make the cream cheese filling: mix the cream cheese, sugar, egg and vanilla all together.", "In a greased loaf pan: layer 1/3 of the batter, then 1/2 of the cream cheese on top. Swirl it using a toothpick. Add 1/3 of the batter and the rest of the cream cheese mixture on top. Swirl it. Add the rest of the batter and swirl a little more.", "Top with a sprinkle of cinnamon and 1/4 cup of brown sugar sprinkled all over the top.", "Bake at 350 for 65-75 minutes until a toothpick comes out clean from the center."]}, {"type": "p", "text": "Note: Caption says \"3/4 sugar\" with no unit (likely 3/4 cup)."}], "slug": "browned-butter-pumpkin-bread-with-cream-cheese-filling", "cat": "Breads and Muffins"}, "carrot-cake-banana-bread": {"title": "Carrot Cake Banana Bread", "meta": "Time: Bake 40 min at 180C / 350F  |  Source: Stefan Bodegrajac", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["200g banana", "2 eggs", "125g high protein Greek yogurt", "80g oat flour", "100g grated carrot", "40g dates", "20g sugar free choc chips", "20g sugar free maple syrup", "1 tsp baking powder + salt and cinnamon to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mash, mix, bake, done.", "Bake for 40 mins at 180°C / 350°F.", "Let it cool slightly before slicing."]}], "slug": "carrot-cake-banana-bread", "cat": "Breads and Muffins"}, "cinnamon-sugar-crunch-pumpkin-bread": {"title": "Cinnamon Sugar Crunch Pumpkin Bread", "meta": "Time: Bake 45 min at 350F, cool 10-15 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 large egg", "1/2 cup granulated sugar", "1/4 cup brown sugar, light or dark", "1/2 cup pure canned pumpkin", "1/4 cup canola oil (or any neutral oil)", "1 teaspoon vanilla extract", "3/4 cup all-purpose flour", "1/2 teaspoon baking powder", "1/8 teaspoon baking soda", "1 1/2 teaspoons pumpkin pie spice", "1/4 teaspoon salt", "2 to 3 tablespoons cinnamon sugar (3/4 teaspoon cinnamon for every 1 tablespoon of sugar)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350 degrees + lightly grease the pan and line with parchment paper.", "In a medium mixing bowl, whisk together until smooth the egg, granulated sugar, brown sugar, pumpkin, oil, + vanilla.", "Add in flour, baking powder, baking soda, pumpkin pie spice, + salt.", "Sprinkle on cinnamon sugar and swirl around with a toothpick.", "Bake for 45 mins + let cool for 10-15 mins."]}, {"type": "p", "text": "Note: Pan size not shown. Caption may continue past step 5 (screenshot ends there)."}], "slug": "cinnamon-sugar-crunch-pumpkin-bread", "cat": "Breads and Muffins"}, "cinnamon-swirl-banana-bread": {"title": "Cinnamon Swirl Banana Bread", "meta": "Time: Bake 50-65 min at 350F, cool at least 30 min  |  Source: Cozyfoodwithemi", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Bread"}, {"type": "ul", "items": ["3 medium bananas", "1/3 cup (67g) brown sugar", "6 tbsp (90g) unsalted butter, soft", "2 eggs", "2 tsp (8g) vanilla", "1/3 cup (90g) greek yogurt/sour cream", "1 3/4 cups (215g) ap flour", "1 tsp (5g) baking soda", "1/2 tsp (3g) salt", "1 tbsp corn starch or milk powder"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mash bananas then whisk in the butter, brown sugar, eggs, vanilla, and yogurt.", "In another bowl whisk the flour, baking soda, salt, and milk powder/cornstarch.", "Add the dry to the wet and then fold to mix. The batter should be thick and sticky.", "Alternate layering the batter and the swirl paste, about 3 layers with the final layer to be the batter.", "Bake at 350 for 50-65 min or until a tooth pick comes out clean. (Creator temps hers at around 200F.)", "Cool at least 30 min before icing."]}, {"type": "p", "text": "Note: Swirl paste and icing ingredients not shown in screenshots."}], "slug": "cinnamon-swirl-banana-bread", "cat": "Breads and Muffins"}, "country-apple-fritter-bread": {"title": "Country Apple Fritter Bread", "meta": "Time: Bake 45-55 min at 350F  |  Source: Cooking Shenanigans with Lucy (Lucy Morrow-Spirriso)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Apple Filling"}, {"type": "ul", "items": ["2 apples, peeled & chopped", "2 tablespoons sugar", "1 teaspoon cinnamon"]}, {"type": "sub", "text": "Bread Batter"}, {"type": "ul", "items": ["1 cup all-purpose flour", "1/2 cup sugar", "1 teaspoon baking powder", "1/2 cup milk", "1 egg", "1/4 cup melted butter"]}, {"type": "sub", "text": "Cinnamon Topping"}, {"type": "ul", "items": ["1/3 cup brown sugar", "1 teaspoon cinnamon"]}, {"type": "sub", "text": "Glaze (optional)"}, {"type": "ul", "items": ["1/2 cup powdered sugar", "1-2 tablespoons milk"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mix cinnamon & sugar for topping.", "Chop apples and mix with sugar & cinnamon.", "Mix bread batter.", "Layer in pan: half the batter, apples, rest of batter. Sprinkle topping.", "Bake at 350F for 45-55 minutes. Let cool.", "Drizzle glaze and enjoy!"]}, {"type": "p", "text": "Note: Recipe is from an image the post labels as AI-generated media; pan size not given."}], "slug": "country-apple-fritter-bread", "cat": "Breads and Muffins"}, "easy-cinnamon-apple-bread": {"title": "Easy Cinnamon Apple Bread", "meta": "Time: Bake 1 hour at 350F  |  Source: Sarah Kraffty", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the apples"}, {"type": "ul", "items": ["2-3 apples peeled and diced", "2 tbsp granulated sugar", "1 tsp cinnamon"]}, {"type": "sub", "text": "Topping"}, {"type": "ul", "items": ["1/3 cup brown sugar", "2 tsp cinnamon"]}, {"type": "sub", "text": "Bread"}, {"type": "ul", "items": ["1/2 cup softened butter", "2/3 cup granulated sugar", "2 large eggs", "1 & 1/2 tsp vanilla extract", "1 & 1/2 cups all purpose flour", "1 & 3/4 tsp baking powder", "1 tsp salt", "1/2 cup whole milk"]}, {"type": "sub", "text": "Glaze"}, {"type": "ul", "items": ["2-3 tbsp whole milk", "1 cup powdered sugar"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Start by combining brown sugar & cinnamon in a bowl. Mix well. In a separate bowl add the peeled and diced apples, cinnamon, and granulated sugar. Mix until well combined.", "In a separate bowl add softened butter and granulated sugar, mix on high speed for 2 minutes until light and fluffy. Add in eggs and vanilla extract and mix well. Next add in: all purpose flour, baking powder, and salt. Mix well. Lastly add in whole milk and mix.", "Line a loaf pan with parchment paper. Add half of your cake mixture in the bottom of the pan. Top with 1/2 of your apples and 1/2 of your cinnamon brown sugar mixture. Repeat one more time. Next use a butter knife to swirl it around a few times. My loaf pan is 9 x 5 x 2.5.", "Bake at 350 degrees for 1 hour or until a toothpick comes out clean.", "Add powdered sugar and milk in a bowl to make the glaze, mix well. Top hot fritter cake with the glaze and serve!"]}, {"type": "p", "text": "Note: Step 1 completed from the TikTok caption."}], "slug": "easy-cinnamon-apple-bread", "cat": "Breads and Muffins"}, "maple-pecan-banana-nut-bread": {"title": "Maple Pecan Banana Nut Bread", "meta": "Time: Bake 45-50 min at 375F  |  Servings: 1 loaf", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 overripe bananas, mashed", "1 cup milk (regular or non-dairy)", "1/2 cup melted butter (regular or non-dairy)", "1/2 cup maple syrup", "1/2 cup cane sugar", "1 teaspoon vanilla", "1 1/2 teaspoons baking powder", "1 teaspoon baking soda", "1/2 teaspoon cinnamon", "2 cups all-purpose flour (regular or gluten-free)", "1 cup crushed walnuts or pecans"]}, {"type": "sub", "text": "Cinnamon cream cheese frosting (optional)"}, {"type": "ul", "items": ["2 tablespoons soft butter", "2 oz cream cheese", "3/4 cup powdered sugar", "1/2 teaspoon cinnamon"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 375F. Spray a metal loaf pan with nonstick baking spray.", "Mash the bananas in a mixing bowl with a fork.", "Add the milk, butter, sugar, maple syrup, vanilla, baking powder, baking soda, and cinnamon and mix. Add the flour and mix until a batter forms. Fold in the nuts.", "Pour into the loaf pan. Sprinkle the top with more nuts and oats.", "Bake 45-50 minutes, until golden brown and done in the center.", "Serve warm with butter and a drizzle of maple syrup, or top with the cinnamon cream cheese frosting."]}, {"type": "p", "text": "Note: The frosting steps aren't written out; beat the frosting ingredients together until smooth. From Google Drive: Maple Pecan Banana Bread Recipe"}], "slug": "maple-pecan-banana-nut-bread", "cat": "Breads and Muffins"}, "pizza-dough": {"title": "Pizza Dough", "meta": "Time: Mix 2 min + 10 min, rest 1-3 hours, refrigerate 1-3 days  |  Source: Dough Guy", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Percentages"}, {"type": "ul", "items": ["Water 62%", "Yeast .4%", "Salt 2.5%", "Olive Oil 3.3%", "Sugar 2.5%"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cool water to <60°F.", "Mix water + yeast.", "Add flour + olive oil, mix 2 min.", "Keep mixing on low, add sugar + salt.", "Mix 10 more min.", "Cover with plastic wrap, rest for 1-3 hours.", "Divide into dough balls.", "Shape + seal the seam.", "Place in lightly oiled containers.", "Cover + refrigerate 1-3 days (3 is ideal).", "Let come to room temp before baking."]}, {"type": "p", "text": "Note: Ingredients given only as percentages (flour amount not listed); creator recommends his dough calculator."}], "slug": "pizza-dough", "cat": "Breads and Muffins"}, "pumpkin-cinnamon-pull-apart-bread": {"title": "Pumpkin Cinnamon Pull-Apart Bread", "meta": "Time: Bake 35-40 min at 350F  |  Source: Piper (salt.and.piper__) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 can biscuits", "1 cup sugar", "1 tbsp cinnamon", "1 tsp pumpkin pie spice", "1/2 cup pumpkin puree", "1 stick butter, melted"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Open the biscuits and split each one in half, so you have 16 biscuit portions. Mix the sugar, cinnamon, and pumpkin pie spice together in a shallow bowl. Melt the butter in a separate bowl.", "In another bowl, mix the pumpkin puree with 1-2 tbsp of the cinnamon sugar mixture.", "Dip each piece of biscuit in the melted butter, then coat completely in the cinnamon sugar.", "Stack the biscuits on top of each other, adding about 1/2-1 tsp of the pumpkin mixture between each biscuit. Place the stack sideways into a loaf pan.", "Bake at 350F for 35-40 minutes, or until baked through and golden."]}, {"type": "p", "text": "Note: Saved from TikTok: https://www.tiktok.com/@salt.and.piper__/video/7688513063904906527"}], "slug": "pumpkin-cinnamon-pull-apart-bread", "cat": "Breads and Muffins"}, "pumpkin-cream-cheese-loaf": {"title": "Pumpkin Cream Cheese Loaf", "meta": "Time: Bake 65-75 min at 350F  |  Source: Sarah Kraffty", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Browned butter"}, {"type": "ul", "items": ["1/2 cup (one stick) salted butter", "2 tbsp butter"]}, {"type": "sub", "text": "Wet ingredients"}, {"type": "ul", "items": ["3/4 sugar", "1/2 cup brown sugar", "2 eggs", "1 tsp vanilla", "1 cup pumpkin puree"]}, {"type": "sub", "text": "Dry ingredients"}, {"type": "ul", "items": ["1 & 3/4 cup all purpose flour", "1 tsp baking soda", "1/2 tsp salt", "1 tsp cinnamon", "1/2 tsp nutmeg", "1/4 tsp cloves"]}, {"type": "sub", "text": "Cream cheese filling"}, {"type": "ul", "items": ["8 oz cream cheese", "1/4 cup sugar", "1 egg", "1 tsp vanilla"]}, {"type": "sub", "text": "Topping"}, {"type": "ul", "items": ["Cinnamon, a sprinkle", "1/4 cup brown sugar"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a pan add 1/2 cup (one stick) salted butter. Brown it, leave on high heat until it turns brown. Take it off the heat and add 2 tbsp butter to it and let it cool.", "In a mixing bowl add: cooled browned butter, 3/4 sugar, 1/2 cup brown sugar, 2 eggs, 1 tsp vanilla. Mix. Add 1 cup of pumpkin puree and mix.", "In a separate bowl add: flour, baking soda, salt, cinnamon, nutmeg and cloves. Whisk it all together.", "Fold in dry ingredients into the wet. Set aside.", "Next make the cream cheese filling: 8 oz cream cheese, 1/4 cup sugar, 1 egg, 1 tsp vanilla. Mix it all together.", "In a greased loaf pan: Layer 1/3 of batter then 1/2 of cream cheese on top. Using a toothpick swirl it. Next add 1/3 of the batter and the rest of the cream cheese mixture on top. Swirl it. Next add the rest of the batter and swirl a little more. Top with a sprinkle of cinnamon and 1/4 cup of browned sugar sprinkled all over the top.", "Bake at 350 for 65-75 minutes until a toothpick comes out clean from the center!"]}, {"type": "p", "text": "Note: \"3/4 sugar\" has no unit in the caption. A line may be hidden between the end of the cream cheese filling list and \"Mix it all together\"."}], "slug": "pumpkin-cream-cheese-loaf", "cat": "Breads and Muffins"}, "pumpkin-cream-cheese-muffins": {"title": "Pumpkin Cream Cheese Muffins", "meta": "Time: Bake 15-17 min at 350F  |  Source: Melissas_healthykitchen", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Muffins"}, {"type": "ul", "items": ["1 cup organic pumpkin puree", "3 large organic pasture raised eggs", "1/4 cup melted refined coconut oil (for DF option) or melted vanilla bean ghee", "1/3 cup organic maple syrup", "1 1/2 tsp vanilla extract", "1 Tbsp pumpkin pie spice", "1 tsp cinnamon", "1 tsp baking soda", "1/4 tsp salt", "1 cup almond flour", "1/2 cup organic tapioca flour", "1/4 cup organic coconut flour", "Optional: pumpkin seeds for topping"]}, {"type": "sub", "text": "Cream Cheese Filling"}, {"type": "ul", "items": ["7 oz cream cheese (use DF cream cheese if making DF)", "2 1/2 Tbsp organic maple syrup", "2 Tbsp milk (sub DF milk)", "1 1/2 tsp vanilla extract", "2 Tbsp gluten free flour"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Add all dry ingredients to a medium size bowl and mix.", "Add wet ingredients in another bowl and mix.", "Add dry ingredients to wet ingredients and mix.", "Add to lined muffin tin.", "Add ingredients for cream cheese filling to a bowl, mix with a handheld mixer until smooth and creamy.", "Pipe cream cheese mixture in the center of each muffin.", "Sprinkle pumpkin seeds around top.", "Bake 350F for 15-17 minutes or until a toothpick comes out clean.", "Let cool for 5 minutes in muffin tin, then transfer to a wire cooling rack to cool completely, and enjoy!", "Store in an airtight container in the refrigerator."]}], "slug": "pumpkin-cream-cheese-muffins", "cat": "Breads and Muffins"}, "pumpkin-cream-cheese-muffins-100krecipes-com": {"title": "Pumpkin Cream Cheese Muffins (100krecipes.com)", "meta": "Time: Total 35 min  |  Servings: 12  |  Source: 100krecipes.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the pumpkin muffins"}, {"type": "ul", "items": ["1 1/2 cups all-purpose flour", "3/4 cup granulated sugar", "1 tsp baking powder", "1 tsp baking soda", "1 tsp pumpkin pie spice", "1/4 tsp salt", "1 1/2 cups pumpkin puree", "1 egg", "1/4 cup melted butter", "1 tsp vanilla extract"]}, {"type": "sub", "text": "For the cream cheese filling"}, {"type": "ul", "items": ["4 oz cream cheese, at room temperature", "2 tbsp granulated sugar", "1 tsp all-purpose flour", "1 tsp milk", "1/2 tsp vanilla extract"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350F.", "Add all-purpose flour, granulated sugar, baking powder, baking soda, pumpkin pie spice, and salt to a large bowl. Mix until combined. Set aside.", "In another bowl, whisk together pumpkin puree, egg, melted butter (cooled), and vanilla extract until combined. Then, add these wet ingredients to the dry ingredients. Mix using a rubber spatula or a wooden spoon until just combined. Don't over-mix the batter.", "Grease the muffin tin with non-stick cooking spray or line with paper liners. Scoop the batter into the prepared muffin tin. Fill each liner about 3/4 full. Set aside.", "Prepare the cream cheese filling. In a bowl, whisk together softened cream cheese, granulated sugar, all-purpose flour, milk, and vanilla extract until combined. Then, transfer the cream cheese filling to the piping bag. Fill each muffin with the cream cheese filling; dip..."]}, {"type": "p", "text": "Note: Directions cut off partway through step 5 (no bake time shown)."}], "slug": "pumpkin-cream-cheese-muffins-100krecipes-com", "cat": "Breads and Muffins"}, "pumpkin-cream-cheese-swirl-muffins": {"title": "Pumpkin Cream Cheese Swirl Muffins", "meta": "Time: Prep 10 min, Cook 20 min, Total 28 min  |  Servings: 16 cupcakes  |  Source: tastegreatfoodie.com (Lama)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Batter"}, {"type": "ul", "items": ["1 ¾ cups all-purpose flour", "1 tablespoon pumpkin pie spice", "1 teaspoon baking soda", "½ teaspoon salt", "1 cup honey", "1 cup packed brown sugar or coconut sugar", "1 (15 oz) pumpkin puree", "2 eggs large", "½ cup coconut oil or vegetable oil, or avocado oil", "1 tablespoon vanilla extract"]}, {"type": "sub", "text": "Cream Cheese Frosting"}, {"type": "ul", "items": ["8 oz cream cheese", "1 tablespoon honey or granulated sugar", "½ tablespoon vanilla extract"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven at 350°F. In a bowl combine the dry ingredients, white flour, pumpkin spice, baking soda and salt.", "Then add the wet ingredients, honey, brown sugar, pumpkin purée, eggs, coconut oil, and vanilla extract. Mix until very well combined.", "In a small bowl mix together the softened room temperature cream cheese, honey and vanilla extract.", "Scoop about ¼ cup batter into oil sprayed cupcake liners. I used large cupcake liners which made 8 big cupcakes but this recipe will make about 16 regular sized cup cakes.", "Now heat the softened cream cheese mixture for 15 seconds in the microwave then scoop in the center of each cupcake batter about ½ tablespoon cream cheese frosting. Using a toothpick, gently swirl around.", "Bake for 18-20 minutes."]}, {"type": "p", "text": "Note: Use canned 100% pure pumpkin, not pumpkin pie filling. Store in an airtight container in the fridge up to 5 days; freeze wrapped in foil in a freezer bag up to three months. 274 kcal per serving."}], "slug": "pumpkin-cream-cheese-swirl-muffins", "cat": "Breads and Muffins"}, "salted-maple-banana-bread": {"title": "Salted Maple Banana Bread", "meta": "Time: Bake at 325F until 200-205F internal (time not listed)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "1x - 1 standard loaf pan"}, {"type": "ul", "items": ["170g softened unsalted butter", "223g brown sugar", "72g white sugar", "340 (g) mashed banana", "2 eggs", "6g vanilla paste", "6g molasses", "250g AP flour", "5g baking soda", "5g salt", "4oz buttermilk", "2oz Grade A maple syrup", "Flaky sea salt"]}, {"type": "sub", "text": "3.5x - 2 XL loaf pans"}, {"type": "ul", "items": ["595g softened unsalted butter", "800g brown sugar", "250g white sugar", "1,190g mashed banana", "7 eggs", "20g vanilla paste", "20g molasses", "875g AP flour", "18g baking soda", "18g salt", "16oz buttermilk", "8oz Grade A maple syrup", "Flaky sea salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cream softened butter and both sugars together.", "Add your mashed banana and mix until combined.", "Add your eggs and vanilla then mix again. The butter will split. Don't worry!", "Whisk your flour, baking soda, and salt in a separate bowl.", "Combine your wet and dry ingredients.", "Add your buttermilk half at a time mixing thoroughly after each addition.", "Pour into your lightly sprayed and parchment covered loaf pan.", "Bake at 325 degrees until deeply golden and firm to the touch. (200-205 degrees internal temp)", "Remove from oven and immediately pour maple syrup on top. The maple syrup will absorb quickly so pour and distribute with a pastry brush in small sections.", "Top with flaky sea salt and allow to cool completely before enjoying."]}, {"type": "p", "text": "Note: Tip: even better the next day, and at its peak if you slice it, wrap each slice in plastic wrap, freeze, then thaw before enjoying. Molasses is listed but not mentioned in the steps."}], "slug": "salted-maple-banana-bread", "cat": "Breads and Muffins"}, "starbucks-lemon-loaf": {"title": "Starbucks Lemon Loaf", "meta": "Time: Bake 50-55 min at 350F  |  Source: Instagram", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 eggs", "2 tbsp zest (2 large lemons)", "1 cup sugar", "1/2 cup neutral oil (any oil without much flavour or smell)", "2 tbsp lemon juice", "2-3 tsp lemon extract", "3/4 cup plain yogurt", "1 tsp baking powder", "1/4 tsp baking soda", "3/4 tsp salt", "1.5 cups AP flour"]}, {"type": "sub", "text": "Syrup"}, {"type": "ul", "items": ["Around 2 tbsp lemon juice", "1.5 tbsp sugar"]}, {"type": "sub", "text": "Icing"}, {"type": "ul", "items": ["1/2 cup powdered sugar", "1/2 tbsp milk", "1 tbsp lemon juice"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Rub together the sugar and lemon zest for 3-5 minutes.", "Beat together the lemony sugar and eggs for about 2 minutes until light and airy. Add in the lemon juice and lemon extract. Add in the oil. Add in the yogurt and mix until combined.", "In a small bowl whisk the flour, baking soda, baking powder and salt.", "Add 1/2 into the wet ingredients and incorporate it together. Add in the rest and mix until just combined.", "Bake at 350 in a 9x5 loaf pan for about 50-55 minutes or until a toothpick inserted comes out with a few crumbs (if you have a dark pan, bake at 325 because the pan retains more heat). It should be springy to the touch.", "During this time make the lemon simple syrup by combining the two ingredients and cooking until the sugar has dissolved and it comes to a boil.", "Take the cake out of the pan and brush liberally with lemon syrup.", "Make the glaze with powdered sugar, lemon juice and milk.", "Let the cake cool and pour glaze and spread on it."]}], "slug": "starbucks-lemon-loaf", "cat": "Breads and Muffins"}, "almond-ricotta-biscuit-cake": {"title": "Almond Ricotta Biscuit Cake", "meta": "Time: Bake 30-35 min at 350F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 cup ricotta cheese", "1/2 cup unsalted butter, softened", "1 cup granulated sugar", "2 large eggs", "1 teaspoon vanilla extract", "1 1/2 cups all-purpose flour", "1 teaspoon baking powder", "1/2 teaspoon baking soda", "1/4 teaspoon salt", "1/2 cup almond flour", "1/4 cup sliced almonds (for topping)", "Powdered sugar (for dusting)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat your oven to 350°F (175°C) and grease a 9-inch round cake pan.", "In a large bowl, beat together the ricotta cheese and softened butter until creamy.", "Add the granulated sugar, eggs, and vanilla extract to the mixture, and mix until well combined.", "In another bowl, whisk together the all-purpose flour, baking powder, baking soda, salt, and almond flour.", "Gradually add the dry ingredients to the wet mixture, stirring until just combined. Be careful not to overmix.", "Pour the batter into the prepared cake pan and smooth the top with a spatula.", "Sprinkle the sliced almonds evenly over the top of the batter for that lovely crisp finish.", "Bake in the preheated oven for 30-35 minutes, or until a toothpick inserted in the center comes out clean.", "Once baked, let the cake cool in the pan for about 10 minutes before transferring it to a wire rack to cool completely.", "Dust with powdered sugar before serving, and enjoy the warm, comforting flavors of this delightful cake!"]}, {"type": "p", "text": "Note: Full title on post: Almond Ricotta Biscuit Cake with a Crisp Top Finish."}], "slug": "almond-ricotta-biscuit-cake", "cat": "Cakes and Cheesecakes"}, "apple-fritter-skillet-cake": {"title": "Apple Fritter Skillet Cake", "meta": "Time: Bake 40-45 min at 350F  |  Source: butternutbakeryblog.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Cinnamon Apples"}, {"type": "ul", "items": ["3 cups peeled and diced honeycrisp apples* (about 3 medium apples)", "2 tbsp unsalted butter", "1/3 cup (65g) light brown sugar, packed", "1 tsp ground cinnamon"]}, {"type": "sub", "text": "Apple Fritter Cake"}, {"type": "ul", "items": ["2 1/2 cups (330g) all purpose flour**", "1 tsp baking powder", "1 tsp baking soda", "1/2 tsp kosher salt", "1/2 tsp ground cinnamon", "1/4 tsp ground nutmeg", "1/2 cup (110g) unsalted butter, melted and cooled", "1/2 cup (105g) light brown sugar, packed", "1/2 cup (120g) unsweetened apple sauce, room temp", "2 tsp vanilla extract", "2 large eggs, room temp", "1/2 cup (120g) milk", "1 tbsp light brown sugar, for sprinkling"]}, {"type": "sub", "text": "Icing"}, {"type": "ul", "items": ["2 cups (220g) powdered sugar", "1/4 cup (60ml) milk"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350F.", "Place an 11-12\" cast iron or oven-safe skillet over medium heat and add the apples, butter, brown sugar, and cinnamon.", "Stir and continue to heat until the apples start to become tender and their juices produce a syrup-like coating (about 10 minutes).", "Remove from heat and move on to the batter.", "Apple Fritter Cake: In a medium bowl, whisk together the flour, baking powder, baking soda, salt, cinnamon, and nutmeg.", "In a large mixing bowl, whisk together the butter, sugar, and apple sauce, whisk in the vanilla and eggs.", "Once smooth, whisk in the dry ingredients. The batter will become very thick so halfway through mixing, pour in the milk and continue to mix.", "The batter should be thick and sticky.", "Back to the skillet full of apples, remove 1/2 cup of the apples with some of the syrup.", "Then pour the batter into the skillet full of apples and fold to combine the two. It doesn't have to be well mixed. Just fold just enough to where the apples and syrup are evenly distributed.", "Spoon the reserved 1/2 cup of apples on top in a random placement. Sprinkle with the remaining 1 tbsp of brown sugar, concentrating the sugar in the apple sections.", "Bake for 40-45 minutes or until a toothpick in the center comes out clean with a few moist crumbs.", "Icing: While the cake cools, make the icing.", "Whisk together the sugar and milk until smooth. It should be the consistency of elmer's glue. If it's too thin, whisk in a spoonful of sugar at a time until you reach the right thickness.", "After about 15 minutes, pour the icing over the warm cake.", "Now you're ready to cut a slice or dig straight in with a spoon. Enjoy!"]}, {"type": "p", "text": "Note: *Apples: honeycrisp preferred, but any firm and sweet apple will do such as fuji, jazz or pink lady. **Gluten free flour: untested, but author suggests a cup for cup gluten free baking flour. Source: https://butternutbakeryblog.com/apple-fritter-skillet-cake/"}], "slug": "apple-fritter-skillet-cake", "cat": "Cakes and Cheesecakes"}, "baked-milk-sponge-cake-with-lemon-and-cinnamon": {"title": "Baked Milk Sponge Cake with Lemon and Cinnamon", "meta": "Time: Bake 45 min at 170C  |  Source: Cocinar en Casa", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 liter of milk", "4 eggs", "50 g of flour", "75 g of light sugar Hileret (equivalent to 150 g of regular sugar)", "1/2 lemon zest", "1 vanilla extract", "1 cinnamon stick (I didn't use that)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a saucepan, add the milk and bring to a boil with the lemon zest. Remove from heat and let cool.", "Separate the egg yolks from the egg whites.", "Whisk the egg yolks with the light sugar and vanilla extract until they lighten and the sugar dissolves.", "Add the flour and mix.", "Incorporate the milk, removing the lemon zest beforehand, and mix.", "Add the whipped egg whites in a snow-like consistency with a whisk.", "Place in a previously greased mold and cover with parchment paper.", "Bake in a 170C oven for 45 minutes.", "Let cool to room temperature and refrigerate for at..."]}, {"type": "p", "text": "Note: Directions cut off in the last step (refrigeration time not shown)."}], "slug": "baked-milk-sponge-cake-with-lemon-and-cinnamon", "cat": "Cakes and Cheesecakes"}, "banana-bread-bottom-cheesecake": {"title": "Banana Bread Bottom Cheesecake", "meta": "Time: Bake 30-40 min at 350F; chill 3 hours or overnight  |  Servings: 10  |  Source: YouTube", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Banana Bread Layer"}, {"type": "ul", "items": ["4 bananas (as ripe as possible)", "4 tablespoon vegetable oil", "1 egg", "½ cup sugar", "1 teaspoon vanilla extract", "1½ cups all-purpose flour", "1 teaspoon baking powder", "1 teaspoon baking soda", "¼ teaspoon salt", "1 teaspoon cinnamon"]}, {"type": "sub", "text": "Cheesecake Layer"}, {"type": "ul", "items": ["32 ounces cream cheese, softened", "½ cup sugar", "1 tablespoon vanilla extract", "1 cup milk", "1 tablespoon gelatin powder", "Caramel, for drizzling"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 350°F/180°C.", "In a large bowl, mash the bananas with a fork.", "Add in the oil, egg, vanilla, and sugar. Stir until combined.", "Add in the flour, baking powder, baking soda, salt, and cinnamon. Stir until just combined. Don't over mix.", "Pour the banana bread batter into a greased springform pan and bake for 30-40 minutes or until the top is set.", "In a large bowl, add the softened cream cheese, sugar, and vanilla. Whisk until combined.", "Microwave the milk
