<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recipes</title>
<style>
:root{
  --bg:#faf6f0; --surface:#ffffff; --ink:#2a2420; --muted:#6f645b; --line:#e6ddd2;
  --accent:#b4532a; --accent-ink:#ffffff; --accent-soft:#f6e3d8; --done:#a59a90;
  --radius:18px; --gap:clamp(12px,1.6vw,24px);
  --fs:clamp(18px,1.55vw,28px); --fs-lg:clamp(24px,2.2vw,40px); --fs-xl:clamp(30px,3.2vw,58px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1714; --surface:#26211d; --ink:#f3ece4; --muted:#b3a79b; --line:#3a332d;
    --accent:#e07a4b; --accent-ink:#1b1714; --accent-soft:#3a2a21; --done:#6e655d;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1714; --surface:#26211d; --ink:#f3ece4; --muted:#b3a79b; --line:#3a332d;
  --accent:#e07a4b; --accent-ink:#1b1714; --accent-soft:#3a2a21; --done:#6e655d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:var(--gap);align-items:center;
  padding:calc(var(--gap)*.8) var(--gap);background:var(--bg);border-bottom:1px solid var(--line)}
.btn{border:0;border-radius:999px;padding:.45em 1em;background:var(--accent-soft);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn[hidden]{display:none}
#crumb{font-size:var(--fs-lg);font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#search{flex:0 1 26ch;min-width:8ch;font:inherit;padding:.4em .9em;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
#search:focus{outline:none;border-color:var(--accent)}
main{padding:var(--gap);max-width:2000px;margin:0 auto}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr))}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:5.2em;padding:.8em 1em;border-radius:var(--radius);
  background:var(--surface);border:2px solid var(--line);text-align:left;cursor:pointer}
.tile:active{border-color:var(--accent)}
.tile .name{font-size:var(--fs-lg);font-weight:700;line-height:1.15}
.tile .count{color:var(--muted)}
.list{display:grid;gap:calc(var(--gap)*.6);grid-template-columns:repeat(auto-fill,minmax(min(100%,17em),1fr))}
.item{padding:.75em 1em;border-radius:14px;background:var(--surface);border:2px solid var(--line);text-align:left;cursor:pointer;line-height:1.25}
.item:active{border-color:var(--accent)}
.item small{display:block;color:var(--muted);font-size:.75em;margin-top:.2em}
.empty{color:var(--muted);padding:1em 0}
h1.title{font-size:var(--fs-xl);line-height:1.1;margin:.1em 0 .25em}
.meta{color:var(--muted);margin-bottom:var(--gap)}
.cols{display:grid;gap:calc(var(--gap)*1.5);grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6em 1.1em 1em}
.panel h2{font-size:var(--fs-lg);margin:.4em 0 .3em;color:var(--accent)}
.panel h3{font-size:1em;margin:.8em 0 .2em}
.panel p{margin:.5em 0}
ul.ing,ol.steps{list-style:none;margin:0;padding:0}
ul.ing li,ol.steps li{position:relative;cursor:pointer;border-radius:10px}
ul.ing li{padding:.28em .4em .28em 1.6em}
ul.ing li::before{content:"";position:absolute;left:.35em;top:.72em;width:.55em;height:.55em;border-radius:50%;border:2px solid var(--accent)}
ul.ing li.done{color:var(--done);text-decoration:line-through}
ul.ing li.done::before{background:var(--accent)}
ol.steps{counter-reset:s}
ol.steps li{counter-increment:s;padding:.5em .5em .5em 2.6em;margin:.15em 0}
ol.steps li::before{content:counter(s);position:absolute;left:.3em;top:.45em;width:1.7em;height:1.7em;border-radius:50%;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85em}
ol.steps li.current{background:var(--accent-soft)}
ol.steps li.current::before{background:var(--accent);color:var(--accent-ink)}
ol.steps li.done{color:var(--done)}
.note{color:var(--muted);font-size:.85em;margin-top:var(--gap);overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:.75em;margin:.2em 0 .6em}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" hidden>&larr; Back</button>
  <button class="btn" id="home" hidden>Home</button>
  <div id="crumb">Recipes</div>
  <input id="search" type="search" placeholder="Search recipes" autocomplete="off">
</header>
<main id="main"></main>

eheat well. Variations shown: box mix + fruit (3 cups mix + 2 1/4 cups water, 400F ~12-15 min); cinnamon-roll swirl of melted butter + brown sugar + cinnamon (425F 15-18 min); sausage + cheddar (400F ~12-15 min); protein pancake mix + eggs + milk + fruit (350F ~15 min). Tips: grease well, tap pan to level, rest a minute before slicing."}], "slug": "sheet-pan-pancakes", "cat": "Breakfast"}, "abuelita-s-green-salsa": {"title": "Abuelita's Green Salsa", "meta": "Time: 5 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3/4 lb tomatillos", "2 serrano peppers", "1 cilantro (bunch)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Blend all ingredients."]}, {"type": "p", "text": "Note: From Google Drive: Favorite Recipes"}], "slug": "abuelita-s-green-salsa", "cat": "Appetizers and Dips"}, "araceli-s-lime-guacamole": {"title": "Araceli's Lime Guacamole", "meta": "Time: 15 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["12 avocados", "8 Roma tomatoes", "4 cilantro (bunches)", "3-4 limes", "1 white onion", "Salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Dice the tomatoes and chop the cilantro. Add to the avocados.", "Grate the onion over the mixture.", "Juice the limes and add the zest of 1 lime.", "Mix."]}, {"type": "p", "text": "Note: The original says \"4 cilantro\" with no unit; bunches assumed. From Google Drive: Favorite Recipes"}], "slug": "araceli-s-lime-guacamole", "cat": "Appetizers and Dips"}, "araceli-s-spinach-dip": {"title": "Araceli's Spinach Dip", "meta": "Time: 10 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["10 oz box frozen spinach, thawed, drained and squeezed dry", "16 oz sour cream", "1 cup mayonnaise", "1 packet Knorr vegetable recipe mix", "8 oz can water chestnuts, drained and finely chopped", "1 bunch green onions, chopped", "1 teaspoon Worcestershire sauce", "1 teaspoon nutmeg", "Salt and pepper to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mix everything together."]}, {"type": "p", "text": "Note: From Google Drive: Favorite Recipes"}], "slug": "araceli-s-spinach-dip", "cat": "Appetizers and Dips"}, "backyard-elote-nachos": {"title": "Backyard Elote Nachos", "meta": "Time: Cheese sauce about 15 min on the grill  |  Servings: 8-10  |  Source: Liz Heart", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 bag Tostitos Mexican Street Corn Flavored Tortilla Chips", "16 oz frozen sweet corn", "Freshly grated Parmesan cheese", "Crema", "Salsa Valentina", "Juice of 1 lime", "1 avocado, diced", "Sliced jalapenos"]}, {"type": "sub", "text": "Cheese Sauce"}, {"type": "ul", "items": ["10 oz smoked Gouda, cubed", "10 oz Monterey Jack, cubed", "8 oz cream cheese", "1/2 cup evaporated milk", "1 (10 oz) can diced tomatoes with green chiles", "1 tsp garlic powder", "1 tsp onion powder", "1/2 tsp smoked paprika"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Add all of the cheese sauce ingredients to a grill-safe pan. Grill over medium heat with the lid closed, stirring every 3-4 minutes, until smooth and melted (about 15 minutes).", "Spread the Tostitos Mexican Street Corn Flavored Tortilla Chips onto a large platter.", "Pour over the warm cheese sauce, then top with the roasted corn, Parmesan, crema, Salsa Valentina, fresh lime juice, avocado, and jalapenos. Enjoy!"]}, {"type": "p", "text": "Note: How to roast the corn is not described in the caption. Sponsored post (#AD)."}], "slug": "backyard-elote-nachos", "cat": "Appetizers and Dips"}, "baked-cherry-tomato-and-burrata-dip": {"title": "Baked Cherry Tomato and Burrata Dip", "meta": "Time: Bake 45 min at 350F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Before baking"}, {"type": "ul", "items": ["1 lb (450 g) rainbow cherry tomatoes", "1/4 cup fresh parsley, finely chopped", "2 tsp salt", "2 tsp black pepper", "1 tsp chili flakes", "1 tsp oregano", "1 tsp basil", "1/3 cup olive oil", "2 whole garlic heads"]}, {"type": "sub", "text": "After baking"}, {"type": "ul", "items": ["8 oz (225 g) burrata filling / stracciatella", "1/4 cup fresh basil, chopped", "1/3 cup fresh parmesan, grated", "3 tbsp balsamic glaze (optional)", "1 package Simple Mills Organic Seed Flour Crackers"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat your oven to 350°F (175°C). In a baking dish, combine the cherry tomatoes, parsley, olive oil, and all the seasonings. Toss until everything is well coated.", "Slice the tops off the garlic heads to expose the cloves, then nestle them into the tomatoes. Drizzle the top of the garlic heads with extra olive oil and a pinch of salt.", "Bake for 45 minutes, until the tomatoes are soft, blistered, and beginning to burst.", "Let the dish cool for a few minutes, then squeeze the roasted garlic cloves out of their skins directly into the tomatoes. Mix everything together, gently breaking up some of the tomatoes as you go.", "Top with fresh Parmesan, fresh basil, the burrata filling (stracciatella), and an optional drizzle of balsamic glaze.", "Serve warm with Simple Mills Organic Seed Flour Crackers and enjoy!"]}, {"type": "p", "text": "Note: Creator handle not visible; post tags simplemills."}], "slug": "baked-cherry-tomato-and-burrata-dip", "cat": "Appetizers and Dips"}, "carol-s-salsa": {"title": "Carol's Salsa", "meta": "Time: 5 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["8-10 Roma tomatoes", "2-3 cilantro (bunches)", "Chiles in vinegar: 1.5 cups of the juice and 2-4 chiles", "1 large white onion", "1 tablespoon oregano", "1 tablespoon salt"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mix everything in a blender."]}, {"type": "p", "text": "Note: The original says \"2-3 cilantro\" with no unit; bunches assumed. From Google Drive: Favorite Recipes"}], "slug": "carol-s-salsa", "cat": "Appetizers and Dips"}, "ceviche-de-camaron-en-salsa-verde": {"title": "Ceviche de Camaron en Salsa Verde", "meta": "Time: Not listed  |  Source: Lov.Kari (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the ceviche"}, {"type": "ul", "items": ["1 lb shrimp", "Salt and black pepper", "1 cup lime juice", "3 tomatoes", "1 1/2 cucumber", "1 small red onion", "Some avocado"]}, {"type": "sub", "text": "For the salsa"}, {"type": "ul", "items": ["1/2 cucumber", "1 jalapeno pepper", "1 serrano pepper", "Small bunch of cilantro", "1 tbsp soy sauce", "1/4 tsp black pepper", "Salt to taste", "1/4 cup tomato juice (creator used Clamato)", "1/2 cup of the lime juice from the shrimp"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the TikTok caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Similar to aguachile; a family recipe from Culiacan, Sinaloa. Saved from TikTok: https://www.tiktok.com/@lov.kari/video/7358601400470834475"}], "slug": "ceviche-de-camaron-en-salsa-verde", "cat": "Appetizers and Dips"}, "chunky-dumpling-salsa": {"title": "Chunky Dumpling Salsa", "meta": "Time: Not listed  |  Source: Brendan Pang (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 tbsp chopped spring onion", "3 tbsp chopped coriander", "1 tbsp minced garlic", "1/2 tbsp minced ginger", "2 tbsp chopped roasted peanuts", "1 tbsp roasted white sesame seeds", "2 tbsp raw or caster sugar", "5 tbsp light soy", "4 tbsp rice vinegar", "6 tbsp chilli oil (recipe on my feed)", "1 tsp toasted sesame oil"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Mix well and adjust seasoning as desired.", "Cook dumplings to your liking and dunk into salsa to enjoy!"]}], "slug": "chunky-dumpling-salsa", "cat": "Appetizers and Dips"}, "crispy-parmesan-onion-ring-chips": {"title": "Crispy Parmesan Onion Ring Chips", "meta": "Time: Bake 25 min at 200C  |  Source: Road To Aesthetics (TikTok), original credit Stella Drivas", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["40g parmesan cheese", "1 onion", "2ml avocado oil spray", "Garlic powder", "Smoked paprika", "Salt and pepper"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Lay out your cheese on parchment paper.", "Add your onion rings on top.", "Add seasonings.", "Give a very light spray with avocado oil.", "Bake in the oven at 200C for 25 minutes.", "Take out of the baking tin and let cool on parchment paper on an airing rack.", "Keep an eye on them, you want crispy edges before taking them out of the oven!"]}, {"type": "p", "text": "Note: Calories: 191; protein 14g, carbs 9g, fat 11g."}], "slug": "crispy-parmesan-onion-ring-chips", "cat": "Appetizers and Dips"}, "fried-pickle-dip": {"title": "Fried Pickle Dip", "meta": "Time: Not listed  |  Source: Every Day is Feast Day", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cups of your favorite pickles", "1/2 clove garlic (sub 1 pickled garlic clove)", "2-3 tbsp fresh dill, chopped", "2 cups sour cream (sub Greek yogurt)", "1 small pinch kosher salt", "1/4 tsp onion powder", "2 cups toasted breadcrumbs (this may make extra, but it'll depend on how much you garnish with)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only)."}], "slug": "fried-pickle-dip", "cat": "Appetizers and Dips"}, "fried-pickle-dip-meat-church": {"title": "Fried Pickle Dip (Meat Church)", "meta": "Time: Not listed  |  Source: Meat Church (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Dip"}, {"type": "ul", "items": ["1 cup whipped cream cheese", "1 cup sour cream", "1 cup dill pickles, diced fine", "1 packet Ranch seasoning", "1/2 tsp onion powder", "1 lemon, juiced", "2 cloves garlic, grated", "2 tbsp fresh dill, chopped (save some for garnish)", "2 tbsp fresh chives, chopped", "Meat Church Lemon Pepper seasoning", "Thick potato chips or pretzels, for serving"]}, {"type": "sub", "text": "Topping"}, {"type": "ul", "items": ["3/4 cup panko (save some for garnish)", "1 tsp unsalted butter, melted"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Melt the butter in a pan over medium heat.", "Add the panko and toss to coat completely in butter.", "Cook until toasted. Set aside.", "Add all the dip ingredients to a medium bowl and mix to combine.", "Top with extra toasted panko and chopped dill."]}, {"type": "p", "text": "Note: Caption writes C, T and t; read as cup, tbsp and tsp. Amount of lemon pepper seasoning not given. Saved from TikTok: https://www.tiktok.com/@meatchurchbbq/video/7284609119934221614"}], "slug": "fried-pickle-dip-meat-church", "cat": "Appetizers and Dips"}, "grillo-s-pickle-dip": {"title": "Grillo's Pickle Dip", "meta": "Time: Not listed", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the Dip"}, {"type": "ul", "items": ["8 oz cream cheese, softened", "½ cup sour cream", "½ cup mayonnaise", "1 cup finely chopped Grillo's pickles", "1 tablespoon pickle brine", "1 teaspoon garlic powder", "1 teaspoon onion powder", "1 tablespoon fresh chopped dill (or 1 tsp dried)", "½ teaspoon black pepper"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot; any other ingredient sections beyond \"For the Dip\" are not visible."}], "slug": "grillo-s-pickle-dip", "cat": "Appetizers and Dips"}, "high-protein-shrimp-ceviche": {"title": "High Protein Shrimp Ceviche", "meta": "Time: Shrimp sits in lime juice about 1 hour  |  Source: 2tfitness (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Shrimp, peeled and deveined", "Red onion, diced", "Green onion, diced", "Cucumber, diced", "Tomato, diced", "Jalapeno, diced", "Fresh cilantro", "Fresh lime juice", "Salt and pepper", "Garlic powder", "Hot sauce"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Boil the shrimp for about 30 seconds, then drain.", "Top the shrimp with fresh lime juice and let it sit for about an hour.", "Dice the red onion, green onion, cucumber, tomato, and jalapeno.", "Add the veggies, shrimp, and cilantro to a bowl, then season with salt, pepper, and garlic powder.", "Add as much hot sauce as you want and mix everything together.", "Chill and enjoy."]}, {"type": "p", "text": "Note: Amounts not given. Approximate macros per serving: 250 calories, 35g protein, 15g carbs, 5g fat. Good for meal prep. Saved from Instagram: https://www.instagram.com/p/Dd67nnnlZxe/"}], "slug": "high-protein-shrimp-ceviche", "cat": "Appetizers and Dips"}, "onion-bhajis": {"title": "Onion Bhajis", "meta": "Time: About 40 min  |  Servings: About 12 bhajis", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["4 medium red onions", "Sunflower oil for frying (about 200-400 ml)"]}, {"type": "sub", "text": "Batter"}, {"type": "ul", "items": ["150 g plain flour", "2 teaspoons turmeric", "2 teaspoons garlic powder", "2 teaspoons cumin powder", "1 teaspoon paprika", "1 teaspoon ginger powder", "180 ml water"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Peel and halve the red onions, then slice them finely into thin half-moon crescents.", "Mix all the batter ingredients together in a large bowl. While whisking, pour in 180 ml of water and mix until smooth. It should be thick and gloopy; add a splash more water if it feels too stiff.", "Tip the onions into the bowl and mix until well coated in the batter.", "Scoop a 2-inch ball of the mixture and shape it into a rough patty about 4-5 cm wide. Place on a tray or board and repeat; you should get about 12.", "Heat the oil in a large heavy pan (a Dutch oven works well) over medium-high heat. You need enough oil to come about halfway up the bhajis, normally 200-400 ml depending on the pan.", "Test the oil with a stray onion slice. Once it bubbles and spits vigorously, the oil is ready.", "Using a metal spatula, slide in 4-5 bhajis one at a time. Fry about 3 minutes until the underside is crisp and golden, then flip and cook 3 minutes more.", "Move the cooked bhajis to a tray lined with paper towel and salt them immediately.", "Repeat until all the bhajis are fried."]}, {"type": "p", "text": "Note: Plain flour version. Naturally vegan; great as a side with curry. From Google Drive: Onion Bhajis (Plain Flour Recipe)"}], "slug": "onion-bhajis", "cat": "Appetizers and Dips"}, "pellet-smoker-wings-with-louisiana-butter-sauce": {"title": "Pellet Smoker Wings with Louisiana Butter Sauce", "meta": "Time: Not listed  |  Source: Jenks BBQ (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Chicken wings"]}, {"type": "sub", "text": "Wing sauce"}, {"type": "ul", "items": ["Louisiana hot sauce", "Butter", "Cayenne", "Black pepper"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Smoke the wings on a pellet smoker using the \"0 to 400\" method for crispy, juicy wings.", "For the sauce, heat the Louisiana sauce, butter, cayenne and black pepper on the stove, then let it cool and set up."]}, {"type": "p", "text": "Note: Amounts and smoker temperatures/times are not given in the caption. Saved from TikTok: https://www.tiktok.com/@jenksbbq/video/7386030822630935839"}], "slug": "pellet-smoker-wings-with-louisiana-butter-sauce", "cat": "Appetizers and Dips"}, "roasted-feta-caprese-skillet": {"title": "Roasted Feta Caprese Skillet", "meta": "Time: Bake about 20 min at 400F, then broil 5-10 min  |  Source: Grace Elkus (graceelkus.com) (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 pints cherry tomatoes", "1 (15.5-ounce) can chickpeas, drained and rinsed", "2 large cloves garlic, sliced", "2 tablespoons extra-virgin olive oil", "1 teaspoon kosher salt", "1/4 teaspoon red pepper flakes", "Freshly ground black pepper", "1 (8-ounce) block feta, cut into three slabs", "Pesto and balsamic vinegar, for serving", "Toasted baguette or pita, for serving"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Heat the oven to 400F with one rack in the center and one in the upper third.", "Add the tomatoes, chickpeas, and garlic to a broiler-safe braiser, high-sided skillet, or 9-inch baking dish. Drizzle with the oil and season with salt, red pepper flakes, and several grinds of black pepper. Toss to coat.", "Nestle the feta into the pan and flip to coat in the oil. Bake on the center rack until the tomatoes just begin to split, about 20 minutes.", "Transfer to the upper oven rack and broil until everything is blistered to your liking, 5 to 10 minutes. (Pop some bread in there to toast, too.)", "Finish with a few spoonfuls of pesto, a drizzle of balsamic, and more red pepper flakes and black pepper, if desired. Serve with toasty bread."]}, {"type": "p", "text": "Note: Full recipe: https://graceelkus.com/recipes/roasted-feta-caprese-skillet/ Saved from Instagram: https://www.instagram.com/p/C-bJuTzOj1i/"}], "slug": "roasted-feta-caprese-skillet", "cat": "Appetizers and Dips"}, "salsa-verde-jose-el-cook": {"title": "Salsa Verde (Jose el Cook)", "meta": "Time: Not listed  |  Source: Jose el Cook (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["8 tomatillos", "2 jalapenos or 1 serrano", "2 garlic cloves", "1/2 tsp pepper", "1 packet chicken bouillon", "1 tsp garlic powder", "1 tsp onion powder", "1 bunch of cilantro (however much you prefer)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the TikTok caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Saved from TikTok: https://www.tiktok.com/@jose.elcook/video/7369887821856804127"}], "slug": "salsa-verde-jose-el-cook", "cat": "Appetizers and Dips"}, "salsa-verde-de-molcajete": {"title": "Salsa Verde de Molcajete", "meta": "Time: Char on comal: tomatillos about 20-25 min, onion about 20 min, chiles and garlic about 12-15 min  |  Servings: Yield: 1 pint  |  Source: Jonathan Zaragoza (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["558g tomatillos, whole", "45g white onion, large chunks", "30g serrano chiles, whole", "27g garlic, whole still in its paper", "8g Diamond Crystal kosher salt", "1g toasted Chiltepín chile powder"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Heat a comal or cast iron pan over medium high heat. Place the tomatillos directly in the center over the flame, next the onions, and the chiles and garlic around the edge. Cook everything until blackened and tender. This will take different times depending on a lot of factors, so make sure you are trusting your instincts. The tomatillos should take around 20-25 minutes (turning halfway through). The onion will take around 20 minutes. The chiles and garlic will take less time, around 12-15 minutes.", "Once everything is cooked properly, remove from heat and reserve.", "Rinse your molcajete under cool water. Place..."]}, {"type": "p", "text": "Note: Directions cut off after step 2 (the molcajete step is cut off mid-sentence)."}], "slug": "salsa-verde-de-molcajete", "cat": "Appetizers and Dips"}, "salsa-verde-ranch": {"title": "Salsa Verde Ranch", "meta": "Time: Boil 15 min; refrigerate 2 hrs  |  Source: rileysstupidrecipes", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Ranch Base"}, {"type": "ul", "items": ["1/3 cup buttermilk", "1/2 cup mayo", "1/2 cup Greek yogurt", "1/2 tbsp dried parsley", "1/2 tbsp dried dill", "1/2 tsp garlic powder"]}, {"type": "sub", "text": "Salsa Verde"}, {"type": "ul", "items": ["4 tomatillos", "1 clove garlic", "1 jalapeno", "1/2 tsp black pepper", "Salt (in boil)", "Cilantro (as much as you want)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Boil tomatillos, garlic and jalapeno 15 mins (stems off).", "Blend with pepper + bouillon, then add cilantro and blend again.", "Mix into ranch base, shake hard, refrigerate 2 hrs."]}, {"type": "p", "text": "Note: Directions mention bouillon, but no amount is listed in the ingredients."}], "slug": "salsa-verde-ranch", "cat": "Appetizers and Dips"}, "the-easiest-roasted-salsa": {"title": "The Easiest Roasted Salsa", "meta": "Time: Not listed  |  Source: freddsters (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["4 tomatoes", "4 jalapenos", "1/2 onion", "4 garlic cloves", "2 limes, juiced", "1 cilantro bunch", "1-2 tsp salt (or to taste)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only). Video shows charred tomatoes, jalapenos, onion and garlic going into a food processor or blender."}], "slug": "the-easiest-roasted-salsa", "cat": "Appetizers and Dips"}, "whipped-ricotta-dip-with-roasted-tomatoes": {"title": "Whipped Ricotta Dip with Roasted Tomatoes", "meta": "Time: Bake 20-30 min at 400F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Whipped Ricotta"}, {"type": "ul", "items": ["16 oz ricotta", "Zest of one lemon", "Salt & pepper to taste"]}, {"type": "sub", "text": "Roasted Tomatoes"}, {"type": "ul", "items": ["2 cups of cherry tomatoes", "4 tablespoons olive oil", "1 tsp thyme", "1 tsp oregano", "Salt and pepper to taste", "6 garlic cloves, crushed and sliced", "Fresh basil"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven to 400F.", "In a cast iron or oven safe pan, add tomatoes, garlic cloves, thyme, oregano, paprika, salt and pepper. Mix all the ingredients.", "Bake it in the oven for 20-30 minutes or until tomatoes are caramelized.", "Put ricotta, lemon, salt and pepper to a food processor, blend until smooth.", "Add ricotta to a shallow bowl and spread evenly.", "Add the roasted tomatoes and garnish with fresh basil.", "Serve with crusty bread of your choice!"]}, {"type": "p", "text": "Note: Paprika appears in the steps but not the ingredient list (no amount given)."}], "slug": "whipped-ricotta-dip-with-roasted-tomatoes", "cat": "Appetizers and Dips"}, "whipped-ricotta-with-herb-oil": {"title": "Whipped Ricotta with Herb Oil", "meta": "Time: Not listed  |  Source: starinfinitefood", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the oil"}, {"type": "ul", "items": ["1/2 cup olive oil", "1/4 cup finely chopped parsley", "1 tbsp dried oregano", "1 tbsp fresh chopped rosemary", "2 tbsp fresh chopped basil", "3 cloves minced garlic", "3/4 tsp sea salt", "1 tsp red pepper flakes", "1 1/2 tbsp balsamic vinegar"]}, {"type": "sub", "text": "For the ricotta"}, {"type": "ul", "items": ["3 cups ricotta", "Juice of 1/2 lemon", "Zest of 1/2 lemon", "1/2 tsp salt", "2-4 tbsp Parmesan"]}, {"type": "sub", "text": "Optional toppings"}, {"type": "ul", "items": ["More parsley/red pepper"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Make the ricotta. Mix the ricotta, lemon juice, lemon zest, and salt together with a hand mixer or a whisk and set aside.", "Make the oil: heat the olive oil over medium heat then add the parsley, rosemary, and basil once it is hot. Cook the herbs for 10 seconds then add the garlic, oregano, salt and red pepper flakes. Cook for another 10 seconds, until fragrant. Add the balsamic vinegar and mix to combine.", "Once it is cool, add the Parmesan and mix again. Spread the ricotta onto a plate, and create a divot in the middle to add the oil.", "Add the oil to the center then drizzle the top with the remaining.", "Top with parsley and red pepper flakes. Serve with crusty bread."]}], "slug": "whipped-ricotta-with-herb-oil", "cat": "Appetizers and Dips"}, "almost-famous-broccoli-cheddar-soup": {"title": "Almost-Famous Broccoli-Cheddar Soup", "meta": "Time: Total 1 hr 10 min, Active 45 min  |  Servings: 4 servings  |  Source: Food Network Kitchen", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["6 tablespoons unsalted butter", "1 small onion, chopped", "1/4 cup all-purpose flour", "2 cups half-and-half", "3 cups low-sodium chicken broth", "2 bay leaves", "1/4 teaspoon freshly grated nutmeg", "Kosher salt and freshly ground pepper", "4 7-inch sourdough bread boules (round loaves)", "4 cups broccoli florets (about 1 head)", "1 large carrot, diced", "2 1/2 cups (about 8 ounces) grated sharp white and yellow cheddar cheese, plus more for garnish"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Melt the butter in a large Dutch oven or pot over medium heat. Add the onion and cook until tender, about 5 minutes. Whisk in the flour and cook until golden, 3 to 4 minutes, then gradually whisk in the half-and-half until smooth. Add the chicken broth, bay leaves and nutmeg, then season with salt and pepper and bring to a simmer. Reduce the heat to medium-low and cook, uncovered, until thickened, about 20 minutes.", "Meanwhile, prepare the bread bowls: Using a sharp knife, cut a circle into the top of each loaf, leaving a 1-inch border all around. Remove the bread top, then hollow out the middle with a fork or your fingers, leaving a thick bread shell.", "Add the broccoli and carrot to the broth mixture and simmer until tender, about 20 minutes. Discard the bay leaves. Puree the soup in batches in a blender until smooth; you'll still have flecks of carrot and broccoli. Return to the pot. (Or puree the soup in the pot with an immersion blender.)", "Add the cheese to the soup and whisk over medium heat until melted. Add up to 3/4 cup water if the soup is too thick. Ladle into the bread bowls and garnish with cheese."]}], "slug": "almost-famous-broccoli-cheddar-soup", "cat": "Soups"}, "broccoli-cheddar-soup-disneyland-style": {"title": "Broccoli Cheddar Soup (Disneyland-Style)", "meta": "Time: Not listed  |  Source: YouTube video description", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["6 tablespoons butter", "1 medium chopped onion", "1/2 cup flour", "4 cups chicken broth", "1 crown of broccoli, chopped, about 3 cups", "1 teaspoon salt", "2 cups milk", "2 1/2 cups cheddar cheese", "Pepper to taste", "Additional salt if needed"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only; appears to be made in an Instant Pot). If desired, serve in a sourdough bread bowl."}], "slug": "broccoli-cheddar-soup-disneyland-style", "cat": "Soups"}, "chicken-pozole-verde": {"title": "Chicken Pozole Verde", "meta": "Time: Active 45 min, total 1 hr 15 min  |  Servings: 6 to 8", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["9 cups chicken stock or low-sodium broth", "4 chicken breasts or 6 chicken thighs", "1 pound tomatillos, husked and halved", "1 small onion, quartered", "2 poblano chiles, cored, seeded, and quartered", "2 jalapenos, seeded and quartered", "4 large garlic cloves, smashed", "1/2 cup cilantro, chopped", "1 tablespoon oregano leaves", "1/2 teaspoon kosher salt, plus more to taste", "1/4 teaspoon freshly ground black pepper, plus more to taste", "1 tablespoon vegetable oil", "3 (15-ounce) cans hominy, drained"]}, {"type": "sub", "text": "For serving"}, {"type": "ul", "items": ["Iceberg lettuce, finely shredded", "Radish, sliced", "Onion, chopped", "Avocado, diced", "Sour cream", "Tortilla chips", "Lime wedges"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a large soup pot, bring the chicken stock and water to a boil.", "Add the chicken, cover, and simmer over very low heat until tender and cooked through, about 25 minutes.", "Skim and discard any fat from the cooking liquid and set the liquid aside.", "Transfer the chicken to a cutting board and, once cool enough to handle, shred the meat.", "In a blender, combine the tomatillos, onion, poblanos, jalapenos, garlic, cilantro, and oregano. Pulse until coarsely chopped, scraping down the sides.", "With the machine on, add 1 cup of the cooking liquid and puree until smooth. Season the puree with salt and pepper.", "In a large, deep skillet, heat the vegetable oil until shimmering. Add the tomatillo puree and cook over moderate heat, stirring occasionally, until the sauce turns a deep green, about 12 minutes.", "Pour the green sauce into the cooking liquid in the soup pot. Add the hominy and bring to a simmer over moderate heat. Add the shredded chicken, season with salt and pepper, and cook just until heated through.", "Serve in deep bowls, passing the lettuce, radishes, onion, avocado, sour cream, tortilla chips, and lime wedges at the table."]}, {"type": "p", "text": "Note: Step 1 mentions water, but no amount is listed. From Google Drive: Pozole Green Chicken / Barbacoa"}], "slug": "chicken-pozole-verde", "cat": "Soups"}, "creamy-chicken-noodle-soup-with-potatoes": {"title": "Creamy Chicken Noodle Soup with Potatoes", "meta": "Time: Simmer 15-20 min  |  Source: Here's Your Bite (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 tbsp butter", "2 tbsp olive oil", "2 chicken breasts, seasoned", "1/2 large yellow onion, diced", "3 stalks celery, diced", "2-3 large carrots, diced", "1 tbsp Italian seasoning", "1 tsp red pepper flakes, to taste", "Salt and pepper, to taste", "8-10 cloves garlic, minced", "1/2 cup dry white wine (optional)", "6 cups chicken broth", "2-3 cups diced Yukon gold potatoes", "1-2 tsp chicken bouillon (optional)", "1 Parmesan rind (optional)", "1 bay leaf", "1/2-1 cup heavy cream, to taste", "Juice of 1/2 lemon", "1/4 cup fresh parsley, to taste", "2 tbsp fresh dill, to taste", "1 tbsp fresh rosemary, to taste", "1 tbsp fresh thyme, to taste", "1 lb egg noodles, cooked separately"]}, {"type": "sub", "text": "Garnish"}, {"type": "ul", "items": ["Freshly grated Parmesan, lemon juice, fresh dill, black pepper, red pepper, olive oil"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cook the egg noodles in salted water according to package instructions. Drain and set aside.", "In a large soup pot or Dutch oven, heat 1 tbsp butter and 1 tbsp olive oil over medium-high heat. Sear the chicken breasts on both sides until golden, about 3-4 minutes per side, then remove them from the pot and set aside.", "Add the remaining olive oil and butter to the pot. Lower the heat to medium, then add the onion, celery, and carrot. Season with salt, pepper, Italian seasoning, and red pepper flakes (if using), and saute for 5-7 minutes until the vegetables are softened.", "Add the garlic and cook for another 30 seconds until fragrant. Pour in the wine, if using, stir and let simmer for 2 minutes.", "Pour in the chicken broth, season with salt and pepper.", "Add the diced potatoes, chicken bouillon, Parmesan rind, and bay leaf. Stir to combine, then return the seared chicken breasts to the pot.", "Bring the mixture to a boil and simmer for 15-20 minutes, until the potatoes are fork-tender.", "Remove the chicken breasts from the pot, shred them using two forks, and set aside.", "Check the potatoes to ensure they're done, then remove the Parmesan rind and bay leaf.", "Stir in the heavy cream and lemon juice, followed by the parsley, dill, rosemary, and thyme.", "Return the shredded chicken to the pot, taste for seasoning, and adjust as needed.", "Serve the soup over the cooked egg noodles, topping each bowl with additional Parmesan, lemon juice, black pepper, red pepper flakes, dill, and a drizzle of olive oil."]}, {"type": "p", "text": "Note: Creator credits a version by Alyssa Alonso. Saved from TikTok: https://www.tiktok.com/@heresyourbite/video/7444727768178429230"}], "slug": "creamy-chicken-noodle-soup-with-potatoes", "cat": "Soups"}, "creamy-tuscan-sausage-and-gnocchi-soup": {"title": "Creamy Tuscan Sausage and Gnocchi Soup", "meta": "Time: Not listed  |  Source: Foodiligence", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1-2 tbsp sun dried tomato oil (regular olive oil works just as well)", "1 lb ground Italian sausage", "1/2 medium yellow onion", "4 cloves garlic", "1 tbsp tomato paste", "1/4 cup sun dried tomatoes", "1 tbsp Italian seasoning", "1/2 cup dry white wine (optional)", "3 cups chicken broth", "16 oz potato gnocchi", "2 cups half and half", "8 oz fresh baby spinach", "1/2 cup Parmesan cheese", "Salt and black pepper, to taste"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (caption says full written recipe is in creator's bio)."}], "slug": "creamy-tuscan-sausage-and-gnocchi-soup", "cat": "Soups"}, "daniel-s-minestrone-soup": {"title": "Daniel's Minestrone Soup", "meta": "Time: About 45 min  |  Source: Adapted from Giada De Laurentiis", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 tablespoon olive oil", "1 onion, diced", "2 cups carrots, diced (4 large carrots)", "2 cups celery, diced (5 stalks)", "2 zucchini, quartered and diced", "6 oz pancetta, diced", "4 garlic cloves, minced", "2 pounds Swiss chard, chopped", "3 cups russet potato, diced (3 medium potatoes)", "42 oz can diced tomatoes", "64 oz beef broth", "1 piece Parmesan cheese rind", "2 (15 oz) cans cannellini beans, drained and rinsed", "1 bunch Italian parsley, chopped", "2 rosemary sprigs", "16 oz elbow pasta or mini farfalle pasta", "Salt and pepper"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Heat 1 tablespoon olive oil in a heavy large pot over medium heat. Add the onion, carrots, celery, pancetta and garlic. Saute until the onion is translucent, about 10 minutes.", "Add the Swiss chard, potato, and zucchini and saute for 5 minutes.", "Add the tomatoes and rosemary sprigs. Simmer until the Swiss chard is wilted and the tomatoes break down, about 10 minutes.", "Add the beef broth and Parmesan cheese rind. Simmer until the potato pieces are tender, about 15 minutes.", "Add the cannellini beans and parsley. Simmer until the beans are heated through.", "Season with salt and pepper to taste.", "Discard the Parmesan rind and rosemary sprigs.", "Boil the pasta according to the package directions.", "Ladle the soup over the desired amount of pasta and top with fresh parsley and Parmesan cheese."]}, {"type": "p", "text": "Note: From Google Drive: Daniel's Minestrone Soup"}], "slug": "daniel-s-minestrone-soup", "cat": "Soups"}, "disney-broccoli-cheddar-soup": {"title": "Disney Broccoli Cheddar Soup", "meta": "Time: Simmer about 20 min, then about 25 min  |  Source: Walt Disney World Swan (swandolphin.com)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 tbsp. butter", "1/2 each Vidalia onion (medium size), julienne sliced", "1/4 cup melted butter", "1/4 cup flour", "1 cup milk", "1 cup heavy cream", "2 cups chicken stock", "1/2 lb. broccoli florets", "1 cup carrot, julienne sliced", "1/4 tsp. nutmeg", "8 oz. sharp cheddar cheese, grated", "Salt & pepper to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Saute onion in the 1 tbsp butter and set aside.", "In a large pot, whisk together melted butter and flour over a medium heat for about 3-4 minutes. Slowly whisk in milk, cream, and chicken stock. Let simmer for approximately 20 minutes.", "Add broccoli, carrot, and sauteed onions. Let this simmer for approximately 25 minutes on medium heat until the carrots and broccoli are tender.", "Add nutmeg, salt and pepper to taste, and cheddar cheese. Allow cheese to become melted and then serve."]}], "slug": "disney-broccoli-cheddar-soup", "cat": "Soups"}, "disneyland-loaded-baked-potato-soup": {"title": "Disneyland Loaded Baked Potato Soup", "meta": "Time: About 45 min  |  Source: Carnation Cafe copycat", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 pound bacon", "1 medium white onion", "2 large carrots", "1 cup celery", "1/4 cup all-purpose flour", "2 cups chicken broth", "3 large russet potatoes", "6 small red potatoes", "1/2 teaspoon salt", "1/2 teaspoon pepper", "1/4 teaspoon garlic salt", "3 cups heavy whipping cream", "1 cup shredded cheddar cheese", "1/4 cup chopped chives"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cook the bacon in a large pot over medium heat until crispy. Remove and place on a paper towel.", "Add the onion, carrot and celery to the bacon fat. Cook until fork tender, about 8 minutes.", "Whisk in the flour, stirring to combine. Cook for a few minutes.", "Stir in the chicken broth.", "Add the potatoes, salt, pepper and garlic salt.", "Cook until the potatoes are fork tender, about 20 minutes.", "Blend the soup to the consistency you like.", "Stir in the heavy cream.", "Serve with shredded cheese, bacon crumbles and green onions."]}, {"type": "p", "text": "Note: The original lists chives in the ingredients and green onions in the last step; either works. From Google Drive: Disneyland Loaded Baked Potato Soup"}], "slug": "disneyland-loaded-baked-potato-soup", "cat": "Soups"}, "gnocchi-sausage-soup": {"title": "Gnocchi Sausage Soup", "meta": "Time: Not listed  |  Source: Meghan Kay", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 lb mild Italian sausage", "1 yellow onion", "1 bag of spinach", "1-2 tbsp minced garlic", "2 cups chicken broth", "2 cups heavy cream", "3 oz grated Parmesan cheese", "1 tsp each: salt, pepper, Italian seasoning, oregano, parsley, garlic & onion powder, crushed red pepper", "1 package gnocchi", "1 tbsp tomato paste"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only)."}], "slug": "gnocchi-sausage-soup", "cat": "Soups"}, "lasagna-soup": {"title": "Lasagna Soup", "meta": "Time: Simmer 10 min, then 2 min  |  Source: Sarah Kraffty", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 lb ground beef (browned & drained)", "3 cups marinara", "4 cups chicken broth", "2 cups beef broth", "1 can Italian style tomatoes (14.5oz)", "1 box oven ready lasagna noodles, broken into pieces", "1 tsp garlic powder", "1 tsp Italian seasoning", "1/2 tsp oregano", "1 cup heavy cream", "Salt and pepper, to taste"]}, {"type": "sub", "text": "Cheese mixture"}, {"type": "ul", "items": ["8 oz ricotta", "1 & 1/2 cups shredded parmesan", "1/2 tsp Italian seasoning"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Brown beef and drain. Add in the rest of the ingredients above. Cover and simmer for 10 minutes.", "Then mix together the cheese mixture: ricotta, shredded parmesan and Italian seasoning.", "Once the simmer time is up add 1 cup of heavy cream and cheese mixture, & salt/pepper to taste. Cook for an additional 2 minutes and serve."]}], "slug": "lasagna-soup", "cat": "Soups"}, "mexican-soup": {"title": "Mexican Soup", "meta": "Time: Not listed", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1/2 white onion", "2-3 cilantro (bunches)", "3 Roma tomatoes", "7 zucchinis", "8 potatoes", "1.5 cups carrots", "1.5 cups corn", "1/2 cabbage", "144 oz chicken broth"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Chop up all the veggies.", "Add oil to a large pot and add the diced potatoes, carrots and onions.", "Saute until the onions are translucent.", "Add the corn and zucchini and saute 5 minutes.", "Add the diced tomatoes, cabbage, cilantro and broth.", "Bring to a boil and reduce to a simmer."]}, {"type": "p", "text": "Note: The original says \"2-3 cilantro\" with no unit; bunches assumed. From Google Drive: Favorite Recipes"}], "slug": "mexican-soup", "cat": "Soups"}, "potsticker-soup": {"title": "Potsticker Soup", "meta": "Time: Simmer potstickers about 5-8 min  |  Source: TikTok Search Highlights (AI summary)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Frozen potstickers (pork, chicken, or veggie)", "Broth: chicken, beef, or vegetable stock", "Aromatics: garlic, ginger, and green onions", "Seasonings: soy sauce, sesame oil, and chili oil"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Sear potstickers: Heat oil in a pot, add potstickers seam-side down, and cook until golden.", "Saute aromatics: Add garlic, ginger, and green onions; cook until fragrant.", "Simmer: Pour in broth, soy sauce, and sesame oil; bring to a boil.", "Cook potstickers: Add potstickers to the broth; simmer until cooked through (about 5-8 minutes).", "Finish: Stir in chili oil and garnish with green onions."]}, {"type": "p", "text": "Note: No quantities given (AI summary). Tips: add bok choy, mushrooms, or spinach; adjust chili oil or chili flakes to taste; use bone broth or add miso paste for depth."}], "slug": "potsticker-soup", "cat": "Soups"}, "red-curry-wonton-soup": {"title": "Red Curry Wonton Soup", "meta": "Time: Cook 2-3 min, then simmer 10 min  |  Servings: 4  |  Source: Brendan Pang (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["24 x frozen wontons (or dumplings)", "A bunch of Asian greens"]}, {"type": "sub", "text": "Red Curry Soup"}, {"type": "ul", "items": ["1 tbsp vegetable oil", "1 onion, finely chopped", "1 thumb piece ginger, grated", "2 garlic cloves, minced", "4 tbsp red curry paste", "4 cups chicken stock", "1 can coconut milk", "1 1/2 tbsp caster sugar (or to taste)", "1 tbsp fish sauce (or to taste)", "Lime, juice, to taste"]}, {"type": "sub", "text": "Garnish"}, {"type": "ul", "items": ["Fresh herbs (spring onion, coriander or Thai basil)", "Long red chilli, sliced", "Fried shallots"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["To make the red curry soup, heat a vegetable oil in a large pot over medium heat. Add onion, ginger and garlic, and cook for 2 - 3 minutes, stirring until fragrant and soft.", "Add the red curry paste and cook for a further minute.", "Mix in the chicken stock, coconut milk, caster sugar and fish sauce. Bring to a boil then reduce to simmer for 10 minutes.", "Add lime juice, taste and season as desired.", "Boil wontons and Asian greens separately then transfer to serving bowls. Ladle over the hot soup then garnish with fresh herbs, chopped chilli and fried shallots."]}], "slug": "red-curry-wonton-soup", "cat": "Soups"}, "red-thai-curry-wonton-soup": {"title": "Red Thai Curry Wonton Soup", "meta": "Time: Not listed  |  Servings: 4  |  Source: saltNpiipa (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 tbsp Vegetable oil", "1/2 Onion (chopped)", "1/2 tbsp Minced ginger", "1 1/2 tbsp Minced garlic", "4 tbsp Red curry paste by Thai Kitchen", "4 cups Chicken stock", "400ml Coconut milk by Aroy-D", "1 1/2 tbsp Sugar", "1 tbsp Fish sauce", "Lime juice (from 1 lime)", "24 Wontons or Gyozas"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot. Per serving: 610 cal, 18g protein, 29g fat, 50g carbs. Inspired by Brendan Pang."}], "slug": "red-thai-curry-wonton-soup", "cat": "Soups"}, "roasted-broccoli-cheddar-soup": {"title": "Roasted Broccoli Cheddar Soup", "meta": "Time: Roast broccoli 15-20 min at 400F  |  Source: exquicydtaste", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 large heads of broccoli, cut small", "8 oz shredded carrots", "1.5 cups milk", "1 cup heavy cream", "3 cups water or chicken broth", "1/4 cup flour", "4 TBSP butter", "1/2 onion, diced", "3-4 minced garlic cloves", "2 cups freshly shredded cheddar (1 cup mild & 1 cup sharp)", "1/4 tsp nutmeg", "2 TBSP each: garlic powder, onion powder, black or white pepper, adobo or all purpose seasoning", "2 TBSP chicken bouillon", "Neutral oil (for roasting broccoli)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Coat broccoli in neutral oil and roast in the oven for 15-20 min at 400F before adding to soup."]}, {"type": "p", "text": "Note: Panera dupe. Remaining steps not shown in screenshot (video only)."}], "slug": "roasted-broccoli-cheddar-soup", "cat": "Soups"}, "roasted-tomato-soup": {"title": "Roasted Tomato Soup", "meta": "Time: Not listed  |  Source: Zealand (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["8 Roma tomatoes", "1 large Red onion", "2 heads of garlic", "Olive oil to coat", "Salt and pepper to cover", "3/4 cup Olive oil (to drizzle while blending)", "1/2 cup fresh basil", "1 tbsp Balsamic vinegar", "1 cup Veggie stock", "1/2 cup Heavy cream", "Salt and pepper to taste", "Heavy cream to garnish"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Roast the tomatoes, onion and garlic in a 300 degree oven (from video caption)."]}, {"type": "p", "text": "Note: Steps not shown in screenshot; only the roasting line appears, as a video caption."}], "slug": "roasted-tomato-soup", "cat": "Soups"}, "roasted-tomato-soup-home-version": {"title": "Roasted Tomato Soup (Home Version)", "meta": "Time: Roast 45 min at 400F", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["20 Roma tomatoes, halved", "4 heads of garlic", "2 red onions, quartered", "Lots of basil", "1 cup olive oil", "2 cups vegetable stock", "Oregano", "Balsamic vinegar", "1 cup heavy cream"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Halve the tomatoes and garlic. Quarter the onions.", "Place everything on roasting pans and roast at 400 degrees for 45 minutes.", "Once roasted, remove the tomato skins.", "Place the garlic, tomatoes and onions in a blender.", "Add the basil, vegetable stock and oregano and blend until smooth.", "Add the olive oil and blend to incorporate.", "Add the heavy cream."]}, {"type": "p", "text": "Note: A bigger batch than the Roasted Tomato Soup from TikTok, with full steps. From Google Drive: Roasted Tomato Soup"}], "slug": "roasted-tomato-soup-home-version", "cat": "Soups"}, "chicken-pasta-salad-with-creamy-dill-dressing": {"title": "Chicken Pasta Salad with Creamy Dill Dressing", "meta": "Time: Not listed  |  Servings: 4  |  Source: wholesomebysarah (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cups cooked pasta (creator used spirals)", "1 cup spinach, chopped", "2 cups cooked chicken, chopped", "1 cucumber, diced", "1.5 cups cherry tomatoes, halved", "1/2 cup sun dried tomatoes, chopped", "1/2 red onion, finely diced", "1/2 cup parsley, chopped", "1/3 cup feta, crumbled"]}, {"type": "sub", "text": "Creamy dill dressing"}, {"type": "ul", "items": ["1/2 Greek yoghurt (unit not given, likely cup)", "1 tsp onion powder", "1/4 cup dill, chopped", "1 tsp minced garlic (jarred or fresh)", "2 tbsp apple cider vinegar", "1 tbsp extra virgin olive oil", "Sea salt and pepper"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["In a large bowl, add the cooked pasta, spinach, chicken, cucumber, cherry tomatoes, sun dried tomatoes, red onion, parsley and feta. Toss together and season well.", "For the dressing, mix all the ingredients together in a small bowl or jug. Adjust to taste. If it's too thick, add a teaspoon of water at a time until you reach your desired consistency.", "Pour the dressing over the salad. Toss gently to combine. Check the seasoning and enjoy."]}, {"type": "p", "text": "Note: Saved from Instagram: https://www.instagram.com/p/CgjAmHMvE41/"}], "slug": "chicken-pasta-salad-with-creamy-dill-dressing", "cat": "Sides and Salads"}, "coleslaw": {"title": "Coleslaw", "meta": "Time: Not listed  |  Source: Spend With Pennies (spendwithpennies.com)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Salad (shown at 2x)"}, {"type": "ul", "items": ["8 cups shredded green cabbage", "2 cups shredded red cabbage", "2 cups shredded carrot"]}, {"type": "sub", "text": "Dressing (shown at 2x)"}, {"type": "ul", "items": ["1 cup mayonnaise", "2 tablespoons white vinegar", "1 tablespoon apple cider vinegar", "4 teaspoons granulated sugar", "1 teaspoon celery seed", "Salt and black pepper to taste"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot. First screenshot is the 2x scaled recipe. Second screenshot shows 1x amounts: 1 cup shredded red cabbage, 1 cup shredded carrot, 1/2 cup mayonnaise, 1 tablespoon white vinegar, 1/2 tablespoon apple cider vinegar, 2 teaspoons granulated sugar, 1/2 teaspoon celery seed, salt and black pepper to taste (1x green cabbage line cut off)."}], "slug": "coleslaw", "cat": "Sides and Salads"}, "crispy-baked-potato-halves": {"title": "Crispy Baked Potato Halves", "meta": "Time: Bake 30-40 min at 425F  |  Source: Mimi's Kitchen (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 large Russet potatoes", "1-1 1/2 tablespoons olive oil", "2 tablespoons salted butter", "1/4-1/3 cup shredded Parmesan", "Kosher salt", "Ground black pepper", "Grated cheddar cheese", "Chopped scallions and chives", "Optional: chopped cooked bacon or other toppings"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven to 425F. Line a half sheet pan with parchment paper.", "Scrub the potatoes clean. Cut lengthwise. Brush both sides with olive oil. Sprinkle well with kosher salt (or garlic salt) and black pepper.", "On the parchment paper, lay down two small pats of butter per potato. Sprinkle the area where each potato will lie with shredded Parmesan. Press each potato half down onto the butter and Parmesan.", "Bake for 30-40 minutes until the potatoes are tender and golden crispy brown.", "Remove from the oven, slice lengthwise, and squeeze the potato to loosen. Top with your favorite toppings: butter, sour cream, grated cheese, scallions, chives, chopped bacon, salt and pepper."]}, {"type": "p", "text": "Note: Saved from TikTok: https://www.tiktok.com/@mimis.kitchen__/video/7520080296079822135"}], "slug": "crispy-baked-potato-halves", "cat": "Sides and Salads"}, "crispy-roast-potatoes": {"title": "Crispy Roast Potatoes", "meta": "Time: Not listed  |  Source: Foodiligence (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["5 lbs (1.4 kg) potatoes, Yukon Gold or Russet, peeled optional", "2 tbsp kosher salt", "1/2 tsp baking soda", "6 tbsp duck fat", "3 sprigs fresh rosemary", "1 head of garlic", "1/2 tsp black pepper", "1/4 cup parsley", "1/3 cup Parmesan cheese"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Part of the creator's Potatoes 101 series. Saved from Instagram: https://www.instagram.com/p/Db_lUHtp2Y6/"}], "slug": "crispy-roast-potatoes", "cat": "Sides and Salads"}, "cucumber-prawn-salad": {"title": "Cucumber Prawn Salad", "meta": "Time: Not listed  |  Servings: 1 bowl", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["200g cucumber", "40g avocado", "100g cooked prawns (or imitation crab)", "50g light Philadelphia", "15g Kewpie mayo", "Splash of light soy sauce", "Pinch of MSG"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot (video only). No-cook. Macros (whole bowl): 306 calories, 21g protein, 19g fat, 11g carbs."}], "slug": "cucumber-prawn-salad", "cat": "Sides and Salads"}, "cucumber-yogurt-salad": {"title": "Cucumber Yogurt Salad", "meta": "Time: 10 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cucumbers, peeled and chopped", "1/4 red onion, chopped and soaked in water", "1/4 cup fresh dill, chopped", "3/4 cup sour cream", "1/4 cup Greek yogurt", "Juice of 1/2 lemon", "7 oz feta cheese, diced", "Salt and pepper to taste"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not written in the original."}, {"type": "p", "text": "Note: From Google Drive: Mediterranean Recipes"}], "slug": "cucumber-yogurt-salad", "cat": "Sides and Salads"}, "jennifer-aniston-salad": {"title": "Jennifer Aniston Salad", "meta": "Time: 15 min (with cooked quinoa)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 cup cooked and cooled quinoa", "2 (15 oz) cans chickpeas, rinsed and drained", "2 cucumbers, chopped", "1/2 red onion, finely chopped", "1 cup chopped fresh parsley", "1 cup chopped fresh mint", "2 blocks feta cheese, crumbled", "1/4 cup extra virgin olive oil (for dressing)", "1/4 cup fresh lemon juice", "Salt and black pepper, to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Make sure the quinoa (or bulgur wheat) is fully cooked and cooled to room temperature so the salad doesn't get soggy.", "Finely chop the cucumber, red onion, parsley, mint, and pistachios. Rinse and drain the chickpeas.", "In a small jar or bowl, whisk together the olive oil, lemon juice, salt, and pepper until emulsified.", "In a large bowl, gently combine the quinoa, chickpeas, cucumber, red onion, parsley, mint, pistachios, and feta.", "Pour the dressing over the salad and toss lightly until everything is coated.", "Taste and adjust with more salt, pepper, or lemon juice. Serve right away or chill for later."]}, {"type": "p", "text": "Note: The steps call for pistachios, but no amount is listed (the similar Quinoa Chickpea Salad uses 1/2 cup, chopped). From Google Drive: Jennifer Aniston Salad"}], "slug": "jennifer-aniston-salad", "cat": "Sides and Salads"}, "mediterranean-salad": {"title": "Mediterranean Salad", "meta": "Time: 15 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["15-20 cherry tomatoes, halved", "2 cucumbers, peeled and chopped", "1/4 red onion, chopped and soaked in water", "7 oz feta cheese, diced", "1/3 cup fresh dill, chopped", "1 can green olives", "Juice of 1/2 lemon", "Salt to taste", "1/4 cup olive oil"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not written in the original."}, {"type": "p", "text": "Note: From Google Drive: Mediterranean Recipes"}], "slug": "mediterranean-salad", "cat": "Sides and Salads"}, "mexican-zucchini-with-cheese-calabacitas": {"title": "Mexican Zucchini with Cheese (Calabacitas)", "meta": "Time: Not listed  |  Source: ale.reeg (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 Mexican zucchini", "3 small tomatoes", "1 serrano pepper", "1/4 onion", "1 garlic clove", "1 cup of corn", "Pepperjack cheese", "Salt", "Black pepper", "Cumin"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Saved from Instagram: https://www.instagram.com/p/C4RkVTxpVCu/"}], "slug": "mexican-zucchini-with-cheese-calabacitas", "cat": "Sides and Salads"}, "potato-salad": {"title": "Potato Salad", "meta": "Time: Not listed  |  Source: foodiecrush.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Potato Salad"}, {"type": "ul", "items": ["3 pounds Yukon Gold potatoes, skin on (choose medium-sized potatoes)", "1 teaspoon kosher salt (optional for adding flavor to potatoes)", "3 tablespoons white vinegar", "2 celery stalks (ribs), diced", "6 green onions, diced", "5 hard-boiled eggs, peeled"]}, {"type": "sub", "text": "Dressing"}, {"type": "ul", "items": ["1 1/2 cups Miracle Whip, or mayonnaise if you prefer", "1 tablespoon yellow mustard", "1 1/2 teaspoons celery seed", "3/4 teaspoon kosher salt", "3/4 teaspoon freshly ground black pepper", "paprika, for garnish"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot"}], "slug": "potato-salad", "cat": "Sides and Salads"}, "poutine": {"title": "Poutine", "meta": "Time: About 20 min, plus fries", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 tablespoons cornstarch", "2 tablespoons water", "6 tablespoons unsalted butter", "1/4 cup unbleached all-purpose flour", "20 oz beef broth", "10 oz chicken broth", "Pepper, to taste", "1 - 1 1/2 cups white cheddar cheese curds (or torn chunks of mozzarella)", "Fried or baked fries"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Make the gravy: in a small bowl, dissolve the cornstarch in the water and set aside.", "In a large saucepan, melt the butter. Add the flour and cook, stirring regularly, about 5 minutes, until golden brown.", "Add the beef and chicken broth and bring to a boil, whisking. Stir in about half the cornstarch mixture and simmer a minute or so. Add more in small amounts if you want it thicker. Season with pepper and salt to taste. Keep warm until the fries are ready.", "Put the fries in a large bowl and season lightly with salt while still warm. Add a ladle of hot gravy and toss with tongs. Add more gravy as needed to mostly coat the fries.", "Add the cheese curds and toss with the hot fries and gravy. Finish with freshly ground pepper and serve immediately."]}, {"type": "p", "text": "Note: From Google Drive: Poutine Recipe"}], "slug": "poutine", "cat": "Sides and Salads"}, "quinoa-chickpea-salad-with-lemon-dressing": {"title": "Quinoa Chickpea Salad with Lemon Dressing", "meta": "Time: Not listed  |  Source: iowagirleats.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["2 cups chicken or vegetable stock", "1 cup dry quinoa", "15 oz can chickpeas, drained and rinsed", "1 English cucumber, chopped", "1/2 small red onion, minced", "1/2 cup packed fresh parsley, finely chopped", "1/2 cup loosely-packed fresh mint leaves, finely chopped", "1/2 cup roasted salted pistachios, chopped", "1 cup crumbled feta cheese (4 oz)", "Salt and pepper, to taste"]}, {"type": "sub", "text": "For the Lemon Dressing"}, {"type": "ul", "items": ["1/2 cup lemon juice (~3-4 lemons)", "1/2 cup extra virgin olive oil", "1 Tablespoon honey", "Salt and pepper, to taste"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshots (ingredients only). IMG_5387 is a second capture of the same ingredient list."}], "slug": "quinoa-chickpea-salad-with-lemon-dressing", "cat": "Sides and Salads"}, "scalloped-potatoes": {"title": "Scalloped Potatoes", "meta": "Time: Bake about 1 hr 30 min at 350F, rest 20 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1/4 cup salted butter", "1 large yellow onion, diced", "2 cloves garlic, minced", "1/4 cup all-purpose flour", "2 cups milk", "1 cup chicken broth", "1 1/4 teaspoons salt, divided", "1/2 teaspoon black pepper, divided", "3 pounds Yukon gold or red potatoes, sliced about 1/8-inch thick"]}, {"type": "h", "text": "Directions"}, {"type": "sub", "text": "Prep"}, {"type": "ol", "items": ["Preheat the oven to 350F. Grease a 9x13-inch casserole dish and set aside."]}, {"type": "sub", "text": "Make the sauce"}, {"type": "ol", "items": ["In a large saucepan, melt the butter over medium-low heat.", "Add the onion and garlic and cook until the onion begins to soften, about 3 to 4 minutes.", "Stir in the flour and cook for 2 minutes more.", "Combine the milk and broth. Gradually add it to the flour mixture, whisking until smooth after each addition. It will be very thick at first; keep adding a little liquid at a time while whisking.", "Once all the liquid is in, increase the heat to medium and bring to a boil while whisking.", "Stir in 1/2 teaspoon salt and 1/8 teaspoon pepper and let the sauce boil for 1 minute."]}, {"type": "sub", "text": "Assemble"}, {"type": "ol", "items": ["Layer 1/3 of the potatoes in the prepared dish, seasoning with 1/4 teaspoon salt and 1/8 teaspoon pepper.", "Pour 1/3 of the cream sauce over the top.", "Repeat the layers, including salt and pepper, ending with sauce."]}, {"type": "sub", "text": "Bake and rest"}, {"type": "ol", "items": ["Cover tightly with foil and bake for 45 minutes.", "Uncover and bake another 35-45 minutes, until golden brown and the potatoes are tender. Broil 3-4 minutes if desired.", "Let rest at least 20 minutes before serving."]}, {"type": "p", "text": "Note: Yellow or red potatoes don't need peeling; peel russets. Up to 2 cups of shredded sharp cheddar or gruyere can go into the sauce (off the heat, after boiling) or between the layers. Thyme or rosemary are good additions. Can be made up to 48 hours ahead. From Google Drive: Scalloped Potatoes Recipe"}], "slug": "scalloped-potatoes", "cat": "Sides and Salads"}, "scott-s-german-potato-salad": {"title": "Scott's German Potato Salad", "meta": "Time: About 30 min", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["12-15 small potatoes, Yukon and red", "2 tablespoons fresh dill", "2 cups Claussen dill pickles, diced", "2 cups celery, diced", "1 cup red onion, diced", "1 lb bacon, diced", "2-4 hard-boiled eggs, roughly chopped"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Boil the cubed potatoes until soft but still holding together. Drain.", "Place the hot potatoes in a mixing bowl and add 2 tablespoons of pickle juice, salt and pepper.", "Fold in the diced pickles, celery, and onion.", "Sprinkle the dill over the top.", "Add egg and bacon as desired."]}, {"type": "p", "text": "Note: The original lists \"2.4 hardboiled eggs\", read as 2-4. From Google Drive: Favorite Recipes"}], "slug": "scott-s-german-potato-salad", "cat": "Sides and Salads"}, "spicy-cucumber-salad": {"title": "Spicy Cucumber Salad", "meta": "Time: Not listed  |  Source: Ian Fujimoto (iankyo) (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["Persian cucumbers (8-10)", "Salt (a lot)", "Soy sauce (6 tbsp)", "Sesame oil (2 tbsp)", "Mirin (3 tbsp)", "Sugar (1 tbsp)", "Chili garlic sauce (2 tbsp)", "Rice vinegar (2 tbsp)", "Garlic (2 cloves)", "Sesame seeds (as much as you like)"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the TikTok caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Saved from TikTok: https://www.tiktok.com/@iankyo/video/7366333814773239083"}], "slug": "spicy-cucumber-salad", "cat": "Sides and Salads"}, "spicy-garlic-roasted-cauliflower": {"title": "Spicy Garlic Roasted Cauliflower", "meta": "Time: Roast 25-30 min at 425F  |  Source: Mediterranean Recipes", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 medium cauliflower, cut into florets", "3 tablespoons olive oil (or any cooking oil)", "4-5 garlic cloves, thinly sliced", "2 tablespoons soy sauce", "1 tablespoon chili sauce (like Sriracha or any hot sauce)", "1 tablespoon oyster sauce (optional for richer flavor)", "1 teaspoon honey or brown sugar", "½ teaspoon paprika or chili flakes (adjust to spice preference)", "Salt to taste", "Freshly ground black pepper", "2-3 green onions, chopped", "Optional: small squeeze of lemon or lime juice for freshness"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat oven or pan: Preheat your oven to 220°C (425°F). If pan-frying, use a large non-stick pan or wok over medium-high heat.", "Prepare cauliflower: Wash and thoroughly dry the cauliflower florets.", "Make the sauce: In a small bowl, mix soy sauce, chili sauce, oyster sauce, honey, paprika, and a pinch of salt and pepper. Set aside.", "Cook cauliflower: Toss the cauliflower in oil and a bit of salt. For roasting: spread on a baking sheet and roast 25-30 minutes, turning halfway until golden and crispy. For pan-frying: fry in batches until golden brown and tender.", "Saute garlic and sauce: In a separate pan, heat 1 tablespoon oil over medium heat. Add sliced garlic and saute until golden brown (don't burn it). Pour in the sauce mixture and cook for 30-40 seconds until it slightly thickens.", "Combine everything: Add the roasted or fried cauliflower to the pan and toss to coat evenly. Add green onions and stir well for 1-2 minutes.", "Finish and serve: Taste and adjust seasoning if needed. Serve warm as a side dish or a light main."]}], "slug": "spicy-garlic-roasted-cauliflower", "cat": "Sides and Salads"}, "tuna-salad-with-greek-yogurt-dressing": {"title": "Tuna Salad with Greek Yogurt Dressing", "meta": "Time: Not listed  |  Source: amateurprochef", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Salad"}, {"type": "ul", "items": ["Tuna in water (yellowfin), 2 cans", "Green onions, 0.5 stalk", "Mini cucumbers, 3", "Red onion, 0.5 large", "Dill, 2 tbsp", "Gherkins (pickles), 8 small"]}, {"type": "sub", "text": "Dressing"}, {"type": "ul", "items": ["Greek yogurt 0%, 1 cup", "Light mayo, 3 tbsp", "Mustard, 1 tbsp", "Pickle juice, 1 tbsp", "Paprika, 1 tsp", "Salt, 0.5 tsp"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Steps not shown in screenshot. Video also shows corn, which is not in the written list."}], "slug": "tuna-salad-with-greek-yogurt-dressing", "cat": "Sides and Salads"}, "chicken-elote-stuffed-zucchini": {"title": "Chicken Elote Stuffed Zucchini", "meta": "Time: Bake 12-15 min at 425  |  Servings: 2 stuffed zucchini halves  |  Source: thedailykale", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 Zucchini", "1/2 cup Chicken (shredded/chopped)", "1/2 cup Corn", "1/4-1/2 cup Shredded cheese", "2 tbsp cream cheese", "1/4 tsp garlic powder", "1/2 tsp tajin", "Heavy Pinch of: chili powder, paprika & salt", "1 tbsp green onions (chopped)", "1 tbsp cilantro (chopped)"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cut your zucchini in half and scoop out the inside.", "Cook corn in a pan and remove from heat and add the rest of ingredients in the pan or to a bowl. Stir until combined. Place mixture in the zucchini halves evenly.", "Bake at 425 for 12-15 minutes, or until cheese has melted. I added cotija, my chipotle mayo, cilantro and tajin."]}, {"type": "p", "text": "Note: To make it more of a meal, serve with rice and beans on the side. This makes 2 stuffed zucchini halves, so double up as needed."}], "slug": "chicken-elote-stuffed-zucchini", "cat": "Main Dishes"}, "chicken-shawarma": {"title": "Chicken Shawarma", "meta": "Time: Not listed  |  Source: Sonny Hurrell (thatdudecancook)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["3 pounds chicken thighs", "1/2 cup yoghurt", "5 garlic cloves, minced", "1 tbsp coriander powder", "1 tbsp cumin powder", "2 tsp cardamom powder", "1 tbsp white vinegar", "1 tbsp red chili powder", "1 tbsp onion powder", "1 tbsp smoked paprika", "Juice of 1 lemon 2 tbsp", "1/4 cup olive oil", "2 tsp salt", "2 tsp black pepper"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not shown in screenshot."}, {"type": "p", "text": "Note: Yoghurt sauce ingredients cut off; steps not shown in screenshot."}], "slug": "chicken-shawarma", "cat": "Main Dishes"}, "chilaquiles-rellenos": {"title": "Chilaquiles Rellenos", "meta": "Time: Not listed  |  Source: big.eats.world (Instagram)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["6 tomatillos", "2 jalapenos", "Half an onion", "2 garlic cloves", "1 small bunch cilantro", "Chicken bouillon to taste", "Corn flour", "Water to mix with the corn flour", "Monterey Jack cheese", "Oil for frying", "Mexican crema", "Queso fresco", "Red onion"]}, {"type": "h", "text": "Directions"}, {"type": "p", "text": "Not listed in the Instagram caption."}, {"type": "p", "text": "Note: Steps not listed in the caption. Caption says \"Quede fresco\", read as queso fresco. Saved from Instagram: https://www.instagram.com/p/C5q1wT1RAwE/"}], "slug": "chilaquiles-rellenos", "cat": "Main Dishes"}, "chile-relleno-casserole": {"title": "Chile Relleno Casserole", "meta": "Time: Not listed  |  Source: Karina Valladares (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "For the casserole"}, {"type": "ul", "items": ["6 poblano peppers", "20 oz Oaxaca cheese", "Cooking spray"]}, {"type": "sub", "text": "For the egg batter"}, {"type": "ul", "items": ["6 eggs (at room temperature)", "1/2 tsp baking powder", "1/3 cup all purpose flour", "1/4 cup of milk", "Salt and pepper to taste"]}, {"type": "sub", "text": "For the salsa"}, {"type": "ul", "items": ["5 tomatoes", "1/4 white onion", "1 jalapeño pepper", "2 garlic cloves", "1 tortilla", "2 tsp chicken bouillon", "1/2 tsp oregano", "1/3 cup water", "Salt to taste"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Start by roasting the six poblano peppers (from video caption)."]}, {"type": "p", "text": "Note: Steps not shown in screenshot; only the first step appears, as a video caption."}], "slug": "chile-relleno-casserole", "cat": "Main Dishes"}, "chipotle-copycat-barbacoa": {"title": "Chipotle Copycat Barbacoa", "meta": "Time: Active 25 min, total 6 hr 15 min (slow cooker)  |  Servings: 12", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "sub", "text": "Meat"}, {"type": "ul", "items": ["2 teaspoons kosher salt, divided", "4 pounds chuck roast, fat trimmed", "2 tablespoons extra virgin olive oil", "2 bay leaves"]}, {"type": "sub", "text": "Sauce"}, {"type": "ul", "items": ["1/4 cup apple cider vinegar", "6 cloves garlic", "4 teaspoons ground cumin", "1 tablespoon dried oregano", "1 teaspoon ground black pepper", "1/8 teaspoon ground clove", "4 chipotle peppers in adobo sauce (canned)", "1 tablespoon adobo sauce from the can", "1 cup chicken broth (or 1 cup water and 1 teaspoon chicken base)", "1/4 cup fresh lime juice"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Trim all visible fat from the roast. Rinse in cold water and pat dry with paper towels so it sears instead of steams. Cut into 8 chunks and sprinkle all sides with half the salt (1 teaspoon).", "Blend all the sauce ingredients until smooth.", "Heat a Dutch oven over medium-high until a drop of water sizzles. Add the oil and sear all sides of the beef until well crusted. Don't skip this step.", "Move the beef to a slow cooker set to high. Pour the sauce over the top and add the bay leaves. Cover and cook 5-6 hours on high (or 8 hours on low).", "After about 5 hours (7 on low), shred the beef with 2 forks. Taste and add the remaining teaspoon of salt as needed, stirring to coat.", "Cover and cook 1 more hour. Serve, or keep on warm until ready."]}, {"type": "p", "text": "Note: From Google Drive: Pozole Green Chicken / Barbacoa"}], "slug": "chipotle-copycat-barbacoa", "cat": "Main Dishes"}, "coconut-curry-baked-dumplings": {"title": "Coconut Curry Baked Dumplings", "meta": "Time: Bake 15-20 min at 375F (up to 30 min depending on dumplings)  |  Source: snackingemily.com", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 14-ounce can lite coconut milk", "3 tablespoons Thai red curry paste (see note 1)", "3 garlic cloves, minced", "3 tablespoons soy sauce (use 1 tablespoon if sensitive to salt)", "2 teaspoons fish sauce (optional, see note 2)", "2 teaspoons sesame oil", "3 cups spinach", "14-20 frozen dumplings (based on your baking dish size)", "1/4 cup chopped cilantro, for garnish", "1/4 cup sliced scallion greens, for garnish", "1 tablespoon sesame seeds, for garnish", "1-2 tablespoons chili crisp, for garnish"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Preheat the oven: Set your oven to 375F to get it ready while you prep.", "Make the curry broth: In a 9x9 baking dish or 3.5-quart oven-safe braiser, add the coconut milk, curry paste, garlic, soy sauce, fish sauce, and sesame oil. Whisk until smooth and the Thai red curry paste has dissolved into the coconut milk.", "Add the spinach: Toss the spinach into the dish and stir so the leaves are fully coated and evenly distributed across the base.", "Nestle the dumplings: Arrange the frozen dumplings pinched-side down in the baking dish. Spoon some of the liquid over the top of each dumpling.", "Bake covered: Cover the dish tightly with a lid or foil and bake for 15-20 minutes, or until the dumplings are tender and cooked through (this may take up to 30 minutes for some, depending on the dumplings used)."]}, {"type": "p", "text": "Note: Directions cut off after step 5; top of ingredient list may also be cut off. Notes 1 and 2 not shown."}], "slug": "coconut-curry-baked-dumplings", "cat": "Main Dishes"}, "cowboy-butter-chicken": {"title": "Cowboy Butter Chicken", "meta": "Time: Prep 10 min, Cook 20 min  |  Servings: 4  |  Source: crumbs&chaos (TikTok)", "blocks": [{"type": "h", "text": "Ingredients"}, {"type": "ul", "items": ["1 pound boneless, skinless chicken breasts", "12 ounces linguine pasta", "2 tablespoons olive oil", "3 tablespoons butter", "4 cloves garlic, minced", "1 tablespoon Dijon mustard", "1 teaspoon paprika", "1/4 teaspoon red pepper flakes (optional)", "2 tablespoons lemon juice", "1 teaspoon lemon zest", "1/4 cup fresh parsley, chopped", "1/2 cup chicken broth or reserved pasta water", "1 cup heavy cream", "1/2 cup grated parmesan cheese", "Salt and black pepper"]}, {"type": "h", "text": "Directions"}, {"type": "ol", "items": ["Cook pasta: Boil linguine in salted water, reserving 1/2 cup water. Drain and set aside.", "Cook chicken: Saute seasoned chicken in olive oil until browned and cooked through; remove.", "Make sauce: In same pan, melt butter with garlic, paprika, and red pepper flakes (1 min). Add Dijon, lemon juice/zest, and broth (or pasta water), scraping browned bits.", "Finish sauce: Stir in cream and half the parsley; simmer 2 min until sli
